packages:
  - packages/*
  - frontend
  - apps/mission-control
  - tools/vscode-extension

# বাংলা (#3161): আগে এখানে 15টি overlapping dompurify override + 2টি qs +
# 2টি sharp range ছিল — duplicate keys, parser-ambiguous, এবং policy reasoning
# কঠিন। এখন প্রতিটি dependency-র জন্য একটাই canonical rule: most-restrictive
# minimum version (সবচেয়ে উঁচু floor জেতে — কারণ প্রতিটি override একই security
# floor-কে আরও উপরে তুলছিল, সবচেয়ে উঁচুটাই সবার superset)।
#
# Canonicalization logic:
#   dompurify: সব overrides-এর মধ্যে সর্বোচ্চ floor = >=3.4.13 (from `<=3.4.12`)
#   qs:        উভয় override একই floor চায় = >=6.16.0
#   sharp:     সর্বোচ্চ floor = >=0.35.4 (from `<0.35.4`)
#   বাকি dependencies ইতিমধ্যে single-rule ছিল — unchanged।
overrides:
  deepmerge-ts@<8.0.0: '>=8.0.0'
  dompurify: '>=3.4.13'
  js-yaml: '>=4.3.2'
  mysql2@<3.22.0: '>=3.22.0'
  prismjs@<1.30.0: '>=1.30.0'
  qs: '>=6.16.0'
  sharp: '>=0.35.4'
  valibot@<=1.4.1: '>=1.4.2'
