[pytest]
testpaths = tests core/tests gateway/tests
pythonpath = . core
addopts = -ra --tb=short
asyncio_mode = auto
markers =
    critical: fast, merge-blocking tests for core production paths
    tier1: fast unit tests
    tier2: integration tests
    tier3: end-to-end tests
    memory: marks tests for memory subsystems
    auth: marks tests for authentication and authorization
    slow: marks slow-running integration tests
