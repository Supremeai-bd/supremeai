[pytest]
testpaths = tests core/tests gateway/tests
pythonpath = . core
addopts = -ra --tb=short
asyncio_mode = auto
# Pin the loop scope for async fixtures. pytest-asyncio 0.24+ warns on every
# run when this is unset and plans to change the default, which would silently
# change fixture-loop sharing in every async test.
asyncio_default_fixture_loop_scope = function
markers =
    critical: fast, merge-blocking tests for core production paths
    tier1: fast unit tests
    tier2: integration tests
    tier3: end-to-end tests
    memory: marks tests for memory subsystems
    auth: marks tests for authentication and authorization
    slow: marks slow-running integration tests
    external: marks tests requiring provider infrastructure
    requires_network: marks tests requiring live network access
    hitl: marks tests requiring human intervention
    e2e: marks live end-to-end integration tests
