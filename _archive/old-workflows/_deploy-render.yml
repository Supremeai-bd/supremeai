# ==============================================================================
# _deploy-render.yml — Deploy to Render (User + Admin + Combined Backend)
# ==============================================================================
# Extracted from supreme-core-ci.yml (lines 1156-1580)
# Called via workflow_call from the orchestrator.
# ==============================================================================

name: 🚀 Deploy Render

on:
  workflow_call:
    inputs:
      admin_backend_changed:
        description: 'Whether admin backend files changed'
        type: boolean
        required: false
        default: false
      customer_backend_changed:
        description: 'Whether customer backend files changed'
        type: boolean
        required: false
        default: false
      use_github_build:
        description: 'Whether to use GitHub built images for Render deploy'
        type: boolean
        required: false
        default: true

jobs:
  deploy-user-backend:
    name: 🚀 Deploy User Backend (Render)
    if: github.repository != 'SaifulHaqueNiloy/supremeai'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trigger User Render Deploy (Prebuilt Image)
        if: inputs.use_github_build == 'true'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${OWNER_LOWER}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          PRIMARY_SVC_ID="${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-d9d3n58js32c738n79k0' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Primary Render deploy triggered via API with prebuilt image (status: $STATUS)!"
          else
            echo "❌ Primary API deploy with prebuilt image returned status: $STATUS"
            exit 1
          fi
      - name: Trigger User Render Deploy (Source Code)
        # বাংলা মন্তব্য: quota available থাকলে (use_github_build=false) Render-এর নিজস্ব build system ব্যবহার করতে হবে।
        # imageUrl পাঠালে Render নিজে build করে না — শুধু deploy trigger করতে হবে।
        if: inputs.use_github_build != true
        run: |
          PRIMARY_SUCCESS=false
          PRIMARY_SVC_ID="${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-d9d3n58js32c738n79k0' }}"

          if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "🔄 Quota available — triggering Render native build for primary (no imageUrl)..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Primary Render deploy triggered via API (status: $STATUS)!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary API deploy returned status: $STATUS"
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ]; then
            PRIMARY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            if [ -n "$PRIMARY_HOOK" ]; then
              echo "🔄 Triggering primary Render via deploy webhook..."
              if curl -f -s "$PRIMARY_HOOK" > /dev/null; then
                echo "✅ Primary Render deploy triggered via webhook!"
                PRIMARY_SUCCESS=true
              else
                echo "⚠️ Primary webhook failed."
              fi
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy triggers succeeded for User backend!"
            exit 1
          fi
      - name: Verify User Backend Deploy Status
        run: |
          python .github/scripts/verify-render-deploy.py --service-id "${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-d9d3n58js32c738n79k0' }}" --name "User Backend"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}

  # ============================================================================
  # বাংলা মন্তব্য: SaifulHaqueNiloy/supremeai (ডেভেলপার রিপো) শুধুমাত্র Admin Backend-এ ডিপ্লয় করবে।
  # paykaribazaronline/supremeai (প্রোডাকশন রিপো) এর জন্য এই জবটি স্কিপ করা হবে।
  # ============================================================================
  deploy-admin-backend:
    name: 🚀 Deploy Admin Backend (Render)
    if: github.repository != 'paykaribazaronline/supremeai'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trigger Admin Render Deploy (Prebuilt Image)
        if: inputs.use_github_build == 'true'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${OWNER_LOWER}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          BACKUP_SVC_ID="${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_BACKUP }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "API Response Body: $BODY"
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Admin Render deploy triggered via API with prebuilt image (status: $STATUS)!"
          else
            echo "❌ Admin API deploy with prebuilt image returned status: $STATUS"
            exit 1
          fi
      - name: Trigger Admin Render Deploy (Source Code)
        # বাংলা মন্তব্য: quota available থাকলে (use_github_build=false) Render-এর নিজস্ব build system ব্যবহার করতে হবে।
        # imageUrl পাঠালে Render নিজে build করে না — শুধু deploy trigger করতে হবে।
        if: inputs.use_github_build != true
        run: |
          BACKUP_API_KEY="${{ secrets.RENDER_API_KEY_BACKUP }}"
          BACKUP_SVC_ID="${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}"
          BACKUP_SUCCESS=false

          if [ -n "$BACKUP_API_KEY" ]; then
            echo "🔄 Quota available — triggering Render native build for admin (no imageUrl)..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
              -H "Authorization: Bearer $BACKUP_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            STATUS=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "API Response Body: $BODY"
            if [ "$STATUS" = "404" ]; then
              echo "❌ Admin service $BACKUP_SVC_ID returned 404. RENDER_API_KEY_BACKUP does not own this service."
              echo "❌ ACTION REQUIRED: Set RENDER_DEPLOY_HOOK_URL_BACKUP webhook for Admin backend in GitHub Secrets."
              exit 1
            fi
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Admin Render deploy triggered via API (status: $STATUS)!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin API deploy returned status: $STATUS"
            fi
          fi

          if [ "$BACKUP_SUCCESS" = "false" ]; then
            BACKUP_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}"
            if [ -n "$BACKUP_HOOK" ]; then
              echo "🔄 Triggering admin backend via deploy webhook..."
              if curl -f -s "$BACKUP_HOOK" > /dev/null; then
                echo "✅ Admin backup hook triggered!"
                BACKUP_SUCCESS=true
              else
                echo "⚠️ Admin backup webhook failed."
              fi
            fi
          fi

          if [ "$BACKUP_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy triggers succeeded for Admin backend!"
            exit 1
          fi
      - name: Verify Admin Backend Deploy Status
        run: |
          python .github/scripts/verify-render-deploy.py --service-id "${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}" --name "Admin Backend"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}

