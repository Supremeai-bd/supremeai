name: 🚀 Production Deploy & Canary Verification

# Triggers deployment to Render and validates health probes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'core/**'
      - 'render.yaml'

permissions:
  contents: read

concurrency:
  group: production-deploy-gate
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    name: "Deploy Render & Canary Health Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Trigger Render Core Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SVC_ID" ]; then
            python scripts/ci/render_trigger_deploy.py
          else
            echo "Render credentials not set on runner - skipping API trigger (Git auto-deploy active)"
          fi

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Post-Deploy Smoke Canary (6 Render Nodes)
        run: |
          python -c "
          import urllib.request, ssl, sys, time

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          targets = [
              ('API Gateway', 'https://supremeai-api-ulw0.onrender.com/healthz'),
              ('Primary Node', 'https://supremeai-primary-node-5xso.onrender.com/health/live'),
              ('MCP Control Tower', 'https://supremeai-mcp-tower.onrender.com/health'),
              ('Scraper Node', 'https://supremeai-scraper-node.onrender.com/health'),
              ('Worker Node', 'https://supremeai-worker-node.onrender.com/health'),
          ]

          failed = []
          for name, url in targets:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'SupremeAI-Canary/1.0'})
                  with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
                      print(f'✅ {name}: HTTP {r.status}')
              except Exception as e:
                  print(f'⚠️ {name} probe warning ({e})')
                  failed.append(name)

          if len(failed) > 2:
              print(f'❌ Canary failed: Multiple nodes down: {failed}')
              sys.exit(1)
          print('🎉 Production Canary Verified Successfully!')
          "
