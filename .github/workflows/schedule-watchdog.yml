# =============================================================================
# ⏰ Schedule Watchdog — visibility-flip cron self-heal (#58, Plan-B of #52)
# =============================================================================
# ROOT CAUSE (2026-10-09): public→private flip (~11:02Z) এর পর GitHub পুরো repo-র
# scheduled workflows বন্ধ করে দেয়; disable→enable API toggle অপর্যাপ্ত (16:43 +
# 17:13 স্লট silent)। Settings-banner ক্লিক মানুষের হাতে — fleet অপেক্ষা করতে পারে না।
#
# এই watchdog schedule-INDEPENDENT: বেঁচে থাকা ইভেন্টে (Main CI/CD completed,
# issues opened/closed/reopened, dispatch) ভ্রমণ করে এবং প্রতিটি cron-যুক্ত
# workflow-এর জন্য — cron-গণনা করে বাসি স্লট ধরলে disable→enable re-arm +
# (প্রয়োজনে) workflow_dispatch compensation চালায়। নিজেকে কখনো ধরে না (loop-guard)।
# =============================================================================
name: ⏰ Schedule Watchdog (cron self-heal)

# Workflow Diet (#67, 2026-10-09): */15 cron (96 runs/day) remains retired.
# 2026-10-10 ROOT-FIX (flip-class failure — #58 Plan-B restore): repo visibility
# flip (public→private, 2026-10-09 ~11:02Z) suspended ALL repo crons and the Diet
# left this immune system dispatch-only → dead crons could never self-heal
# (E2E-প্রমাণিত: bridge-intake cron ২৫+ স্লট নীরব, queue stuck at bridge:queued)।
# Restore rides the two most reliable fleet heartbeats — ZERO new schedule surface:
#   - Main CI/CD (every push to main)
#   - Bridge Intake (self-sustaining pair once its cron revives)
on:
  workflow_dispatch: # Manual emergency re-arm (kept by Diet #67)
  workflow_run:
    # নাম-কাপলিং (E10): GitHub `workflow_run` শুধু workflow-র **নাম** দেখে —
    # file-path বা id দিয়ে match করার উপায় নেই। তাই যে workflow-গুলো এখানে
    # তালিকাভুক্ত, তাদের `name:` বদলালে এই trigger নীরবে বন্ধ হয়ে যায় (dead cron
    # আর self-heal হয় না)। coupling machine-guard:
    # .github/scripts/constitution/tests/test_bridge_automation_contract.py
    workflows: ["Main CI/CD", "Bridge Intake (public work orders → private gates)"]
    types: [completed]
permissions:
  actions: write   # disable/enable re-arm + compensation dispatch
  contents: read   # workflow YAML পড়া

concurrency:
  group: schedule-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Watchdog sweep (re-arm dead cron + compensate missed slots)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/ci/schedule_watchdog.py
