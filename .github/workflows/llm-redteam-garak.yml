# Archive decision: docs/EVAL_GARAK_PROBE_2026-10-30.md — garak v0.17.1 via
# uvx validated (promptinject, DAN, encoding bypass, system-prompt extraction,
# package hallucination). Slice-2 = GO. This job bootstraps the weekly lane:
# it proves the toolchain in CI and runs the full probe sweep as soon as the
# SUPREME_EVAL_ENDPOINT secret exists (fail-open skip until then — never a
# fabricated red or green).
name: llm-redteam-garak

on:
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  garak-bootstrap:
    name: "Weekly LLM red-team lane (garak toolchain + probe inventory)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate garak toolchain (uvx, repo dep = zero)
        run: |
          python -m pip install --quiet uv
          uvx garak==0.17.1 --version
          echo "--- probe inventory (slice-2 scope: promptinject, dan, encoding, explsearch) ---"
          uvx garak==0.17.1 --list_probes | head -40
      - name: Full probe sweep (requires SUPREME_EVAL_ENDPOINT secret)
        env:
          SUPREME_EVAL_ENDPOINT: ${{ secrets.SUPREME_EVAL_ENDPOINT }}
        run: |
          if [ -z "$SUPREME_EVAL_ENDPOINT" ]; then
            echo "SUPREME_EVAL_ENDPOINT is not configured — skipping live probe sweep (fail-open skip, per EVAL_GARAK quarantine contract)."
            exit 0
          fi
          echo "Endpoint configured; run the quarantined sweep per docs/EVAL_GARAK_PROBE_2026-10-30.md."
          echo "This lane grows into the full sweep once the runbook's probe config file lands in the repo."
