# Audit finding 01 companion + archive P2-40: bots bypass local pre-commit
# hooks, so CI is the only gate they respect. A stray brace that boots the
# gateway into a SyntaxError must be impossible to merge.
name: syntax-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-syntax:
    name: "Compile-check every deploy-critical Python path"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: py_compile gateway / core / browser / scripts
        run: |
          set -e
          python -m compileall -q -f gateway core browser scripts
          echo "All Python deploy paths compile."

  yaml-syntax:
    name: "Validate workflow + service YAML"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml --quiet
      - name: Parse all GitHub workflows and render.yaml
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          files = list(pathlib.Path('.github/workflows').glob('*.yml')) + list(pathlib.Path('.').glob('render.yaml'))
          for f in files:
              try:
                  yaml.safe_load(f.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f"{f}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(files)} YAML files valid.")
          PY
