# বাংলা: এই workflow-টি fork-যুগের অবশেষ — এখন অচল (#68-প্রমাণিত)।
# Root cause (2026-10-09, #68):
#   ১. `paykaribazaronline/supremeai` আর fork নয় (`fork: false` — parent private হওয়ায়
#      GitHub detach করেছে) → `POST /merge-upstream` স্থায়ীভাবে **422 Validation Failed**
#      (endpoint শুধু fork-এ বৈধ)।
#   ২. দুই রিপোর ইতিহাস **সম্পূর্ণ অসম্পর্কিত** (no merge-base) — `git merge`ও অসম্ভব
#      (--allow-unrelated-histories ছাড়া, যা দুটি স্বাধীন-বিবর্তিত codebase-এর
#      বিপজ্জনক content-merge করত)।
#   ৩. Parent (SaifulHaqueNiloy/supremeai) নিজেই এখন origin — তার কোনো auto-sync নেই।
# Workflow Diet #68 সিদ্ধান্ত: schedule বন্ধ (প্রতিদিন লাল রান = শুধু noise), dispatch-only
# রাখা হলো manual ফরেনসিকের জন্য। দুই-রিপো content-unification = ADMIN_DECISION
# (topology unification issue-তে ট্র্যাকড) — সিদ্ধান্ত হলে এই ফাইল rewrite/retire হবে।
name: Auto-Sync Fork with Upstream (OBSOLETE — see #68)

on:
  workflow_dispatch: # #68: schedule retired — merge-upstream API is invalid on a detached non-fork repo (422 forever); dispatch-only for forensics
    inputs:
      reason:
        description: "কেন manual চালানো হচ্ছে (লগে প্রমাণ থাকবে)"
        required: false
        default: "forensic-run"

permissions:
  contents: read # কোনো write অপারেশন বাকি নেই — read-only forensic

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Report obsolete state (no-op, evidence-only)
        run: |
          echo "## Auto-Sync Fork with Upstream — OBSOLETE (#68)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow can no longer perform its function:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. \`paykaribazaronline/supremeai\` is \`fork: false\` (detached) — \`POST /merge-upstream\` returns 422 permanently." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Histories of the two repos are unrelated (no merge-base) — a git merge is not mechanically possible." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Content unification requires an ADMIN_DECISION on topology (see the tracking issue)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatch reason: \${{ github.event.inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::No-op forensic run — workflow is retired pending topology decision (#68)"
