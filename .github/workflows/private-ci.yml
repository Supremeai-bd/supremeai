name: Private CI and Nightly Audit

# Two-Tier Split Pipeline:
# Tier 1 (GitHub Actions): Minimal fast gates (syntax, boundary, public door, readiness)
# Tier 2 (Render Remote): Heavy full build & test suite triggered on supremeai-ci-runner

on:
  pull_request:
    paths:
      - "core/**"
      - "gateway/**"
      - "browser/**"
      - "studio/**"
      - "vscode/**"
      - "infrastructure/**"
      - "scripts/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: private-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # TIER 1: MINIMAL FAST SAFETY GATES (GitHub Actions Runners)
  # Runs ultra-fast (~30-45s) to guarantee syntax, boundary, and secret sanity
  # =========================================================================
  fast-gate:
    name: Private fast gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal linter and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx

      - name: Fast syntax & fatal error lint
        run: ruff check core/ scripts/ci/ --select E9,F63,F7,F82 --exclude core/tests/

      - name: Targeted unit test guard
        run: pytest -q tests/unit/test_telemetry_event_bus_guard.py

  runtime-readiness:
    name: Runtime readiness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify readiness contract without production secrets
        run: |
          test -f scripts/ci/readiness_contract.py
          python scripts/ci/readiness_contract.py --self-test
          # Required secrets are checked by name only; values are never printed.
          python scripts/ci/readiness_contract.py --check-required-names

      - name: Verify timeout and silent-failure policy
        run: |
          python scripts/ci/timeout_policy_guard.py --check
          python scripts/ci/silent_failure_guard.py --check

  public-door-boundary:
    name: Public door boundary check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public export allowlist
        run: python scripts/ci/public_surface_guard.py --manifest scripts/ci/public_surface_manifest.txt

  # =========================================================================
  # TIER 2: RENDER REMOTE HEAVY CI GATE (paykaribazaronline Render account)
  # Offloads heavy test execution & container build to supremeai-ci-runner
  # =========================================================================
  render-heavy-gate:
    name: Render remote heavy check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [fast-gate, runtime-readiness, public-door-boundary]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trigger & Poll Render supremeai-ci-runner
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_SVC_ID: "srv-dbl8tbmtlv9c73bbkvqg"
          RENDER_WAIT: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "600"
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SVC_ID" ]; then
            python scripts/ci/render_trigger_deploy.py
          else
            echo "::warning::RENDER_API_KEY_PAYKARI not available in context - skipping remote trigger"
          fi
