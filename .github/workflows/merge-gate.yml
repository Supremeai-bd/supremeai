# =============================================================================
# Merge Gate (Sequential Landing) — Pipeline 2 of the 3-Pipeline Law
# =============================================================================
# বাংলা মন্তব্য (Merge Gate Convergence):
#   RULE 1  PR Gate (pr.yml)   = change প্রমাণ করে
#   RULE 2  MERGE GATE (এটি)   = প্রমাণিত change land করতে পারে কি না — সিদ্ধান্ত
#   RULE 3  Main Pipeline      = land হওয়া সিস্টেম প্রমাণ করে
#
# এটি এই repo-র একমাত্র automatic landing path (RULE 6: No merge outside
# Merge Gate + explicit human emergency path)। পুরনো বিক্ষিপ্ত merge-paths:
#   - ai-pr-evaluation instant-merge (gh pr merge --admin — enforce_admins=false
#     হওয়ায় সব required-check bypass করত) → বাদ (evidence-producer থাকবে শুধু)
#   - dependabot auto-merge → --auto দিয়ে branch-protection-কে সম্মান করে,
#     কিন্তু তার smoke-gate এখন fail-closed — এটি dependency-lane হিসেবেই থাকবে
#   - merge_queue_manager.py (orphan, assumption-ভিত্তিক) → বাদ
#
# নীতি:
#   ১) কোনো টেস্ট rerun নয় — PR Gate-এর evidence consume করে (single responsibility)
#   ২) Single-flight: group=merge-gate, cancel=false — এক মুহূর্তে এক landing
#   ৩) Fail-closed: evidence-missing/fetch-fail = HOLD (কখনো merge নয়)
#   ৪) gh pr merge --squash --delete-branch — admin bypass কখনো নয়
#   ৫) scripts main-ref থেকে চলে (untrusted PR-code execution নেই — trusted plane)
# =============================================================================

name: "🚦 Merge Gate (Sequential Landing)"

on:
  workflow_run:
    workflows: ["PR Gate (Unified Pipeline)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "নির্দিষ্ট PR-এর রায় (খালি = পুরো কিউ priority-scan)"
        required: false
        default: ""
      execute:
        description: "MERGE রায় হলে সত্যিই merge করবে? (false = শুধু রায়)"
        required: false
        type: boolean
        default: true

concurrency:
  group: merge-gate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # #4291: merge gate runs the evaluator fresh — its REST check-runs fallback
  # (github.token) needs checks: read now that the repo is PRIVATE.
  checks: read

jobs:
  land:
    name: "🛬 Sequential Landing Decision"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # workflow_run: PR Gate SUCCESS হলেই — লাল gate-এ landing-চেষ্টা নেই।
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      # verdict/decision-integrity: merge-decision engine কখনো মূল্যায়িত PR-এর
      # কোড হতে পারবে না — সবসময় main-থেকেই (evaluator-এর একই চুক্তি)।
      - name: Checkout (main — decision-integrity)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge Gate decision (+ landing if MERGE)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          # #4291: evaluator REST fallback token (see ai-pr-evaluation.yml).
          GH_FALLBACK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr_number }}
          # workflow_run payload-এ same-repo PR-এর number থাকে (fork = খালি → scan)।
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          # bootstrap-টলারেন্স: engine যে PR-এ জন্মাচ্ছে সেখানে main-এ এখনো নেই।
          if [ ! -f scripts/ci/merge_gate.py ]; then
            echo "bootstrap: merge_gate.py main-এ নেই এখনো — এই PR merge-এর পর সক্রিয় হবে"
            exit 0
          fi
          TARGET="${INPUT_PR:-$WR_PR}"
          EXEC_FLAGS=""
          if [ "${INPUT_EXECUTE:-true}" = "true" ]; then
            EXEC_FLAGS="--execute"
          fi
          if [ -n "$TARGET" ]; then
            echo "🛬 Merge Gate — PR #${TARGET} রায়${EXEC_FLAGS:+ + landing}"
            python scripts/ci/merge_gate.py --pr "$TARGET" $EXEC_FLAGS
          else
            echo "🛬 Merge Gate — priority-sequential queue scan${EXEC_FLAGS:+ + landing}"
            python scripts/ci/merge_gate.py --scan $EXEC_FLAGS --limit 1
          fi
