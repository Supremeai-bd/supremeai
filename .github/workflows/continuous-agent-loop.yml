# =============================================================================
# SupremeAI Continuous Agent Loop — Simple Event-Driven Workflow
# =============================================================================
# Architectural guarantees (hard-coded, not rule-based):
#   1. Exponential backoff on claim failure — no infinite retry
#   2. Heartbeat-based orphan release — crashed agents auto-release after 30m
#   3. CI failure retry → queue:hold after 3 failures
#   4. Priority auto-escalation — P0/P1 queues never starve
#
# Flow:
#   1. Check if open issues exist
#   2. If not, run full audit → create issues
#   3. Auto-escalate priorities (P0/P1/P2)
#   4. Agent acquires next issue via acquire_role_slot.py
#   5. Agent claims via atomic_claim.sh with exponential backoff
#   6. Agent executes (fix, test, PR)
#   7. Loop
# =============================================================================

name: Continuous Agent Loop

# #3031: serialize pipeline-failure-register scans — prevent concurrent-create race
concurrency:
  group: pipeline-failure-register
  cancel-in-progress: false

on:
  issues:
    types: [opened]  # COST OPTIMIZATION: only 'opened' (was opened/closed/reopened)
    # বাংলা: শুধু 'opened' রাখা হয়েছে — নতুন issue এলে agent loop দ্রুত claim করতে পারে।
    # closed/reopened ইভেন্ট issue-ops.yml দিয়ে handle হয় (ledger re-rank)।
    # সাশ্রয়: closed + reopened events বাদ (৬-৭ runs/day কম)।
    # Agent latency: নতুন issue = real-time (opened event), closed = hourly cron পর্যন্ত।
  # COST OPTIMIZATION: workflow_run trigger REMOVED entirely.
  # বাংলা: workflow_run প্রতিটি PR Gate / CI complete হলে ফায়ার করত — ১৫ runs/day
  # শুধু workflow_run থেকে, যার বেশিরভাগই SUCCESS (ci-failure-handler skip হতো)।
  # এখন ci-failure-handler hourly schedule-এ চলবে এবং GitHub API দিয়ে recent
  # failed runs চেক করবে — cascade সম্পূর্ণ ভাঙা হলো।
  # সাশ্রয়: ~১৫ workflow_run runs/day × 5.7 min = 85 min/day = 2,550 min/month।
  # (founder directive: CI failure detection ১ ঘন্টায় একবার যথেষ্ট — Slack notify
  # এখনো real-time পায় pr.yml এর notify-failure job থেকে)
  schedule:
    - cron: "0 * * * *"  # COST OPTIMIZATION: hourly (was */30, originally */10)
      # বাংলা: */10 প্রতি দিন ১৪৪টি schedule run তৈরি করত → */30 এ ৭২ → এখন hourly = ২৪/day।
      # issue events এখনো real-time trigger করে (no latency regression)। schedule শুধু
      # "agent crashed mid-claim" recovery — hourly যথেষ্ট (orphan release TTL = 30min)।
      # সাশ্রয়: ৪৮ runs/day × 5.7 min = ২৭৪ min/day = ৮,২২০ min/month।
  workflow_dispatch:
    inputs:
      role:
        description: "Agent role (coder, planner, ci, platform)"
        required: true
        default: "coder"
      agent_name:
        description: "Agent identifier (e.g. coder-1)"
        required: true
        default: "coder-1"

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Audit if no issues exist
  # ---------------------------------------------------------------------------
  audit-if-needed:
    name: "🔍 Audit if Needed"
    # বাংলা মন্তব্য (#2778): workflow_run-ইভেন্টে এই ভারী job চলে না —
    # সেই রান শুধু ci-failure-handler-এর জন্য।
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_issues: ${{ steps.check.outputs.has_issues }}
    steps:
      - name: Resolve working GH_TOKEN (SELF_HEAL_PAT fallback)
        id: resolve-token
        env:
          PAT_TOKEN: ${{ secrets.SELF_HEAL_PAT }}
          GHA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$PAT_TOKEN" ]; then
            echo "resolved_token=$GHA_TOKEN" >> $GITHUB_OUTPUT
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $PAT_TOKEN" "https://api.github.com/repos/${{ github.repository }}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "resolved_token=$PAT_TOKEN" >> $GITHUB_OUTPUT
          else
            echo "resolved_token=$GHA_TOKEN" >> $GITHUB_OUTPUT
            echo "::warning::SELF_HEAL_PAT returned HTTP $STATUS — falling back to github.token"
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # #3088 §6: canonical invariant — auditor-trigger এখন claimable-count দিয়ে।
      # বাংলা মন্তব্য: "open issues == 0" নয়; সব-ইস্যু in-progress/gated হলেও
      # (claimable==0) controlled auditor evaluation eligible হয় — ক inscript-
      # চুক্তি continuous_agent_loop.agent_claimable_issue_count থেকেই আসে।
      - name: Check claimable issue count (#3088 canonical invariant)
        id: check
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CLAIMABLE=$(python scripts/agents/continuous_agent_loop.py --check-claimable | tail -1 | jq -r '.claimable // 0')
          echo "has_issues=$([ "$CLAIMABLE" -gt 0 ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          echo "Claimable issues: $CLAIMABLE (#3088: agent_claimable_issue_count)"

      - name: Run full audit if no claimable issues
        if: steps.check.outputs.has_issues == 'false'
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "🔍 No claimable issues (#3088). Running controlled auditor evaluation..."
          python scripts/agents/priority_queue_ledger.py --limit 10 || true
          echo "✅ Audit complete."

  # ---------------------------------------------------------------------------
  # 2. Priority Auto-Escalation
  # ---------------------------------------------------------------------------
  auto-escalate:
    name: "🔼 Auto-Escalate Priorities"
    # বাংলা মন্তব্য (#2778): হেভি job সমূহ workflow_run-রান থেকে বাদ —
    # ক্যাসকেড রানে শুধু skip-জব থাকে, রানার-মিনিট শূন্য।
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run priority auto-escalation
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/ci/auto_escalate_priority.py

  # ---------------------------------------------------------------------------
  # 3. Pipeline Failure Register — সব ব্যর্থতা এক গ্রুপে + স্মার্ট রাউটিং (#2928)
  # ---------------------------------------------------------------------------
  # বাংলা মন্তব্য (#2928 root-cause): পুরনো inline-bash handler-এর ৩টি জন্মগত বাগ —
  #   ১) workflow_run-এ checkout হয় main → `git log -10` পড়ত main-এর কমিট →
  #      ভুল issue-linkage (PR #2926-এর ব্যর্থতা গিয়ে পড়ত আনসম্পর্কিক #2719-এ!)
  #   ২) `grep -c … || echo "0"` দ্বৈত-আউটপুট ("0\n0") → গাণিতিক ত্রুটি →
  #      কমেন্টও যেত না, issue-ও জন্মাত না, তবু step "success" — নীরব মৃত্যু
  #   ৩) ছড়ানো blocker-issue — কোনো এক-গ্রুপ নীতি ছিল না
  # প্রতিস্থাপন: নির্ধারক single-funnel `pipeline_failure_register.py` —
  # fingerprint-dedup + স্মার্ট রাউটিং (merge-first > duplicate new-fix)।
  # ci-failure-handler REMOVED (COST OPTIMIZATION):
  # বাংলা: এই job workflow_run event data (github.event.workflow_run.*) ব্যবহার করত।
  # workflow_run trigger সরানোর পর এই variables empty হবে → script ভুল আউটপুট।
  # pipeline-failure-scan job নিচে একই কাজ করে GitHub API দিয়ে (dynamic, সব workflow
  # কভার করে)। তাই এই job সম্পূর্ণ redundant — সরানো হলো।
  # Founder directive #3 (CI failure detection): pipeline-failure-scan দ্বারা সংরক্ষিত।


  # ---------------------------------------------------------------------------
  # 3b. Pipeline Failure Scan — ডায়নামিক পূর্ণ-স্ক্যান (#2935)
  # ---------------------------------------------------------------------------
  # বাংলা মন্তব্য (#2935 অ্যাডমিন-নির্দেশ: "any new pipeline added we dont need
  # to update again"): উপরের workflow_run-ট্রিগার হলো পরিচিত ৩ গেটের দ্রুত-পথ
  # (সেকেন্ড-লেটেন্সি); এই পর্যায়ক্রমিক স্ক্যান হলো সর্ব-কভারেজ নেট —
  # ভবিষ্যতে যেকোনো নতুন pipeline যোগ হলে তার ব্যর্থতাও (≤১০ মিনিটের মধ্যে)
  # স্বয়ংক্রিয়ভাবে register + per-failure issue পাবে — কোনো কনফিগ-আপডেট লাগবে
  # না। register v2: workflows_watched ["*"] = সব workflow; held PR-গুলোর
  # কারণসহ per-PR issue; হীল হলে auto-close।
  pipeline-failure-scan:
    name: "📋 Pipeline Failure Scan (dynamic — any pipeline, auto-tracked)"
    # COST OPTIMIZATION: schedule-only (was `!= 'workflow_run'` = ran on issues events too)
    # বাংলা: আগে প্রতিটি issue event-এ এই ভারী job (8 min) চলত — কিন্তু issue open
    # হলে CI failure স্ক্যান দরকার নেই। শুধু schedule + dispatch-এ চলবে।
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Full dynamic scan (register + per-failure issues)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/ci/pipeline_failure_register.py --scan

  # ---------------------------------------------------------------------------
  # 4. Agent Loop — Acquire, Claim, Execute
  # ---------------------------------------------------------------------------
  agent-loop:
    name: "🔄 Agent Loop (${{ github.event.inputs.role || 'coder' }})"
    needs: [audit-if-needed, auto-escalate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run continuous agent loop
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ROLE="${{ github.event.inputs.role || 'coder' }}"
          AGENT="${{ github.event.inputs.agent_name || 'coder-1' }}"
          echo "🚀 Starting agent loop: role=$ROLE, agent=$AGENT"
          python scripts/agents/continuous_agent_loop.py --role "$ROLE" --agent-name "$AGENT" --iterations 1
