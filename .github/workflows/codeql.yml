name: CodeQL

# The CodeQL config (.github/codeql/codeql-config.yml) existed but nothing ran
# it, so the repo had zero SAST coverage despite the config. This workflow wires
# it up: scan the languages that actually ship here (TypeScript/JS services +
# Python core) on GitHub-hosted runners, independent of the self-hosted CI tier.
#
# Additive by design: results land in the Security tab. This is NOT a required
# PR status check, so it cannot block the existing landing gate.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - '.gitignore'
      - 'version.json'
      - '*.txt'
  schedule:
    # Weekly re-scan catches newly-published queries (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # hierarchy-exception: CodeQL SAST must run on GitHub-hosted runners — the
    # codeql-action needs a runner with the CodeQL toolcache, and the analysis
    # is read-only (posts to the Security tab). It is NOT a required PR check
    # and does not gate the landing/merge pipeline, so it is intentionally kept
    # off the 4-tier execution hierarchy (which is reserved for the fail-closed
    # build/test/deploy gate). Narrow, justified exception per AGENTS.md §7.
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      # JS/TS and Python are interpreted — autobuild is a no-op for them but is
      # kept so the workflow stays valid if a compiled language is added later.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
