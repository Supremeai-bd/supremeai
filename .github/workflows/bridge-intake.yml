# বাংলা মন্তব্য: Bridge v1 — public agents (supremeai-open) → private codebase (এই repo)।
# চুক্তি: scripts/bridge/README.md। Fail-closed intake + sanitized reporting;
# landing সিদ্ধান্ত শুধুই constitutional gates। Token কখনো repo-secret/লগে থাকে না —
# vault GITHUB_PAT_PAYKARIBAZARONLINE রানটাইমে ফেচ (archive-mirror.yml-এর প্রমাণিত pattern)।
name: Bridge Intake (public work orders → private gates)

on:
  schedule:
    - cron: "13,43 * * * *" # বাংলা: ৩০-মিনিট ছন্দ, off-peak স্লট (:13/:43) — GitHub top-of-hour congestion এড়ানো (issue #52: */30 = :00/:30 সর্বাধিক ব্যস্ত, ৩ স্লট নীরব)
  workflow_dispatch:
    inputs:
      mode:
        description: "intake | sync | both"
        required: false
        default: "both"
        # E2: choice-টাইপ বাধ্যতামূলক — free-text input সরাসরি `run:`-এর shell-এ
        # গিয়ে command injection বানাত (BRIDGE_TOKEN PAT ওই shell-এ থাকে)।
        type: choice
        options:
          - both
          - intake
          - sync

permissions:
  contents: read # script নিজে BRIDGE_TOKEN দিয়ে push/PR করে — github.token লেখার অধিকার লাগে না

concurrency:
  group: bridge-intake-v2
  # E4: cancel-in-progress:false — intake প্রতি অর্ডারে (clone→apply→push→
  # intake issue→PR) চলে; মাঝপথে cancel হলে `bridge-land/<task-id>` branch push
  # হয়ে যায় কিন্তু dedup-marker issue তৈরি হয় না → পরের run-এ push
  # non-fast-forward → ভ্যালিড অর্ডার ভুলভাবে `bridge:rejected` (E4)।
  # পুরনো রান শেষ হউক, নতুন রান queue-তে অপেক্ষা করুক।
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    # E9: run-এর সময়-সীমা — ৩০টা queued work order × (clone+apply) দীর্ঘ হতে পারে;
    # timeout ছাড়া একটি আটকে-থাকা রান concurrency queue চিরকাল আটকে রাখত।
    timeout-minutes: 45
    steps:
      - name: Checkout (শুধু script পড়তে — persist-credentials নিষিদ্ধ)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vault থেকে bridge-token ফেচ (শূন্য-প্রিন্ট শৃঙ্খলা)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          # বাংলা: Infisical universal-auth login → prod secrets → BRIDGE_TOKEN → GITHUB_ENV
          import json, os, urllib.request
          def api(url, payload=None, tok=None):
              data = json.dumps(payload).encode() if payload is not None else None
              h = {"Content-Type": "application/json", "Accept": "application/json", "User-Agent": "bridge-intake"}
              if tok: h["Authorization"] = f"Bearer {tok}"
              req = urllib.request.Request(url, data=data, headers=h)
              with urllib.request.urlopen(req, timeout=45) as r: return json.load(r)
          res = api("https://app.infisical.com/api/v1/auth/universal-auth/login",
                    {"clientId": os.environ["INFISICAL_CLIENT_ID"], "clientSecret": os.environ["INFISICAL_CLIENT_SECRET"]})
          secs = api(f"https://app.infisical.com/api/v3/secrets/raw?workspaceId={os.environ['INFISICAL_PROJECT_ID']}&environment=prod&recursive=true",
                     tok=res["accessToken"])
          kv = {s["secretKey"].upper(): s.get("secretValue") or "" for s in secs.get("secrets", [])}
          tok = kv.get("GITHUB_PAT_PAYKARIBAZARONLINE", "")
          if not tok:
              raise SystemExit("vault-এ GITHUB_PAT_PAYKARIBAZARONLINE শূন্য — bridge অসম্ভব")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"BRIDGE_TOKEN<<EOF\n{tok}\nEOF\n")
          print("[ok] vault থেকে bridge-token লোড (মান প্রিন্ট হয়নি — zero-print)")
          PY

      - name: Bridge intake + sync (fail-honest exit codes)
        env:
          BRIDGE_TOKEN: ${{ env.BRIDGE_TOKEN }}
          # E2/E3: mode `env:` দিয়ে পাস — `${{ }}` কখনো সরাসরি shell-এ বসে না;
          # মান-ভ্যালিডেশন স্ক্রিপ্টের কাজ (unknown mode → rc 2)।
          MODE: ${{ github.event.inputs.mode || 'both' }}
        run: |
          # E1: `set -e` ছাড়া step-এর exit-status = শেষ command-এর। আগের দুই-আলাদা
          # `python … intake` / `python … sync` কলেই intake ব্যর্থ (rc 2) হলেও
          # sync সফল হলে রান সবুজ হয়ে যেত — আর `both` হল ডিফল্ট মোড, অর্থাৎ
          # সবসময়ই intake-এর সৎ লাল চাপা পড়ত।
          set -euo pipefail
          MODE="${MODE:-both}"
          echo "[bridge] mode=$MODE"
          # E1/E3: একটি invocation — bridge_intake.py main() নিজে intake→sync
          # চেইন করে ও rc প্রোপাগেট করে, mode-ভ্যালিডেশনও নিজেই করে (shell if নয়)।
          python scripts/bridge/bridge_intake.py "$MODE"
