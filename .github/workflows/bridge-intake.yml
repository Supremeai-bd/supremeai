# বাংলা মন্তব্য: Bridge v1 — public agents (supremeai-open) → private codebase (এই repo)।
# চুক্তি: scripts/bridge/README.md। Fail-closed intake + sanitized reporting;
# landing সিদ্ধান্ত শুধুই constitutional gates। Token কখনো repo-secret/লগে থাকে না —
# vault GITHUB_PAT_PAYKARIBAZARONLINE রানটাইমে ফেচ (archive-mirror.yml-এর প্রমাণিত pattern)।
name: Bridge Intake (public work orders → private gates)

on:
  # ⚡ INSTANT / EVENT-DRIVEN ONLY: Scheduled cron completely removed.
  # Intake triggers immediately on repository_dispatch or workflow_dispatch.
  repository_dispatch:
    types: [bridge_order_queued, bridge_satellite_sync]
  workflow_dispatch:
    inputs:
      mode:
        description: "intake | sync | both"
        required: false
        default: "both"
        # E2: choice-টাইপ বাধ্যতামূলক — free-text input সরাসরি `run:`-এর shell-এ
        # গিয়ে command injection বানাত (BRIDGE_TOKEN PAT ওই shell-এ থাকে)।
        type: choice
        options:
          - both
          - intake
          - sync
      issue_number:
        description: 'Core issue number to mirror'
        required: false
        type: string
      run_id:
        description: 'Workflow run ID to mirror'
        required: false
        type: string

permissions:
  contents: read # script নিজে BRIDGE_TOKEN দিয়ে push/PR করে — github.token লেখার অধিকার লাগে না

concurrency:
  group: bridge-intake-v5
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    # E9: run-এর সময়-সীমা — ৩০টা queued work order × (clone+apply) দীর্ঘ হতে পারে;
    # timeout ছাড়া একটি আটকে-থাকা রান concurrency queue চিরকাল আটকে রাখত।
    timeout-minutes: 45
    steps:
      - name: Checkout (শুধু script পড়তে — persist-credentials নিষিদ্ধ)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vault → bridge-token (App installation token mint, PAT fallback)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          # বাংলা: vault থেকে GitHub App ক্রেডেনশিয়াল → RS256 JWT (openssl, zero-dep) →
          # installation token → BRIDGE_TOKEN। App-এ issues/pull_requests/contents:write
          # আছে — user-PAT-এর ফাইন-গ্রেইনড permission-gap (private issue create 403,
          # public label 403) চিরতরে বাইপাস হয়; PAT শুধু fallback।
          # (db44c51 server-side bridge-lane pattern-এর workflow-সাইড প্রতিরূপ।)
          import base64, json, os, subprocess, tempfile, time, urllib.request

          def api(url, payload=None, tok=None, method=None):
              data = json.dumps(payload).encode() if payload is not None else None
              h = {"Content-Type": "application/json", "Accept": "application/vnd.github+json", "User-Agent": "bridge-intake"}
              if tok: h["Authorization"] = f"Bearer {tok}"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=45) as r: return json.load(r)

          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          res = api("https://app.infisical.com/api/v1/auth/universal-auth/login",
                    {"clientId": os.environ["INFISICAL_CLIENT_ID"], "clientSecret": os.environ["INFISICAL_CLIENT_SECRET"]})
          secs = api(f"https://app.infisical.com/api/v3/secrets/raw?workspaceId={os.environ['INFISICAL_PROJECT_ID']}&environment=prod&recursive=true",
                     tok=res["accessToken"])
          kv = {s["secretKey"].upper(): s.get("secretValue") or "" for s in secs.get("secrets", [])}
          pat = kv.get("GITHUB_PAT_PAYKARIBAZARONLINE", "")
          app_id = kv.get("GITHUB_APP_ID", "")
          pem = kv.get("GITHUB_APP_PRIVATE_KEY", "")
          tok, src = "", ""

          if app_id and pem and "PRIVATE KEY" in pem:
              try:
                  pem_text = pem if "\n" in pem else pem.replace("\\n", "\n")
                  with tempfile.NamedTemporaryFile("w", suffix=".pem", delete=False) as f:
                      f.write(pem_text)
                      pem_path = f.name
                  now = int(time.time())
                  hdr = b64u(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
                  pl = b64u(json.dumps({"iat": now - 60, "exp": now + 540, "iss": str(app_id)}).encode())
                  sig = subprocess.run(["openssl", "dgst", "-sha256", "-sign", pem_path],
                                       input=f"{hdr}.{pl}".encode(), capture_output=True, check=True).stdout
                  jwt = f"{hdr}.{pl}.{b64u(sig)}"
                  insts = api("https://api.github.com/app/installations", tok=jwt)
                  inst = next((i for i in insts if (i.get("account") or {}).get("login") == "Supremeai-bd"), None)
                  if not inst:
                      raise RuntimeError("Supremeai-bd installation not found")
                  tok = api(f"https://api.github.com/app/installations/{inst['id']}/access_tokens", tok=jwt, method="POST")["token"]
                  src = "app-installation"
              except Exception as e:
                  print(f"[warn] app-token mint failed ({e}) — falling back to vault PAT")
                  tok, src = "", ""

          if not tok:
              tok = pat
              src = "vault-pat"
          if not tok:
              raise SystemExit("vault-এ bridge ক্রেডেনশিয়াল শূন্য — bridge অসম্ভব")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"BRIDGE_TOKEN<<EOF\n{tok}\nEOF\n")
          print(f"[ok] bridge-token লোড (source={src}, মান প্রিন্ট হয়নি — zero-print)")
          PY

      - name: Bridge intake + sync (fail-honest exit codes)
        env:
          BRIDGE_TOKEN: ${{ env.BRIDGE_TOKEN }}
          # E2/E3: mode `env:` দিয়ে পাস — `${{ }}` কখনো সরাসরি shell-এ বসে না;
          # মান-ভ্যালিডেশন স্ক্রিপ্টের কাজ (unknown mode → rc 2)।
          MODE: ${{ github.event.inputs.mode || 'both' }}
        run: |
          # E1: `set -e` ছাড়া step-এর exit-status = শেষ command-এর। আগের দুই-আলাদা
          # `python … intake` / `python … sync` কলেই intake ব্যর্থ (rc 2) হলেও
          # sync সফল হলে রান সবুজ হয়ে যেত — আর `both` হল ডিফল্ট মোড, অর্থাৎ
          # সবসময়ই intake-এর সৎ লাল চাপা পড়ত।
          set -euo pipefail
          MODE="${MODE:-both}"
          echo "[bridge] mode=$MODE"
          # E1/E3: একটি invocation — bridge_intake.py main() নিজে intake→sync
          # চেইন করে ও rc প্রোপাগেট করে, mode-ভ্যালিডেশনও নিজেই করে (shell if নয়)।
          python scripts/bridge/bridge_intake.py "$MODE"


      - name: Process Failure Mirroring (from mirror-ci-failures-to-open)
        if: always() && (github.event.inputs.issue_number != '' || github.event.inputs.run_id != '')
        env:
          OPEN_SYNC_PAT: ${{ secrets.OPEN_SYNC_PAT || secrets.SELF_HEAL_PAT || github.token }}
          CORE_REPO: ${{ github.repository }}
          MIRROR_ISSUE_NUM: ${{ github.event.inputs.issue_number }}
          MIRROR_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          if [ -n "$MIRROR_ISSUE_NUM" ]; then
            python scripts/ci/mirror_issue_to_open.py --issue-number "$MIRROR_ISSUE_NUM"
          fi
          if [ -n "$MIRROR_RUN_ID" ]; then
            python scripts/ci/mirror_issue_to_open.py --run-id "$MIRROR_RUN_ID"
          fi

      - name: Process Satellite Upstream Sync (12 Satellite Repos → SupremeAI Monorepo)
        if: always() && (github.event.action == 'bridge_satellite_sync' || github.event.client_payload.event_kind == 'bridge.satellite.sync')
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          payload = json.loads(os.environ.get("PAYLOAD") or "{}")
          source = payload.get("source_repo") or payload.get("satellite_repo") or "unknown"
          sha = payload.get("commit_sha") or "unknown"
          ref = payload.get("ref") or "refs/heads/main"
          print(f"✅ [satellite-sync] Received upstream update from {source} (commit {sha[:8]} @ {ref})")
          os.makedirs("docs/ledger", exist_ok=True)
          entry = {
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "satellite": source,
              "commit_sha": sha,
              "ref": ref,
              "status": "synchronized"
          }
          with open("docs/ledger/satellite_sync.jsonl", "a") as f:
              f.write(json.dumps(entry) + "\n")
          print("Recorded upstream sync in docs/ledger/satellite_sync.jsonl")
          PY

