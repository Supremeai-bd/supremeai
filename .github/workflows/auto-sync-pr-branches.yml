# =============================================================================
# Auto-Sync Open PR Branches on Main Merge (#3279) — #3684 hermetic fix
# =============================================================================
# যখন main-এ PR merge হয়, সব open PR-এর head ১ কমিট পিছিয়ে পড়ে → Freshness
# Gate (#2935) block করে। এই workflow GitHub update-branch API দিয়ে সব open
# PR-কে স্বয়ংক্রিয়ভাবে main-এর সাথে sync করে — কোনো manual rebase লাগে না।
# Concurrency: cancel-in-progress: true — একসাথে একাধিক merge হলে শুধু শেষটা চলবে।
#
# #3684 root-fix (৩টি রোগ-নিরাময়):
#   ১. আগে `-d '{"expected_head_sha":""}'` পাঠানো হত — খালি string-কে GitHub
#      আসল (ভুল) SHA মনে করে → প্রতিটি sync 422 "expected head sha didn't
#      match"। এখন PR-list snapshot-এর **আসল headRefOid** যায়।
#   ২. 422 head-race (list↔call-এর মাঝে head বদলালে) → fresh SHA re-fetch
#      করে ঠিক ১ বার auto-retry।
#   ৩. False-green মৃত্যু (#3227 honest-fail): আগে সব sync fail করলেও
#      exit 0 → run "success"। এখন কোনো sync conflict/error হলে run-ই লাল।
#
# =============================================================================
# ⚠️  DEPRECATED — soft-retired (Merge Gate Convergence) ⚠️
# =============================================================================
# push:main trigger বাদ। দুটো কারণ:
#   ১) Persistent Branch Lifecycle (#4200, flag default-ON #4227): agent
#      branch = durable workspace — merge-এর পর প্রতিটি open workspace-কে
#      পেছন-থেকে mutate করা lifecycle-চুক্তির সাথে সাংঘর্ষিক। Gap কভার করে:
#      freshness gate (#2935 self-heal নির্দেশনা) + agent resume-freshness
#      (#4206 wiring) + dependabot-এর নিজস্ব rebase (exempt-actor)।
#   ২) Merge Gate (merge-gate.yml) TOCTOU race: gate যে head-SHA verify করে,
#      auto-sync ঠিক তার পরেই branch mutate করে → verified-SHA ≠ merged-SHA।
#      Sequential landing-এর জন্য branch mutation অবশ্যই gate-এর বাইরে থাকবে।
# workflow_dispatch রাখা হলো জরুরি manual sync-এর জন্য (revertible soft-retire)।
# =============================================================================

name: 🔄 Auto-Sync Open PR Branches (deprecated — manual only)

on:
  workflow_dispatch:

concurrency:
  group: auto-sync-pr-branches
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pr-branches:
    name: "🔄 Sync open PR branches with main"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync all open PR branches
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
        run: |
          set -euo pipefail
          # বাংলা: PR-list snapshot — number + আসল head SHA (#3684-১: খালি
          # expected_head_sha নয়, race-safe আসল SHA)।
          PRS=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"')
          if [ -z "$PRS" ]; then
            echo "No open PRs to sync."
            exit 0
          fi

          sync_one() {
            # $1 = PR number, $2 = expected head SHA (আসল, fresh)
            curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$1/update-branch" \
              -d "{\"expected_head_sha\":\"$2\"}"
          }

          SYNCED=0
          UPTODATE=0
          FAILED=0
          while read -r PR_NUM HEAD_SHA; do
            [ -z "$PR_NUM" ] && continue
            echo "Syncing PR #$PR_NUM (head ${HEAD_SHA:0:8})..."
            RESPONSE=$(sync_one "$PR_NUM" "$HEAD_SHA")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            # #3684-২: head-race — list↔call-এর মাঝে PR head বদলেছে →
            # fresh SHA নিয়ে ঠিক ১ বার retry।
            if [ "$HTTP_CODE" = "422" ] && echo "$BODY" | grep -q "expected head sha"; then
              FRESH_SHA=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" \
                --json headRefOid --jq .headRefOid)
              echo "  ↻ head moved (${HEAD_SHA:0:8} → ${FRESH_SHA:0:8}) — retrying with fresh SHA"
              RESPONSE=$(sync_one "$PR_NUM" "$FRESH_SHA")
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | head -n -1)
            fi

            if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "  ✅ PR #$PR_NUM synced"
              SYNCED=$((SYNCED + 1))
            elif echo "$BODY" | grep -qi "merge conflict"; then
              echo "  ⚠️ PR #$PR_NUM has merge conflicts — manual rebase needed"
              FAILED=$((FAILED + 1))
            elif echo "$BODY" | grep -qi "no new commits"; then
              echo "  ✅ PR #$PR_NUM already up to date"
              UPTODATE=$((UPTODATE + 1))
            else
              echo "  ⚠️ PR #$PR_NUM: HTTP $HTTP_CODE — $BODY"
              FAILED=$((FAILED + 1))
            fi
            sleep 1  # Rate limit
          done <<< "$PRS"

          echo ""
          echo "=== Sync Summary ==="
          echo "  Synced: $SYNCED"
          echo "  Already up to date: $UPTODATE"
          echo "  Conflicts/Failed: $FAILED"

          # #3684-৩: honest-fail — কোনো sync ব্যর্থ হলে run-ই লাল।
          # conflict মানেই কারো rebase লাগবে — সেটা নীরবে গিলে ফেলা false-green।
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED PR(s) failed to sync (conflict or API error) — needs rebase/attention (#3684)"
            exit 1
          fi
