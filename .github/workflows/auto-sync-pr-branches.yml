# =============================================================================
# Auto-Sync Open PR Branches on Main Merge (#3279)
# =============================================================================
# যখন main-এ PR merge হয়, সব open PR-এর head ১ কমিট পিছিয়ে পড়ে → Freshness
# Gate (#2935) block করে। এই workflow GitHub update-branch API দিয়ে সব open
# PR-কে স্বয়ংক্রিয়ভাবে main-এর সাথে sync করে — কোনো manual rebase লাগে না।
# Concurrency: cancel-in-progress: true — একসাথে একাধিক merge হলে শুধু শেষটা চলবে।

name: 🔄 Auto-Sync Open PR Branches

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-sync-pr-branches
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pr-branches:
    name: "🔄 Sync open PR branches with main"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync all open PR branches
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
        run: |
          set -euo pipefail
          # Get all open PRs
          PRS=$(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"')
          if [ -z "$PRS" ]; then
            echo "No open PRs to sync."
            exit 0
          fi
          SYNCED=0
          FAILED=0
          while read -r PR_NUM PR_BRANCH; do
            echo "Syncing PR #$PR_NUM ($PR_BRANCH)..."
            # Use GitHub update-branch API (server-side merge — no local checkout)
            RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUM/update-branch" \
              -d '{"expected_head_sha":""}')
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "  ✅ PR #$PR_NUM synced"
              SYNCED=$((SYNCED + 1))
            elif echo "$BODY" | grep -q "merge conflict"; then
              echo "  ⚠️ PR #$PR_NUM has merge conflicts — manual rebase needed"
              FAILED=$((FAILED + 1))
            elif echo "$BODY" | grep -q "already up to date"; then
              echo "  ✅ PR #$PR_NUM already up to date"
            else
              echo "  ⚠️ PR #$PR_NUM: HTTP $HTTP_CODE — $BODY"
              FAILED=$((FAILED + 1))
            fi
            sleep 1  # Rate limit
          done <<< "$PRS"
          echo ""
          echo "=== Sync Summary ==="
          echo "  Synced: $SYNCED"
          echo "  Conflicts/Failed: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED PR(s) have conflicts — manual rebase needed"
          fi
