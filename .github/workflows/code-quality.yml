name: 📈 Code Quality Checks
true:
  schedule:
  - cron: 0 4 * * 0
  pull_request:
    paths:
    - backend/**
    - scripts/**
  workflow_dispatch: null
concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dead-code-detection:
    name: 🦅 Find Dead Code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install Vulture
      run: pip install vulture
    - name: Run Dead Code Detector script
      id: dead_code_check
      run: python scripts/security/find_dead_code.py
    - name: Summarize findings
      if: failure() && steps.dead_code_check.outcome == 'failure'
      run: 'echo "## 🚨 Dead Code Detected" >> $GITHUB_STEP_SUMMARY

        echo "The ''Find Dead Code'' job failed, indicating that potential unused
        code was found." >> $GITHUB_STEP_SUMMARY

        echo "Please review the logs from the ''Run Dead Code Detector script'' step
        for details." >> $GITHUB_STEP_SUMMARY

        '
    timeout-minutes: 10
