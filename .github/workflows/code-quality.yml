name: 📈 Code Quality Checks

on:
  # প্রতি রবিবার ভোর ৪টায় স্বয়ংক্রিয়ভাবে চালানোর জন্য
  schedule:
    - cron: '0 4 * * 0'
  # Pull Request ট্রিগার - শুধুমাত্র backend বা scripts ফোল্ডারে পরিবর্তন হলে
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
  # ম্যানুয়ালি চালানোর জন্য
  workflow_dispatch:

# QUEUE STORM FIX: cancel any in-flight run for the same PR / ref when a newer
# push arrives. Per-PR grouping ensures different PRs are NOT cancelled by each
# other — only superseded runs on the same PR/ref are cancelled.
concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dead-code-detection:
    name: 🦅 Find Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Vulture
        run: pip install vulture

      - name: Run Dead Code Detector script
        # বাংলা (#3165): path ঠিক করা হয়েছে — scripts/quality/ → scripts/security/
        # (script বাস্তবে scripts/security/find_dead_code.py-তে আছে)।
        id: dead_code_check
        run: python scripts/security/find_dead_code.py

      - name: Summarize findings
        if: failure() && steps.dead_code_check.outcome == 'failure'
        run: |
          echo "## 🚨 Dead Code Detected" >> $GITHUB_STEP_SUMMARY
          echo "The 'Find Dead Code' job failed, indicating that potential unused code was found." >> $GITHUB_STEP_SUMMARY
          echo "Please review the logs from the 'Run Dead Code Detector script' step for details." >> $GITHUB_STEP_SUMMARY
