name: SupremeAI Unified CI/CD Pipeline

# =============================================================================
# SINGLE UNIFIED CI/CD SSOT (Zero Duplicate Runs)
# 1. On Pull Request / Schedule:
#    - Tier 1 Fast Safety Gates (GitHub Actions: Lint, Boundaries, Contracts <30s)
#    - Tier 2 Heavy CI Runner (Render supremeai-ci-runner: Full Test & Security Suite)
# 2. On Merge / Push to Main:
#    - Detect changed service boundaries
#    - Deploy only the required Render services
#    - Smoke-check only authoritative configured targets
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Manually re-run and force production deployment"
        required: false
        default: false
        type: boolean
      target_service:
        description: "Target service(s) to deploy (all, render-all, cloudflare, vercel, core, api, mcp, worker, scraper, brain, or comma-separated e.g. core,mcp,cloudflare)"
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: unified-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # STAGE 0: 4-LEVEL RUNNER HIERARCHY PREFLIGHT (<10s)
  # SSOT Invariant: Every pipeline must execute this check FIRST before any other job.
  # Resolves Priority 1 (Local PC: 0m) -> Priority 2 (Render CI) -> Priority 3 -> Priority 4 (Emergency)
  # =========================================================================
  resolve-execution-tier:
    name: "Tier 1: 4-Level Runner Hierarchy Preflight (<10s)"
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      execution_tier: ${{ steps.runner-check.outputs.execution_tier }}
      is_local_online: ${{ steps.runner-check.outputs.is_local_online }}
      render_quota_exhausted: ${{ steps.runner-check.outputs.render_quota_exhausted }}
    steps:
      # SECURITY: resolve the tier from DEFAULT-BRANCH code, never the PR head.
      # This job carries merge-capable PATs and Render API keys; a malicious PR
      # could otherwise edit the very script it executes and exfiltrate them.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check 4-Level Execution Hierarchy
        id: runner-check
        env:
          GH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          OPEN_SYNC_PAT: ${{ secrets.OPEN_SYNC_PAT }}
          SELF_HEAL_PAT: ${{ secrets.SELF_HEAL_PAT }}
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          OPEN_DISPATCH_TOKEN: ${{ secrets.OPEN_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_CI_RUNNER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID || 'srv-dbl8tbmtlv9c73bbkvqg' }}
        run: python scripts/ci/resolve_execution_tier.py

  # =========================================================================
  # STAGE 1: TIER 1 - MINIMAL FAST GATES (Cloud fallback only)
  # Zero Cloud Waste (SSOT): when local PC is online, fast-gate + readiness +
  # heavy battery all run on the local self-hosted runner (0 cloud minutes).
  # These cloud jobs run ONLY when local is offline/unavailable.
  # =========================================================================
  fast-gate:
    name: "Tier 1: Fast Safety Gate (<30s, cloud fallback)"
    needs: [resolve-execution-tier]
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic pydantic-settings python-dotenv fastapi httpx pyyaml sqlalchemy redis pyjwt requests

      - name: Fast fatal error & syntax lint
        run: ruff check core/ gateway/ scripts/ci/ --select E9,F63,F7,F82 --exclude core/tests/

      - name: Critical Security & Architecture Guards Suite
        run: |
          pytest -q tests/unit/test_telemetry_event_bus_guard.py tests/security/test_code_review_remediation_guards.py tests/test_satellite_workflow_triggers.py core/tests/agents/test_agents_unified.py
          python scripts/ops/wiring_atlas.py --check

      - name: Subsystem Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vscode:
              - 'vscode/**'

      - name: Setup Node.js (for Subsystems)
        if: steps.filter.outputs.vscode == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: VSCode Extension Compile & Test Check
        if: steps.filter.outputs.vscode == 'true'
        working-directory: vscode
        run: |
          npm ci
          npm run compile --workspace=extension
          npm test --workspace=extension

  runtime-readiness:
    name: "Tier 1: Runtime Readiness & Boundaries (<30s, cloud fallback)"
    needs: [resolve-execution-tier]
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install readiness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Verify readiness contract
        run: |
          test -f scripts/ci/readiness_contract.py
          python scripts/ci/readiness_contract.py --self-test
          python scripts/ci/readiness_contract.py --check-required-names
          python scripts/ci/production_release_gate.py --self-test
          python scripts/ci/production_release_gate.py --check
          python scripts/agents/check_loop_contract_parity.py

      - name: Verify timeout and silent-failure policy
        run: |
          python scripts/ci/timeout_policy_guard.py --check
          python scripts/ci/silent_failure_guard.py --check

      - name: Check public export allowlist
        run: python scripts/ci/public_surface_guard.py --manifest scripts/ci/public_surface_manifest.txt

      # SECURITY: run the verifier from the DEFAULT BRANCH so LLM provider
      # keys are never handed to PR-head-modifiable code. It audits the PR via
      # the GitHub API; only its own (trusted) code executes here.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}
          path: _verifier-base
          persist-credentials: false
      - name: AI Semantic PR Verification Gate (High-Risk Enforcement)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        working-directory: _verifier-base
        run: python scripts/ci/ai_semantic_pr_verifier.py --pr "${{ github.event.pull_request.number }}"

      - name: Clean up verifier base checkout
        if: always() && github.event_name == 'pull_request'
        run: rm -rf _verifier-base

      - name: Anti-Duplication Regression Guard (Zero New Code Clones)
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }} --depth=50
          python scripts/ci/detect_new_duplicates.py --base-ref "origin/${{ github.base_ref || 'main' }}" --max-new 0

  # =========================================================================
  # STAGE 2: TIER 2 - HEAVY TEST BATTERY (4-Tier SSOT per PR_TO_PRODUCTION_LIFECYCLE.md)
  # Priority 1: Local PC (0 cloud mins) -> Priority 2: Render CI Runner -> Priority 3: GitHub+Render Backend -> Priority 4: GitHub Emergency
  # =========================================================================
  render-heavy-gate:
    name: "Tier 1+2: Full Verification Battery (Local Self-Hosted, 0 cloud mins)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 20
    needs: [resolve-execution-tier]
    steps:
      # SECURITY (full audit 2026-11-13 F-002): this job runs on a PERSONAL machine
      # (self-hosted). PR-head code must never execute with provider API keys in env
      # or with a persisted GITHUB_TOKEN credential.
      # - persist-credentials: false on every checkout
      # - the AI verifier runs from a BASE-REF checkout (_verifier-base) so
      #   LLM provider keys only execute trusted code, mirroring fast-gate pattern.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r core/requirements.txt -r gateway/requirements.txt ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis "mcp>=1.28.1,<2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tier 1 — Fast fatal error & syntax lint
        shell: powershell
        run: ruff check core/ gateway/ scripts/ci/ --select E9,F63,F7,F82 --exclude core/tests/

      - name: Tier 1 — Critical Security & Architecture Guards Suite
        shell: powershell
        run: |
          pytest -q tests/unit/test_telemetry_event_bus_guard.py tests/security/test_code_review_remediation_guards.py tests/test_satellite_workflow_triggers.py core/tests/agents/test_agents_unified.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ops/wiring_atlas.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tier 1 — Runtime Readiness & Boundaries
        shell: powershell
        run: |
          if (!(Test-Path scripts/ci/readiness_contract.py)) { throw "readiness_contract.py missing" }
          python scripts/ci/readiness_contract.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/readiness_contract.py --check-required-names
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/production_release_gate.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/production_release_gate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/timeout_policy_guard.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/silent_failure_guard.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/public_surface_guard.py --manifest scripts/ci/public_surface_manifest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/agents/check_loop_contract_parity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # SECURITY (full audit 2026-11-13 F-002): run the AI verifier from the DEFAULT
      # BRANCH so LLM provider keys are never handed to PR-head-modifiable code on
      # the self-hosted (personal) runner. It audits the PR via the GitHub API;
      # only trusted base-ref code executes with secrets in env.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}
          path: _verifier-base
          persist-credentials: false
      - name: Tier 1 — AI Semantic PR Verification Gate (High-Risk Enforcement)
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python _verifier-base/scripts/ci/ai_semantic_pr_verifier.py --pr "${{ github.event.pull_request.number }}"

      - name: Tier 1 — Anti-Duplication Regression Guard
        shell: powershell
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }} --depth=50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/detect_new_duplicates.py --base-ref "origin/${{ github.base_ref || 'main' }}" --max-new 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tier 2 — Heavy Test Battery & Compile Integrity
        shell: powershell
        run: |
          Write-Host "Running full verification battery on local self-hosted runner (0 cloud mins)..."
          pytest -q tests/unit/test_telemetry_event_bus_guard.py tests/security/test_code_review_remediation_guards.py tests/test_satellite_workflow_triggers.py core/tests/agents/test_agents_unified.py core/tests/test_audit_regressions.py core/tests/test_no_auth_stubs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ops/wiring_atlas.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q core/ gateway/ scripts/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish CI Attestation to MCP Tower
        if: always()
        shell: powershell
        env:
          # SECURITY (full audit 2026-11-13 F-002): MCP tower token is NOT handed to
          # pull_request arm on the self-hosted job — PR-authored code could exfiltrate it.
          # Trusted events (schedule/workflow_dispatch) still publish attestations.
          MCP_TOWER_ATTESTATION_URL: ${{ github.event_name != 'pull_request' && vars.MCP_TOWER_ATTESTATION_URL || '' }}
          MCP_TOWER_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.MCP_TOWER_AUTH_TOKEN || '' }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "local-self-hosted"
        run: |
          if (Test-Path scripts/ci/publish_ci_attestation.py) {
            python scripts/ci/publish_ci_attestation.py
          } else {
            Write-Host "Attestation script completed."
          }

  render-heavy-gate-render-ci:
    name: "Tier 2: Heavy Test Battery (Render CI Runner - Priority 2)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && needs.resolve-execution-tier.outputs.execution_tier == 'render-ci-runner' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    outputs:
      fallback_allowed: ${{ steps.render-ci.outputs.fallback_allowed }}
    steps:
      - uses: actions/checkout@v5

      - name: Trigger Render CI Runner Service
        id: render-ci
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_SERVICE_ID: "srv-dbl8tbmtlv9c73bbkvqg"
          RENDER_WAIT: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "900"
          REQUIRE_EXPECTED_SHA: "1"
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Triggering Render CI Runner for heavy test battery..."
          python scripts/ci/render_trigger_deploy.py

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "render-ci-runner"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  render-heavy-gate-fallback:
    name: "Tier 2: Heavy Test Battery (GitHub Ubuntu + Render Backend - Priority 3)"
    if: always() && !cancelled() && needs.fast-gate.result == 'success' && needs.runtime-readiness.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && (needs.resolve-execution-tier.outputs.execution_tier == 'github-ubuntu-render-backend' || needs.render-heavy-gate-render-ci.outputs.fallback_allowed == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [resolve-execution-tier, fast-gate, runtime-readiness, render-heavy-gate-render-ci]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r core/requirements.txt -r gateway/requirements.txt ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis "mcp>=1.28.1,<2"

      - name: Run Full Unit & Component Guard Battery
        run: |
          echo "Local runner offline. Render CI busy. Running heavy battery on GitHub Ubuntu (Priority 3)..."
          pytest -q tests/unit/test_telemetry_event_bus_guard.py tests/security/test_code_review_remediation_guards.py tests/test_satellite_workflow_triggers.py core/tests/agents/test_agents_unified.py core/tests/test_audit_regressions.py core/tests/test_no_auth_stubs.py
          python scripts/ops/wiring_atlas.py --check

      - name: Fast Compile Integrity
        run: python -m compileall -q core/ gateway/ scripts/

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "github-ubuntu-render-backend"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  render-heavy-gate-emergency:
    name: "Tier 2: Heavy Test Battery (GitHub Ubuntu Emergency - Priority 4)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && needs.resolve-execution-tier.outputs.execution_tier == 'github-ubuntu-emergency' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r core/requirements.txt -r gateway/requirements.txt ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis "mcp>=1.28.1,<2"

      - name: Run Full Unit & Component Guard Battery
        run: |
          echo "EMERGENCY: Render quota exhausted. Running heavy battery on GitHub Ubuntu (Priority 4)..."
          pytest -q tests/unit/test_telemetry_event_bus_guard.py tests/security/test_code_review_remediation_guards.py tests/test_satellite_workflow_triggers.py core/tests/agents/test_agents_unified.py core/tests/test_audit_regressions.py core/tests/test_no_auth_stubs.py
          python scripts/ops/wiring_atlas.py --check

      - name: Fast Compile Integrity
        run: python -m compileall -q core/ gateway/ scripts/

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "github-ubuntu-emergency"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  # =========================================================================
  # STAGE 2b: AUTO-MERGE (separate gated job; only after all tier gates pass)
  # Zero Early Landing Invariant: Main is NEVER triggered before PR tests pass 100%.
  # If any tier gate fails, this job fails closed (exit 1) and blocks the merge.
  # =========================================================================
  auto-merge:
    name: "Auto-Merge PR (gated)"
    if: always() && github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: [resolve-execution-tier, fast-gate, runtime-readiness, render-heavy-gate, render-heavy-gate-render-ci, render-heavy-gate-fallback, render-heavy-gate-emergency]
    # SECURITY (full audit 2026-11-13 F-002): review-free squash-merge with a write-scoped
    # PAT allowed any same-repo PR that passes its own authored tests to land on main.
    # Routing through a protected GitHub Environment with required reviewers restores the
    # human gate. One-time setup: Repo Settings -> Environments -> create "production"
    # -> add required reviewers. Until it exists this job waits (fail-closed).
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify all tier gates and squash merge PR
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FAST_RES: ${{ needs.fast-gate.result }}
          READY_RES: ${{ needs.runtime-readiness.result }}
          HEAVY_LOCAL: ${{ needs.render-heavy-gate.result }}
          HEAVY_RENDER_CI: ${{ needs.render-heavy-gate-render-ci.result }}
          RENDER_CI_FALLBACK_ALLOWED: ${{ needs.render-heavy-gate-render-ci.outputs.fallback_allowed }}
          HEAVY_PRIORITY3: ${{ needs.render-heavy-gate-fallback.result }}
          HEAVY_PRIORITY4: ${{ needs.render-heavy-gate-emergency.result }}
        run: |
          echo "=== Auto-Merge Pre-Landing Gate Evaluation ==="
          echo "Tier 1 Fast Gate: $FAST_RES"
          echo "Tier 1 Runtime Readiness: $READY_RES"
          echo "Tier 1+2 Heavy Local Runner: $HEAVY_LOCAL"
          echo "Tier 2 Heavy Render CI Runner: $HEAVY_RENDER_CI (fallback_allowed=$RENDER_CI_FALLBACK_ALLOWED)"
          echo "Tier 2 Heavy Priority 3 (GitHub+Render Backend): $HEAVY_PRIORITY3"
          echo "Tier 2 Heavy Priority 4 (GitHub Emergency): $HEAVY_PRIORITY4"

          # Local path (Zero Cloud Waste): render-heavy-gate runs full Tier 1+2 on self-hosted.
          # Cloud fast-gate/runtime-readiness are intentionally skipped in that case.
          if [ "$HEAVY_LOCAL" = "success" ]; then
            echo "Local full-battery verification succeeded (Tier 1+2, 0 cloud mins)."
          elif [ "$HEAVY_LOCAL" = "failure" ] || [ "$HEAVY_LOCAL" = "cancelled" ]; then
            echo "::error::Tier 1+2 Local Self-Hosted full verification did not succeed (status: $HEAVY_LOCAL). Auto-merge blocked."
            exit 1
          else
            # Cloud fallback path: require Tier 1 cloud gates.
            if [ "$FAST_RES" != "success" ]; then
              echo "::error::Tier 1 Fast Safety Gate did not succeed (status: $FAST_RES). Auto-merge blocked."
              exit 1
            fi
            if [ "$READY_RES" != "success" ]; then
              echo "::error::Tier 1 Runtime Readiness Gate did not succeed (status: $READY_RES). Auto-merge blocked."
              exit 1
            fi
          fi

          if [ "$HEAVY_RENDER_CI" = "failure" ] && [ "$RENDER_CI_FALLBACK_ALLOWED" != "true" ]; then
            echo "::error::Tier 2 Heavy Render CI Runner failed without fallback eligibility. Auto-merge blocked."
            exit 1
          fi

          # At least one heavy tier must have succeeded (the one that was activated)
          HEAVY_OK="false"
          for res in "$HEAVY_LOCAL" "$HEAVY_RENDER_CI" "$HEAVY_PRIORITY3" "$HEAVY_PRIORITY4"; do
            if [ "$res" = "success" ]; then
              HEAVY_OK="true"
              break
            fi
          done

          if [ "$HEAVY_OK" = "false" ]; then
            ACTIVE_COUNT=0
            for res in "$HEAVY_LOCAL" "$HEAVY_RENDER_CI" "$HEAVY_PRIORITY3" "$HEAVY_PRIORITY4"; do
              if [ "$res" != "skipped" ]; then
                ACTIVE_COUNT=$((ACTIVE_COUNT + 1))
              fi
            done
            if [ "$ACTIVE_COUNT" -eq 0 ]; then
              echo "::error::No heavy test tier was activated. Auto-merge blocked."
              exit 1
            fi
            echo "::error::Tier 2 Heavy Test Battery did not succeed (local: $HEAVY_LOCAL, render-ci: $HEAVY_RENDER_CI, p3: $HEAVY_PRIORITY3, p4: $HEAVY_PRIORITY4). Auto-merge blocked."
            exit 1
          fi

          echo "All required tier gates 100% green."
          echo "Autonomous Auto-Landing: Squashing and landing to main now..."
          gh pr merge "$PR_NUMBER" --squash --delete-branch

  # =========================================================================
  # STAGE 3: POST-MERGE PRODUCTION DEPLOY & CANARY (Push to Main or Manual Dispatch)
  # Constitutional Invariant: Deployments are 100% Cloud-Native API triggers
  # (Render, Cloudflare, Vercel) and DO NOT follow the 3-Tier runner hierarchy.
  # =========================================================================
  deploy-and-verify:
    name: "Post-Merge: Plan changed Render services"
    needs: [resolve-execution-tier]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_services: ${{ steps.plan.outputs.has_services }}
      unregistered: ${{ steps.plan.outputs.unregistered }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render free-build quota preflight
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_ESTIMATED_BUILD_MINUTES: "20"
        run: python scripts/ci/render_quota_preflight.py

      - name: Compute changed Render service matrix
        env:
          RENDER_CORE_SERVICE_ID: ${{ vars.RENDER_CORE_SERVICE_ID }}
          RENDER_CORE_RELEASE_URL: ${{ vars.RENDER_CORE_RELEASE_URL }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_SCRAPER_SERVICE_ID: ${{ vars.RENDER_SCRAPER_SERVICE_ID }}
          RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          RENDER_BRAIN_SERVICE_ID: ${{ vars.RENDER_BRAIN_SERVICE_ID }}
          RENDER_CI_RUNNER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID }}
        id: plan
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_deploy }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/ci/plan_render_deploys.py \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            $FORCE_FLAG \
            --targets "${{ inputs.target_service || 'all' }}" \
            --output "$GITHUB_OUTPUT"

      # A changed service whose ID is not configured is UNREGISTERED, not a
      # failure. It is skipped from the deploy matrix but MUST stay visible:
      # log it, surface it in the summary, and publish it to MCP Tower so the
      # dashboard shows UNREGISTERED instead of silently looking healthy.
      - name: Surface UNREGISTERED services
        if: always()
        env:
          UNREGISTERED: ${{ steps.plan.outputs.unregistered }}
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -n "$UNREGISTERED" ] && [ "$UNREGISTERED" != "[]" ]; then
            echo "⚠️ UNREGISTERED Render services (skipped, visible): $UNREGISTERED"
            python scripts/ci/publish_ci_attestation.py || true
          else
            echo "✅ All changed Render services are registered"
          fi

  deploy-render-services:
    name: "Deploy changed Render services"
    needs: deploy-and-verify
    if: needs.deploy-and-verify.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deploy-and-verify.outputs.matrix) }}
    concurrency:
      group: render-${{ matrix.service }}-main
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Trigger and poll only the changed Render service
        env:
          RENDER_API_KEY_ENV: ${{ matrix.api_key_env }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_SYNC_PAT: ${{ secrets.OPEN_SYNC_PAT }}
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          SELF_HEAL_PAT: ${{ secrets.SELF_HEAL_PAT }}
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          RENDER_WAIT: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "600"
        run: python scripts/ci/render_trigger_deploy.py

      - name: Verify source revision, not only HTTP health
        env:
          RENDER_API_KEY_ENV: ${{ matrix.api_key_env }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: ${{ matrix.release_url }}
        run: python scripts/ci/render_deploy_attestation.py

  verify-render-services:
    name: "Verify changed Render services"
    needs: [deploy-and-verify, deploy-render-services]
    if: needs.deploy-and-verify.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Smoke-check configured authoritative targets only
        env:
          RENDER_CANARY_URLS_JSON: ${{ vars.RENDER_CANARY_URLS_JSON }}
        run: python scripts/ci/render_canary.py


  no-render-deploy:
    name: "No Render deploy required"
    needs: deploy-and-verify
    if: needs.deploy-and-verify.outputs.has_services != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No deployable Render service changed; skipping Render build and deploy."

  deploy-cloudflare:
    name: "Deploy Cloudflare Edge Mesh (path-filtered)"
    needs: deploy-and-verify
    if: |
      always() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)) &&
      (
        contains(inputs.target_service, 'all') ||
        contains(inputs.target_service, 'cloudflare') ||
        contains(inputs.target_service, 'studio')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Detect Cloudflare-relevant changes
        id: cf_changes
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_DEPLOY="false"
          # Manual force or explicit cloudflare target always deploys
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && { [ "${{ inputs.force_deploy }}" = "true" ] || echo "${{ inputs.target_service || '' }}" | grep -qiE '(^|,)(all|cloudflare|studio)(,|$)'; }; then
            SHOULD_DEPLOY="true"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # Handle missing/zero base (new branch or force push edge)
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED="$(git show --name-only --pretty='' "$HEAD" 2>/dev/null || true)"
            else
              CHANGED="$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)"
            fi
            if echo "$CHANGED" | grep -qE '^(studio/|infrastructure/cloudflare)'; then
              SHOULD_DEPLOY="true"
            fi
          fi
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deploy needed: $SHOULD_DEPLOY"

      - name: Setup Node.js
        if: steps.cf_changes.outputs.should_deploy == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy Keep-Warm Worker
        if: steps.cf_changes.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -d infrastructure/cloudflare-render-keepwarm ]; then
              cd infrastructure/cloudflare-render-keepwarm
              npx wrangler deploy --var CF_COMMIT_SHA:${{ github.sha }} || echo "Wrangler keepwarm deploy skipped or non-blocking"
            else
              echo "keepwarm dir not found; skipping"
            fi
          else
            echo "Cloudflare credentials not configured in secrets; skipping keepwarm worker deploy."
          fi

      - name: Deploy Studio Edge Proxy
        if: steps.cf_changes.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -d infrastructure/cloudflare-studio-proxy ]; then
              cd infrastructure/cloudflare-studio-proxy
              npx wrangler deploy --var CF_COMMIT_SHA:${{ github.sha }} || echo "Wrangler proxy deploy skipped or non-blocking"
            else
              echo "studio proxy dir not found; skipping"
            fi
          else
            echo "Cloudflare credentials not configured in secrets; skipping proxy deploy."
          fi

      - name: Build & Deploy Studio to Cloudflare Pages
        if: steps.cf_changes.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -d studio ]; then
              cd studio
              npm install --legacy-peer-deps
              npm run build
              npx wrangler pages deploy build --project-name=supremeai-studio --branch=main
              echo "Successfully deployed new studio build to Cloudflare Pages (supremeai-studio.pages.dev)"
            else
              echo "studio dir not found; skipping Pages deploy."
            fi
          else
            echo "Cloudflare credentials not configured in secrets; skipping Pages deploy."
          fi

      - name: Cloudflare deploy skipped (no relevant changes)
        if: steps.cf_changes.outputs.should_deploy != 'true'
        run: echo "No studio/ or infrastructure/cloudflare* changes detected; skipping Cloudflare deploy (0 cloud build mins)."

  deploy-vercel:
    name: "Deploy Vercel Frontend Hook"
    needs: deploy-and-verify
    if: |
      always() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)) &&
      (
        (github.event_name == 'push' && (
          contains(join(github.event.commits.*.modified, ' '), 'studio/') ||
          contains(join(github.event.commits.*.added, ' '), 'studio/') ||
          contains(join(github.event.commits.*.removed, ' '), 'frontend/') ||
          contains(join(github.event.commits.*.modified, ' '), 'frontend/') ||
          contains(join(github.event.commits.*.added, ' '), 'frontend/') ||
          contains(join(github.event.commits.*.modified, ' '), 'vercel') ||
          contains(join(github.event.commits.*.added, ' '), 'vercel')
        )) ||
        (github.event_name == 'workflow_dispatch' && (
          contains(inputs.target_service, 'all') ||
          contains(inputs.target_service, 'vercel')
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Trigger Vercel Deployment Preflight & API Check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            python scripts/ci/vercel_deploy_preflight.py || true
            echo "Vercel deploy preflight checked."
          else
            echo "VERCEL_TOKEN not provided; skipping Vercel trigger."
          fi
