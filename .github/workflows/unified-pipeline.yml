name: SupremeAI Unified CI/CD Pipeline

# =============================================================================
# SINGLE UNIFIED CI/CD SSOT (Zero Duplicate Runs)
# 1. On Pull Request / Schedule:
#    - Tier 1 Fast Safety Gates (GitHub Actions: Lint, Boundaries, Contracts <30s)
#    - Tier 2 Focused verification (hosted for PRs, local only for trusted main)
# 2. On Merge / Push to Main:
#    - Detect changed service boundaries
#    - Deploy only the required Render services
#    - Smoke-check only authoritative configured targets
# =============================================================================

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Manually re-run and force production deployment"
        required: false
        default: false
        type: boolean
      target_service:
        description: "Target service(s) to deploy (all, render-all, cloudflare, vercel, core, api, mcp, worker, scraper, brain, or comma-separated e.g. core,mcp,cloudflare)"
        required: false
        default: "all"
        type: string
      ai_knowledge_json:
        description: "Optional external AI JSON packet for validation only (not stored or approved)"
        required: false
        default: ""
        type: string
      ai_knowledge_issue:
        description: "Optional Issue or PR number to validate share blocks (not stored or approved)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unified-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# =============================================================================
# ENVIRONMENT RULE — read before adding `environment:` to any job
# -----------------------------------------------------------------------------
# The `production` environment has REQUIRED REVIEWERS configured in GitHub
# (Settings > Environments > production). GitHub therefore pauses EVERY job
# that declares `environment: production` until a human clicks "Review
# deployments" — one prompt per job, per run.
#
# That is why no PR-triggered job in this file declares an environment: a PR
# check that waits for a human is not a check. Jobs here were carrying
# `environment: production` purely as "scoping/secret context" and that silently
# converted every pull request into a stack of manual approvals.
#
# `environment:` is now allowed in exactly two situations, and both are pinned
# by tests/ci/test_deploy_environment_split.py:
#   1. `auto-merge-high-risk` -> `production-approval`: the owner review gate for
#      protected changes (this approval is the protection, keep it).
#   2. The post-merge deploy path -> `production`: `deploy-and-verify` (resolves
#      the deploy matrix from `vars.RENDER_*_SERVICE_ID`), `deploy-render-services`
#      (production `RENDER_API_KEY_*`), `deploy-cloudflare`, `deploy-vercel`.
#      All four are pinned to main and consume credentials or variables that may
#      be environment-scoped. Cost: one approval per deploy — and for
#      `deploy-render-services` one per MATRIX LEG, because GitHub asks per job.
#
# Everything else — every Tier 1/Tier 2 gate and the landing decision — runs
# with NO environment and therefore never prompts. Net effect: a pull request
# needs zero approvals (except the deliberate owner review for protected paths);
# a merge needs one approval, or none at all once the required reviewers are
# removed from `production`.
#
# To remove the prompts entirely without touching this file: delete the required
# reviewers from the `production` environment in GitHub. Keep the reviewers on
# `production-approval` (see the comment above `auto-merge-high-risk`).
# =============================================================================

jobs:
  # =========================================================================
  # STAGE 0: 4-LEVEL RUNNER HIERARCHY PREFLIGHT (<10s)
  # SSOT Invariant: Every pipeline must execute this check FIRST before any other job.
  # Resolves Priority 1 (Local PC: 0m) -> Priority 2 (Render CI) -> Priority 3 -> Priority 4 (Emergency)
  # =========================================================================
  resolve-execution-tier:
    name: "Tier 1: 4-Level Runner Hierarchy Preflight (<10s)"
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      execution_tier: ${{ steps.runner-check.outputs.execution_tier }}
      is_local_online: ${{ steps.runner-check.outputs.is_local_online }}
    steps:
      # Use privileged runner-list access only for trusted main verification,
      # not for a pull request or release planning.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check 4-Level Execution Hierarchy
        id: runner-check
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force_deploy)) && (secrets.OPEN_SYNC_PAT || secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.OPEN_DISPATCH_TOKEN) || secrets.GITHUB_TOKEN }}
          ALLOW_LOCAL_CI: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force_deploy)) }}
        run: |
          if [ "$ALLOW_LOCAL_CI" = true ]; then
            python scripts/ci/resolve_execution_tier.py
          else
            # Also safe while the trusted base still has the old resolver.
            printf 'execution_tier=github-ubuntu-render-backend\nis_local_online=false\n' >> "$GITHUB_OUTPUT"
          fi

  service-health:
    name: Production liveness (API + MCP Tower)
    needs: [resolve-execution-tier]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check the two public entrypoints
        run: |
          python3 -c 'import yaml' || python3 -m pip install 'PyYAML==6.0.3'
          python3 scripts/ops/master_health_check.py --timeout 8 --quick-liveness >> "$GITHUB_STEP_SUMMARY"
          echo "[Full fleet and provider report — Nightly Ops]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/ops-maintenance.yml?query=event%3Aschedule)" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # STAGE 1: TIER 1 - MINIMAL FAST GATES (Cloud fallback only)
  # Zero Cloud Waste (SSOT): when local PC is online, fast-gate + readiness +
  # heavy battery all run on the local self-hosted runner (0 cloud minutes).
  # These cloud jobs run ONLY when local is offline/unavailable.
  # =========================================================================
  fast-gate:
    name: "Tier 1: Fast Safety Gate (<30s, cloud fallback)"
    needs: [resolve-execution-tier]
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c core/requirements.lock -c gateway/requirements.lock ruff pytest pytest-asyncio pydantic pydantic-settings python-dotenv fastapi httpx pyyaml sqlalchemy redis pyjwt requests aiosqlite defusedxml

      - name: Fast fatal error & syntax lint
        run: ruff check core/ gateway/ scripts/ci/ --select E9,F63,F7,F82 --exclude core/tests/

      - name: Runner probe exception and exec checks
        run: ruff check --isolated --select BLE001,S110,S102 scripts/ci/check_opportunistic_audit.py scripts/ci/resolve_execution_tier.py

      - name: Critical Security & Architecture Guards Suite
        run: |
          pytest -q core/tests/unit_light/test_source_discovery.py gateway/tests/test_source_discovery_proxy.py tests/test_bridge_landing_watchdog.py tests/test_ai_semantic_pr_verifier.py tests/ci/test_workflow_annotation_summary.py tests/unit/test_telemetry_event_bus_guard.py tests/security/test_code_review_remediation_guards.py tests/test_satellite_workflow_triggers.py tests/test_tiny_brain_guard.py tests/test_tiny_brain_service.py tests/ci/test_render_deploy_attestation.py tests/ci/test_deploy_environment_split.py tests/test_web_engine_providers.py tests/test_web_engine_health.py tests/test_free_route_policy_tool.py browser/tests/test_relay_session_state.py browser/tests/test_relay_streaming.py browser/tests/test_relay_kill_switch.py gateway/tests/test_web_engine_stream.py gateway/tests/test_injury_hysteresis.py tests/test_web_surfaces_controls.py core/tests/agents/test_agents_unified.py tests/test_observability_telemetry_endpoint.py tests/test_apply_cross_repo_patch.py
          python scripts/ops/wiring_atlas.py --check

      # Core and Gateway changes can break satellite contracts without touching
      # vscode/. This check is read-only; there is no in-tree extension to build.
      - name: Verify Satellite Client API Contracts
        run: python scripts/ci/nightly_repo_hygiene.py --verify-client-contracts

  runtime-readiness:
    name: "Tier 1: Runtime Readiness & Boundaries (<30s, cloud fallback)"
    needs: [resolve-execution-tier]
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This runs before any candidate checkout or code executes in this job.
      # The verifier reads PR data via the API from the exact trusted base.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _verifier-base
          persist-credentials: false
      - name: Load active LLM keys from Infisical
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG || vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
          export-type: env
      - name: Map Infisical key aliases into the gate pool format
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/map_provider_pool_keys.py --append-env "$GITHUB_ENV"

      - name: AI Semantic PR Verification Gate (High-Risk Enforcement)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # External diff transfer is disabled by default for privacy/cost.
          # High-risk PRs without an approved semantic review remain unverified;
          # maintainers must review and resolve the required gate, not bypass it.
          SEMANTIC_VERIFIER_ALLOW_EXTERNAL_DIFF: ${{ vars.SEMANTIC_VERIFIER_ALLOW_EXTERNAL_DIFF }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ env.GROQ_API_KEY || secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
        working-directory: _verifier-base
        run: python3 scripts/ci/ai_semantic_pr_verifier.py --pr "${{ github.event.pull_request.number }}"

      - name: Clean up verifier base checkout
        if: always() && github.event_name == 'pull_request'
        run: rm -rf _verifier-base

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install readiness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Verify AI decision records (Rule 13 - database, trash or admin)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Pool keys come from the Infisical export step above; DB creds from vault or repo secrets.
          SUPABASE_URL: ${{ env.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/ci/verify_decision_records.py --pr "${{ github.event.pull_request.number }}"


      - name: Verify readiness contract
        run: |
          test -f scripts/ci/readiness_contract.py
          python scripts/ci/readiness_contract.py --self-test
          python scripts/ci/readiness_contract.py --check-required-names
          python scripts/ci/production_release_gate.py --self-test
          python scripts/ci/production_release_gate.py --check
          python scripts/agents/check_loop_contract_parity.py

      - name: Verify timeout and silent-failure policy
        run: |
          python scripts/ci/timeout_policy_guard.py --check
          python scripts/ci/silent_failure_guard.py --check

      - name: Check public export allowlist
        run: python scripts/ci/public_surface_guard.py --manifest scripts/ci/public_surface_manifest.txt

      - name: Anti-Duplication Regression Guard (Zero New Code Clones)
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }} --depth=50
          python scripts/ci/detect_new_duplicates.py --base-ref "origin/${{ github.base_ref || 'main' }}" --max-new 0

  # =========================================================================
  # STAGE 2: TIER 2 - HEAVY TEST BATTERY (4-Tier SSOT per PR_TO_PRODUCTION_LIFECYCLE.md)
  # Priority 1: Local PC (0 cloud mins) -> Priority 2: Render CI Runner -> Priority 3: GitHub+Render Backend -> Priority 4: GitHub Emergency
  # =========================================================================
  render-heavy-gate:
    name: "Tier 1+2: Full Verification Battery (Local Self-Hosted, 0 cloud mins)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force_deploy)) && needs.resolve-execution-tier.outputs.is_local_online == 'true'
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 20
    needs: [resolve-execution-tier]
    steps:
      # The persistent personal runner only receives code from trusted main.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.lock
            gateway/requirements.lock

      - name: Install verification dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --prefer-binary -r core/requirements.lock -r gateway/requirements.lock ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis "mcp>=1.28.1,<2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tier 1 — Fast fatal error & syntax lint
        shell: powershell
        run: ruff check core/ gateway/ scripts/ci/ --select E9,F63,F7,F82 --exclude core/tests/

      - name: Runner probe exception and exec checks
        run: ruff check --isolated --select BLE001,S110,S102 scripts/ci/check_opportunistic_audit.py scripts/ci/resolve_execution_tier.py

      - name: Tier 1 — Critical Security & Architecture Guards Suite
        shell: powershell
        run: |
          pytest -q tests/unit/test_telemetry_event_bus_guard.py tests/security/test_code_review_remediation_guards.py tests/test_satellite_workflow_triggers.py tests/test_tiny_brain_guard.py tests/test_tiny_brain_service.py tests/ci/test_render_deploy_attestation.py tests/ci/test_deploy_environment_split.py tests/test_web_engine_providers.py tests/test_web_engine_health.py tests/test_free_route_policy_tool.py browser/tests/test_relay_session_state.py browser/tests/test_relay_streaming.py browser/tests/test_relay_kill_switch.py gateway/tests/test_web_engine_stream.py gateway/tests/test_injury_hysteresis.py tests/test_web_surfaces_controls.py core/tests/agents/test_agents_unified.py tests/test_observability_telemetry_endpoint.py tests/test_apply_cross_repo_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ops/wiring_atlas.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tier 1 — Runtime Readiness & Boundaries
        shell: powershell
        run: |
          if (!(Test-Path scripts/ci/readiness_contract.py)) { throw "readiness_contract.py missing" }
          python scripts/ci/readiness_contract.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/readiness_contract.py --check-required-names
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/production_release_gate.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/production_release_gate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/timeout_policy_guard.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/silent_failure_guard.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/public_surface_guard.py --manifest scripts/ci/public_surface_manifest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/agents/check_loop_contract_parity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tier 1 — Anti-Duplication Regression Guard
        shell: powershell
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }} --depth=50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/detect_new_duplicates.py --base-ref "origin/${{ github.base_ref || 'main' }}" --max-new 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # বাংলা মন্তব্য (2026-11-24): Graphify AST blast-radius + circular-import guard।
      # sync_graph_to_memory.py-এর analyze_blast_radius() ইঞ্জিন অনেকদিন ছিল,
      # কিন্তু PR gate-এ কোনো workflow এটিকে চালাত না। এখন প্রতি PR-এ:
      #   1) touched files-এর 1-hop dependents + impacted pytest রিপোর্ট হয়,
      #   2) নতুন circular import ধরা পড়লে gate fail করে।
      # stdlib AST fallback ব্যবহার হয় (runner-এ graphify CLI নেই) — CI-safe।
      - name: Tier 1 — Graphify Blast-Radius & Circular-Import Guard
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} --depth=50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = git diff --name-only "origin/$($env:BASE_REF)"...HEAD | Where-Object { $_ -match '\.(py|ts|tsx)$' } | Select-Object -First 20
          $env:BASE_REF = "${{ github.base_ref }}"
          if (-not $changed) { Write-Host 'No code files changed — graph guard skipped'; exit 0 }
          $files = $changed -join ' '
          Write-Host "Touched files: $files"
          python scripts/ci/sync_graph_to_memory.py --blast-radius @($changed) | Tee-Object -Variable blast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json = $blast -join "`n" | ConvertFrom-Json
          if ($json.import_cycles.Count -gt 0) {
            Write-Host "::error::PR touches files inside circular import cycles: $($json.import_cycles | ConvertTo-Json -Compress)"
            exit 1
          }
          if ($json.layer_violations.Count -gt 0) {
            Write-Host "::error::Layer violations (core → gateway/studio/scripts): $($json.layer_violations -join ', ')"
            exit 1
          }
          Write-Host "::notice::Blast radius: $($json.risk_level) ($($json.direct_dependent_count) dependents, $($json.impacted_tests.Count) impacted tests)"

      - name: Tier 2 — Heavy Test Battery & Compile Integrity
        shell: powershell
        run: |
          Write-Host "Running full verification battery on local self-hosted runner (0 cloud mins)..."
          python -m pytest "@config/ci/pr-battery.args"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ops/wiring_atlas.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q core/ gateway/ scripts/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish CI Attestation to MCP Tower
        if: always()
        shell: powershell
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "local-self-hosted"
        run: |
          if (Test-Path scripts/ci/publish_ci_attestation.py) {
            python scripts/ci/publish_ci_attestation.py
          } else {
            Write-Host "Attestation script completed."
          }

  render-heavy-gate-render-ci:
    name: "Tier 2: Heavy Test Battery (Render CI Runner - Priority 2)"
    # Dormant: the resolver cannot choose Priority 2 without authoritative quota.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force_deploy)) && needs.resolve-execution-tier.outputs.is_local_online != 'true' && needs.resolve-execution-tier.outputs.execution_tier == 'render-ci-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    outputs:
      fallback_allowed: ${{ steps.render-ci.outputs.fallback_allowed }}
      verified_sha: ${{ steps.render-ci.outputs.verified_sha }}
    steps:
      # The trigger has a Render credential; only the CI payload targets github.sha.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Trigger Render CI Runner Service
        id: render-ci
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID }}
          RENDER_WAIT: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "900"
          REQUIRE_EXPECTED_SHA: "1"
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Triggering Render CI Runner for heavy test battery..."
          python scripts/ci/render_trigger_deploy.py

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "render-ci-runner"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  render-heavy-gate-fallback:
    name: "Tier 2: Heavy Test Battery (GitHub Ubuntu - Priority 3)"
    if: always() && !cancelled() && needs.fast-gate.result == 'success' && needs.runtime-readiness.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && (needs.resolve-execution-tier.outputs.execution_tier == 'github-ubuntu-render-backend' || (needs.resolve-execution-tier.outputs.execution_tier == 'render-ci-runner' && needs.render-heavy-gate-render-ci.result == 'failure' && needs.render-heavy-gate-render-ci.outputs.fallback_allowed == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [resolve-execution-tier, fast-gate, runtime-readiness, render-heavy-gate-render-ci]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.lock
            gateway/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r core/requirements.lock -r gateway/requirements.lock ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis "mcp>=1.28.1,<2"

      - name: Run Full Unit & Component Guard Battery
        run: |
          echo "Running the isolated GitHub Ubuntu verification battery (Priority 3)..."
          python -m pytest "@config/ci/pr-battery.args"
          python scripts/ops/wiring_atlas.py --check

      - name: Fast Compile Integrity
        run: python -m compileall -q core/ gateway/ scripts/

      - name: Publish CI Attestation to MCP Tower
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "github-ubuntu-render-backend"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  render-heavy-gate-emergency:
    name: "Tier 2: Heavy Test Battery (GitHub Ubuntu Emergency - Priority 4)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && needs.resolve-execution-tier.outputs.execution_tier == 'github-ubuntu-emergency'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.lock
            gateway/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r core/requirements.lock -r gateway/requirements.lock ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis "mcp>=1.28.1,<2"

      - name: Run Full Unit & Component Guard Battery
        run: |
          echo "EMERGENCY: Render quota exhausted. Running heavy battery on GitHub Ubuntu (Priority 4)..."
          python -m pytest "@config/ci/pr-battery.args"
          python scripts/ops/wiring_atlas.py --check

      - name: Fast Compile Integrity
        run: python -m compileall -q core/ gateway/ scripts/

      - name: Publish CI Attestation to MCP Tower
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "github-ubuntu-emergency"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  # =========================================================================
  # STAGE 2b: LANDING DECISION — one policy after the required checks finish.
  # These needs are job results for this run's github.sha, not a PR-head rollup.
  # Drafts run CI, but no landing decision is requested until ready_for_review.
  # =========================================================================
  cancel-on-tier1-fail:
    name: "Fail-Fast: Cancel Run on Tier 1 Failure"
    if: failure() && github.event_name == 'pull_request'
    needs: [fast-gate, runtime-readiness, syntax-and-governance-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel remaining jobs in this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  verify-pr:
    name: "PR Verification"
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [resolve-execution-tier, fast-gate, runtime-readiness, render-heavy-gate-fallback, syntax-and-governance-gate, golden-eval-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful verification of this run's merge revision
        env:
          TIER: ${{ needs.resolve-execution-tier.outputs.execution_tier }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if not results or failed or os.environ["TIER"] != "github-ubuntu-render-backend":
              raise SystemExit(f"PR verification did not pass on the hosted lane: {', '.join(failed)}")
          print(f"PR verification passed at {os.environ['GITHUB_SHA']}")
          PY

  ai-evaluate-and-approve:
    name: "PR Landing Decision"
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.verify-pr.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - verify-pr
      - resolve-execution-tier
      - fast-gate
      - runtime-readiness
      - render-heavy-gate
      - render-heavy-gate-render-ci
      - render-heavy-gate-fallback
      - render-heavy-gate-emergency
      - syntax-and-governance-gate
      - golden-eval-gate
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.guard.outputs.decision }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      # Run the policy from the trusted base commit; a PR cannot edit the
      # Python policy it is being evaluated against.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _verifier-base
          persist-credentials: false
      - name: Decide whether the tested PR can land
        id: guard
        working-directory: _verifier-base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_MERGE_SHA: ${{ github.sha }}
          PR_GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          guard = [sys.executable, "scripts/ci/tiny_brain_pr_guard.py"]
          flags = set(re.findall(r"--[a-z][a-z-]+", subprocess.check_output([*guard, "--help"], text=True)))
          required = {"--head-sha", "--base-sha", "--merge-sha", "--recheck-candidate"}
          if required <= flags:
              rc = subprocess.call([
                  *guard, "--pr", os.environ["PR_NUMBER"],
                  "--head-sha", os.environ["EXPECTED_HEAD_SHA"],
                  "--base-sha", os.environ["EXPECTED_BASE_SHA"],
                  "--merge-sha", os.environ["TESTED_MERGE_SHA"],
              ])

              # --- Advisor pass: downgrade-only, fail-open ---------------
              # tiny_brain_pr_guard.py (trusted base) is the AUTHORITY.
              # ai_pr_evaluator.py is a second opinion that may only HOLD an
              # auto-merge (AUTO_MERGE -> OWNER_REVIEW), never widen it.
              # Any advisor problem is a no-op, so a broken advisor can never
              # block or auto-land a PR by itself.
              def _read_outputs() -> dict:
                  values = {}
                  try:
                      with open(os.environ["GITHUB_OUTPUT"], encoding="utf-8") as fh:
                          for line in fh:
                              if "=" in line:
                                  key, _, value = line.strip().partition("=")
                                  values[key] = value
                  except OSError:
                      pass
                  return values

              before = _read_outputs()
              if rc == 0 and before.get("decision") == "AUTO_MERGE":
                  advisor_out = os.path.join(os.environ.get("RUNNER_TEMP", "."), "advisor.json")
                  try:
                      with open(advisor_out, "w", encoding="utf-8") as fh:
                          subprocess.run(
                              [sys.executable, "scripts/ci/ai_pr_evaluator.py",
                               "--pr", os.environ["PR_NUMBER"], "--json"],
                              stdout=fh, stderr=subprocess.DEVNULL, timeout=180,
                          )
                      composed = subprocess.run(
                          [sys.executable, "scripts/ci/landing_decision_compose.py",
                           "--decision", before.get("decision", ""),
                           "--reason", before.get("reason", ""),
                           "--advisor-stdout", advisor_out],
                          capture_output=True, text=True, timeout=30,
                      ).stdout
                      fields = dict(
                          line.split("=", 1) for line in composed.splitlines() if "=" in line
                      )
                      if fields.get("decision") and fields["decision"] != before.get("decision"):
                          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                              out.write(f"decision={fields['decision']}\n")
                              out.write(f"reason={fields.get('reason', '')}\n")
                          print(f"::warning::Advisor held the auto-merge: {fields.get('reason')}")
                  except Exception as exc:  # fail-open by design
                      print(f"::notice::Advisor unavailable, authority decision stands ({exc})")
              if rc != 0 and _read_outputs().get("reason") == "pr_base_changed":
                  print("::notice::PR base changed mid-CI; updating PR branch so CI re-runs cleanly.")
                  subprocess.run(["gh", "pr", "update-branch", os.environ["PR_NUMBER"], "--repo", os.environ["GITHUB_REPOSITORY"]], check=False)
                  sys.exit(0)
              sys.exit(rc)

          # First rollout only: the known old CLI cannot issue a landing decision.
          # Record the hold without calling legacy approval or using the PR's policy.
          legacy = {"--run-id", "--brain-url", "--dry-run", "--json"}
          if legacy <= flags and required.isdisjoint(flags):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("decision=BLOCKED\nreason=legacy_trusted_base_guard\n")
              print("::notice::Automatic landing blocked: the trusted base still has the legacy guard. "
                    "This policy rollout needs normal owner review under the repository rules.")
          else:
              sys.exit("Unsupported trusted base landing guard CLI; no landing authorized.")
          PY

  # The ONLY job in this pipeline using the approval-bearing environment
  # (`production-approval`, the one with a required reviewer): protected changes
  # — provider core, auth, workflows, registry/blueprint — stop here for a human.
  # `production-approval` is the ONLY human stop in the whole pipeline. No other
  # job may declare it: putting it on a deploy or merge job re-introduces a manual
  # approval on every merge and stalls auto-deploy. (`production` is a different
  # thing — it also has required reviewers and is restricted to the two
  # main-only platform deploys; read the ENVIRONMENT RULE at the top of this file
  # before adding `environment:` anywhere.)
  # Invariant pinned by tests/ci/test_deploy_environment_split.py.
  auto-merge-high-risk:
    name: "Owner Review (Protected PR)"
    if: >-
      !cancelled() && needs.ai-evaluate-and-approve.result == 'success' &&
      needs.ai-evaluate-and-approve.outputs.decision == 'OWNER_REVIEW'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [ai-evaluate-and-approve]
    environment: production-approval
    permissions: {}
    steps:
      - run: echo "Protected changes approved via the production environment."

  merge-verified-pr:
    name: "Merge Verified PR"
    if: >-
      always() && !cancelled() && needs.ai-evaluate-and-approve.result == 'success' &&
      (needs.ai-evaluate-and-approve.outputs.decision == 'AUTO_MERGE' ||
       (needs.ai-evaluate-and-approve.outputs.decision == 'OWNER_REVIEW' &&
        needs.auto-merge-high-risk.result == 'success'))
    runs-on: ubuntu-24.04
    needs: [ai-evaluate-and-approve, auto-merge-high-risk]
    timeout-minutes: 5
    # Serialize our own landings so one cannot move main during another's recheck.
    concurrency:
      group: unified-main-landing
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _verifier-base
          persist-credentials: false
      - name: Auto-doctor prescription on failure
        # বাংলা মন্তব্য: landing fail হলে auto_doctor.py লগ শ্রেণীবিন্যাস করে summary-তে prescription দেয়।
        # এটি শুধু prescriber — কখনো gate/decision বদলায় না (audit A3, fail-open by design)।
        # বাংলা মন্তব্য: recheck step-এর stdout রানটাইমে ধরার কোনো native উপায় নেই,
        # তাই আমরা recheck-কে tee দিয়ে log ফাইলে লিখি — doctor সেটাই classify করে।
        if: failure()
        shell: bash
        working-directory: _verifier-base
        run: |
          if [ -f "${{ runner.temp }}/recheck-output.log" ]; then
            python3 scripts/ops/auto_doctor.py --log-file "${{ runner.temp }}/recheck-output.log" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "🩺 Auto-doctor: no recheck log captured for this run — nothing to prescribe." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Recheck the candidate and squash merge
        shell: bash
        working-directory: _verifier-base
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_MERGE_SHA: ${{ github.sha }}
        run: |
          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state || true)
          if [ "$PR_STATE" = "MERGED" ]; then
            echo "PR #$PR_NUMBER already merged; skipping."
            exit 0
          fi
          MERGE_STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus || true)
          if [ "$MERGE_STATE" = "BEHIND" ]; then
            echo "PR #$PR_NUMBER is BEHIND base branch; updating branch so CI re-runs cleanly."
            gh pr update-branch "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          set -o pipefail
          # বাংলা মন্তব্য: recheck+merge দুটোই log ফাইলে tee করা হয় যাতে failure()-এ doctor পড়তে পারে।
          {
            python3 scripts/ci/tiny_brain_pr_guard.py --recheck-candidate --pr "$PR_NUMBER" \
              --head-sha "$EXPECTED_HEAD_SHA" --base-sha "$EXPECTED_BASE_SHA" --merge-sha "$TESTED_MERGE_SHA"
          } 2>&1 | tee "${{ runner.temp }}/recheck-output.log"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch --match-head-commit "$EXPECTED_HEAD_SHA" 2>&1 | tee -a "${{ runner.temp }}/recheck-output.log"

  codeql:
    name: "Analyze (${{ matrix.language }})"
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  warning-summary:
    name: "Summarize Workflow Warnings"
    if: always()
    needs: [verify-pr, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Summarize source run annotations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/workflow_annotation_summary.py

  # =========================================================================
  # STAGE 3: POST-MERGE PRODUCTION DEPLOY & CANARY (Push to Main or Manual Dispatch)
  # Constitutional Invariant: Deployments are 100% Cloud-Native API triggers
  # (Render, Cloudflare, Vercel) and DO NOT follow the 3-Tier runner hierarchy.
  # =========================================================================
  deploy-and-verify:
    name: "Post-Merge: Plan changed Render services"
    needs: [resolve-execution-tier]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true))
    runs-on: ubuntu-24.04
    # KEEP the environment: this job resolves the deploy matrix from
    # `vars.RENDER_*_SERVICE_ID` / `vars.MCP_TOWER_ATTESTATION_URL`, which may be
    # environment-scoped. Without them the planner silently plans nothing (an
    # empty matrix is indistinguishable from "no services changed"). Main-only,
    # so it costs one approval per merge — removed entirely by deleting the
    # required reviewers from `production` (see the ENVIRONMENT RULE above).
    environment: production
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_services: ${{ steps.plan.outputs.has_services }}
      unregistered: ${{ steps.plan.outputs.unregistered }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install service registry parser
        run: python -m pip install pyyaml

      - name: Compute changed Render service matrix
        env:
          RENDER_CORE_SERVICE_ID: ${{ vars.RENDER_CORE_SERVICE_ID }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_SCRAPER_SERVICE_ID: ${{ vars.RENDER_SCRAPER_SERVICE_ID || vars.RENDER_BROWSER_SERVICE_ID }}
          RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          RENDER_BRAIN_SERVICE_ID: ${{ vars.RENDER_BRAIN_SERVICE_ID }}
          RENDER_CI_RUNNER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          DEPLOY_TARGETS: ${{ inputs.target_service || 'all' }}
        id: plan
        run: |
          FORCE_FLAG=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_DEPLOY" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/ci/plan_render_deploys.py \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            $FORCE_FLAG \
            --targets "$DEPLOY_TARGETS" \
            --output "$GITHUB_OUTPUT"

      # A changed service whose ID is not configured is UNREGISTERED, not a
      # failure. It is skipped from the deploy matrix but MUST stay visible:
      # log it, surface it in the summary, and publish it to MCP Tower so the
      # dashboard shows UNREGISTERED instead of silently looking healthy.
      - name: Surface UNREGISTERED services
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          UNREGISTERED: ${{ steps.plan.outputs.unregistered }}
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -n "$UNREGISTERED" ] && [ "$UNREGISTERED" != "[]" ]; then
            echo "⚠️ UNREGISTERED Render services (skipped, visible): $UNREGISTERED" | tee -a "$GITHUB_STEP_SUMMARY"
            python scripts/ci/publish_ci_attestation.py || true
          else
            echo "✅ All changed Render services are registered"
          fi

  deploy-render-services:
    name: "Deploy and verify Render (${{ matrix.service }})"
    needs: deploy-and-verify
    if: github.ref == 'refs/heads/main' && needs.deploy-and-verify.outputs.has_services == 'true'
    runs-on: ubuntu-24.04
    # KEEP the environment: this job consumes production `RENDER_API_KEY_*`
    # credentials (possibly environment-scoped) and triggers the real Render
    # deploy, main-only. Note the cost: this job is a MATRIX, so GitHub asks
    # for one approval per service leg. Cutting that needs a single-job loop
    # (tracked as a follow-up) or removing the required reviewers.
    environment: production
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deploy-and-verify.outputs.matrix) }}
    concurrency:
      group: render-service-${{ matrix.service_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Trigger and poll the exact source revision
        id: deploy
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REQUIRE_EXPECTED_SHA: "1"
          RENDER_AUXILIARY: ${{ matrix.service == 'ci-runner' && '1' || '0' }}
          RENDER_API_KEY: ${{ secrets[matrix.api_key_env] || secrets[matrix.api_key_alias_env] }}
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          RENDER_HEALTH_PATH: ${{ matrix.health_path }}
          RENDER_WAIT_TIMEOUT_SECONDS: "180"
        run: python scripts/ci/render_trigger_deploy.py

      - name: Attest the triggered deploy ID and runtime SHA
        id: attest
        env:
          RENDER_DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          RENDER_AUXILIARY: ${{ matrix.service == 'ci-runner' && '1' || '0' }}
          RENDER_API_KEY: ${{ secrets[matrix.api_key_env] || secrets[matrix.api_key_alias_env] }}
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: ${{ steps.deploy.outputs.release_url }}
        run: python scripts/ci/render_deploy_attestation.py

      # Siblings still verify after a partial failure. A canary after a
      # failed deploy checks the currently serving revision, not the release.
      - name: Canary for this Render service
        id: canary
        if: ${{ !cancelled() && steps.deploy.outputs.health_url != '' }}
        env:
          RENDER_SERVICE_NAME: ${{ matrix.service }}
          RENDER_CANARY_URL: ${{ steps.deploy.outputs.health_url }}
        run: python scripts/ci/render_canary.py

      - name: Report the service release outcome
        if: ${{ !cancelled() }}
        env:
          SERVICE: ${{ matrix.service }}
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          DEPLOY: ${{ steps.deploy.outputs.deploy_status || steps.deploy.outcome }}
          ATTESTATION: ${{ steps.attest.outputs.release_status || steps.attest.outcome }}
          CANARY: ${{ steps.canary.outcome }}
        run: |
          printf '### Render / %s\n\n- Requested SHA: `%s`\n- Deploy: %s (`%s`)\n- Release attestation: %s\n- Health canary: %s\n' \
            "$SERVICE" "$EXPECTED_SHA" "$DEPLOY" "${DEPLOY_ID:-no deploy ID}" "$ATTESTATION" "$CANARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-dispatch emergency rollback on deploy/canary failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          SERVICE: ${{ matrix.service }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # বাংলা মন্তব্য: যদি ক্যানারি বা ডিপ্লয় ফেইল করে, তবে স্বয়ংক্রিয়ভাবে পূর্ববর্তী স্টেবল কমিটে রোলব্যাক ট্রিগার করো
          echo "::error::Post-merge deploy or canary failed for ${SERVICE} on commit ${CURRENT_SHA}!"
          PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_SHA" ]; then
            echo "Auto-dispatching emergency rollback to ${PREV_SHA} for service ${SERVICE}..."
            gh workflow run deploy-rollback.yml \
              -f service="$SERVICE" \
              -f target_sha="$PREV_SHA" \
              -f reason="Automated canary failure rollback for ${SERVICE} on ${CURRENT_SHA}" \
              --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "::warning::Automated rollback dispatch submitted."
          fi

  render-mesh-parity:
    name: "Mesh parity gate — every Render service vs its path-expected SHA"
    needs: [deploy-and-verify, deploy-render-services]
    # Audit F3 (2026-11-25): the deploy matrix above is path-scoped — a commit
    # that changes only one service leaves every sibling on an older release
    # SHA (observed live: api at 98d8cd88 while core/worker/scraper/brain ran
    # 918fee5e; each leg individually "verified", so nothing caught it). This
    # gate runs on EVERY main push and fails closed until all Render services
    # are at the release commit their watch_paths last expected. Set the repo
    # variable MESH_PARITY_FAIL_OPEN=1 during the one-time re-sync to downgrade
    # entries to warnings.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install service registry parser
        run: python -m pip install pyyaml

      - name: Verify mesh-wide release parity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          MESH_PARITY_FAIL_OPEN: ${{ vars.MESH_PARITY_FAIL_OPEN || '' }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_SCRAPER_SERVICE_ID: ${{ vars.RENDER_SCRAPER_SERVICE_ID || vars.RENDER_BROWSER_SERVICE_ID }}
          RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
          RENDER_CORE_SERVICE_ID: ${{ vars.RENDER_CORE_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          RENDER_BRAIN_SERVICE_ID: ${{ vars.RENDER_BRAIN_SERVICE_ID }}
          RENDER_CI_RUNNER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_API_KEY_7: ${{ secrets.RENDER_API_KEY_7 }}
          RENDER_API_PAYKARI: ${{ secrets.RENDER_API_PAYKARI }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_API: ${{ secrets.RENDER_API_KEY_API }}
        run: python scripts/ci/render_mesh_parity.py

  no-render-deploy:
    name: "Check Render target registration"
    needs: deploy-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail on an unregistered release target without blocking registered siblings
        env:
          UNREGISTERED: ${{ needs.deploy-and-verify.outputs.unregistered }}
        run: |
          if [ "$UNREGISTERED" != '[]' ]; then
            echo "::error::Changed Render services are not registered: $UNREGISTERED"
            exit 1
          fi
          echo "All selected Render targets are registered."

  deploy-cloudflare:
    name: "Deploy Cloudflare Edge Mesh (path-filtered)"
    needs: deploy-and-verify
    # "path-filtered" was only true on workflow_dispatch: `inputs.target_service`
    # is ALWAYS EMPTY on a push, so every `contains(inputs...)` was false and
    # this job could never run from main. The edge proxy — the thing serving the
    # Studio — therefore only ever changed when a human dispatched it, while the
    # RETIRED Vercel job below did deploy automatically. That inversion is why
    # the proxy kept pointing at the archived Vercel build long after the origin
    # was changed in the repository.
    # 2026-11-27: every push now enters this job; the "Detect Cloudflare-relevant
    # changes" step does the real `git diff BEFORE..SHA` path filter and skips
    # all deploy steps when nothing under studio/ or infrastructure/cloudflare*
    # changed. The old job-level filter used `join(github.event.commits.*.modified,
    # ' ')` — a list of LISTS, so join() stringified each inner list as "Array"
    # and contains() was ALWAYS false: the keep-warm worker and edge proxy never
    # auto-deployed (every run 2026-11-21..27 shows this job "skipped").
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true && (
          contains(inputs.target_service, 'all') ||
          contains(inputs.target_service, 'cloudflare') ||
          contains(inputs.target_service, 'studio')
        ))
      )
    runs-on: ubuntu-24.04
    # Kept on `production` for its environment-scoped Cloudflare credentials.
    # Main-only (see `if:` above), so this approval can never fire on a PR.
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Detect Cloudflare-relevant changes
        id: cf_changes
        shell: bash
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          DEPLOY_TARGETS: ${{ inputs.target_service }}
        run: |
          set -euo pipefail
          SHOULD_DEPLOY="false"
          KEEPWARM="false"
          PROXY="false"
          # Manual force or explicit cloudflare target always deploys
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && { [ "$FORCE_DEPLOY" = "true" ] || printf '%s\n' "$DEPLOY_TARGETS" | grep -qiE '(^|,)(all|cloudflare|studio)(,|$)'; }; then
            SHOULD_DEPLOY="true"
            KEEPWARM="true"
            PROXY="true"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # Handle missing/zero base (new branch or force push edge)
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED="$(git show --name-only --pretty='' "$HEAD" 2>/dev/null || true)"
            else
              CHANGED="$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)"
            fi
            if echo "$CHANGED" | grep -qE '^(studio/|infrastructure/cloudflare)'; then
              SHOULD_DEPLOY="true"
            fi
            # Per-worker flags: a keep-warm change must not redeploy the edge
            # proxy (and vice versa) now that every push reaches this job.
            if echo "$CHANGED" | grep -qE '^infrastructure/cloudflare-render-keepwarm/'; then
              KEEPWARM="true"
            fi
            if echo "$CHANGED" | grep -qE '^infrastructure/cloudflare-studio-proxy/'; then
              PROXY="true"
            fi
          fi
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "keepwarm=$KEEPWARM" >> "$GITHUB_OUTPUT"
          echo "proxy=$PROXY" >> "$GITHUB_OUTPUT"
          echo "Keep-warm worker deploy: $KEEPWARM · Studio proxy deploy: $PROXY"
          echo "Cloudflare deploy needed: $SHOULD_DEPLOY"

      - name: Setup Node.js
        if: steps.cf_changes.outputs.should_deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Deploy Keep-Warm Worker
        if: steps.cf_changes.outputs.keepwarm == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_COMMIT_SHA: ${{ github.sha }}
          INFISICAL_HOST: https://app.infisical.com
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -d infrastructure/cloudflare-render-keepwarm ]; then
              cd infrastructure/cloudflare-render-keepwarm
              npx wrangler deploy --var CF_COMMIT_SHA:${{ github.sha }}
              # Down-alerts: hand the worker the core service token (from Infisical) as a secret.
              python3 ../../scripts/runtime/infisical_bootstrap.py sh -c 'if [ -n "${SUPREMEAI_API_TOKEN:-}" ]; then printf "%s" "$SUPREMEAI_API_TOKEN" | npx wrangler secret put ALERT_INGEST_TOKEN; else echo "SUPREMEAI_API_TOKEN not in Infisical; keep-warm alerts stay off"; fi' || echo "keep-warm alert token sync skipped"
            else
              echo "keepwarm dir not found; skipping"
            fi
          else
            echo "Cloudflare credentials not configured in secrets; skipping keepwarm worker deploy."
          fi

      - name: Deploy Studio Edge Proxy
        if: steps.cf_changes.outputs.proxy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -d infrastructure/cloudflare-studio-proxy ]; then
              cd infrastructure/cloudflare-studio-proxy
              npx wrangler deploy --var CF_COMMIT_SHA:${{ github.sha }} || echo "Wrangler proxy deploy skipped or non-blocking"
            else
              echo "studio proxy dir not found; skipping"
            fi
          else
            echo "Cloudflare credentials not configured in secrets; skipping proxy deploy."
          fi

      - name: Build & Deploy Studio to Cloudflare Pages
        if: steps.cf_changes.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -d studio ]; then
              cd studio
              npm install --legacy-peer-deps
              npm run build
              npx wrangler pages deploy build --project-name=supremeai-studio --branch=main
              echo "Successfully deployed new studio build to Cloudflare Pages (supremeai-studio.pages.dev)"
            else
              echo "studio dir not found; skipping Pages deploy."
            fi
          else
            echo "Cloudflare credentials not configured in secrets; skipping Pages deploy."
          fi

      - name: Cloudflare deploy skipped (no relevant changes)
        if: steps.cf_changes.outputs.should_deploy != 'true'
        run: echo "No studio/ or infrastructure/cloudflare* changes detected; skipping Cloudflare deploy (0 cloud build mins)."

  deploy-vercel:
    name: "Deploy Vercel Frontend Hook"
    needs: deploy-and-verify
    # Vercel hosting is RETIRED: the Studio is served by the Cloudflare Pages
    # deployment through the edge proxy. This job used to fire automatically on
    # any `studio/`, `frontend/` or `vercel` change — i.e. the retired platform
    # was the one being redeployed, while deploy-cloudflare (the live one) could
    # not run on push at all. Auto-deploy is removed so a retired surface cannot
    # be resurrected by a stray path match; the job stays for an explicit,
    # human-initiated dispatch.
    if: |
      always() && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.force_deploy == true &&
      (
        contains(inputs.target_service, 'all') ||
        contains(inputs.target_service, 'vercel')
      )
    runs-on: ubuntu-24.04
    # Kept on `production` for its environment-scoped Vercel credentials.
    # Main-only (see `if:` above), so this approval can never fire on a PR.
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: Trigger Vercel Deployment Preflight & API Check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            python scripts/ci/vercel_deploy_preflight.py || true
            echo "Vercel deploy preflight checked."
          else
            echo "VERCEL_TOKEN not provided; skipping Vercel trigger."
          fi

  # =========================================================================
  # STAGE 1: SYNTAX & GOVERNANCE GATES (<15s)
  # Consolidated from syntax-gate.yml and governance-guards.yml
  # Enforces planner-lane protection, docs pointer hygiene, python compile check,
  # and workflow + render YAML validation.
  # =========================================================================
  syntax-and-governance-gate:
    name: "Tier 1: Syntax & Governance Checks (<15s)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Planner branches may not land PRs (lesson 2026-09-27)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            planner-*|planner/*)
              echo "::error::'Allowed scope != authority to land': planner lane branches ($HEAD_REF) must not open landing PRs. Route work through the coder lane."
              exit 1
              ;;
            *) echo "Source branch $HEAD_REF is not planner-scoped — OK." ;;
          esac

      - name: Governance docs must not cite unreachable file:// paths
        run: |
          if grep -rn "file:///" docs/ --include="*.md" --include="*.json" >/tmp/hits.txt 2>/dev/null; then
            echo "::error::Governance documents contain file:/// references — audit-undecidable pointers. Use repo-relative or network-verifiable paths."
            cat /tmp/hits.txt | head -20
            exit 1
          fi
          echo "No file:// pointer drift in docs/."

      # AGENTS.md is a GENERATED file (`.github/constitution/rules.yml` is the
      # SSOT). It had been replaced by six lines of hand-written notes — while
      # 50+ docs and guards still cite it as the Single Door — because the drift
      # check the generator header promises was never wired anywhere.
      - name: AGENTS.md must match the constitution SSOT
        run: |
          # The generator parses rules.yml, so it needs PyYAML on the runner;
          # without it the check exits 2 ("PyYAML required") and reads as drift.
          pip install pyyaml --quiet
          python scripts/ci/generate_agents_md.py --check

      - name: Compile-check every deploy-critical Python path
        run: |
          set -e
          python -m compileall -q -f gateway core browser scripts
          echo "All Python deploy paths compile."

      - name: Validate workflow + service YAML
        run: |
          pip install pyyaml --quiet
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          files = list(pathlib.Path('.github/workflows').glob('*.yml')) + list(pathlib.Path('.').glob('render.yaml'))
          for f in files:
              try:
                  yaml.safe_load(f.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f"{f}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(files)} YAML files valid.")
          PY

      - name: Check workflow job names and generated script index
        run: |
          python scripts/ci/workflow_job_name_guard.py --check
          python scripts/ops/generate_script_index.py --check-committed

      - name: Detect runtime dependency changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: runtime-locks
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            dependencies:
              - 'core/requirements.*'
              - 'gateway/requirements.*'
              - '.github/workflows/unified-pipeline.yml'
            browser-lock:
              - 'browser/cloudflare-worker/package*.json'
              - 'browser/cloudflare-worker/src/**'
              - 'browser/cloudflare-worker/test/**'
              - 'browser/cloudflare-worker/wrangler.toml'
              - '.github/workflows/unified-pipeline.yml'

      - name: Verify Python runtime lock coverage (without upgrades)
        if: steps.runtime-locks.outputs.dependencies == 'true'
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.9'
          for service in core gateway; do
            lock="$service/requirements.lock"
            uv pip compile --no-header --no-annotate --python-version 3.12 --universal \
              --constraint "$lock" "$service/requirements.txt" -o "$RUNNER_TEMP/$service.lock"
            diff -u "$lock" "$RUNNER_TEMP/$service.lock"
          done

      - name: Check the real Core routes build inference context
        run: python scripts/ci/check_gateway_context.py

      # ── The guard roster, actually executed ────────────────────────────────
      # `scripts/ci/run_all_guards.py` existed and was documented as "the same
      # list CI runs in Tier 1/2" — but NO workflow invoked it (grep .github/ →
      # 0 hits, 2026-11-20). 56 guards were maintained, documented and never run.
      # Measured runtime for the full roster: ~31 s on 4 vCPU, so the fast lane
      # costs seconds, not minutes.
      - name: Install guard dependencies
        run: |
          pip install --quiet pyyaml pytest pyjwt requests asyncpg
          echo "Roster needs only PyYAML/pytest/pyjwt/requests (measured: 56/56"
          echo "pass in a venv with exactly these four). Nothing heavier, so this"
          echo "step cannot drift into a 5-minute install."

      - name: Architecture + config + wiring guard roster (fast lane)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DATABASE_URL_POOLER: ${{ secrets.SUPABASE_DATABASE_URL_POOLER }}
          MCP_PRODUCTION_URL: ${{ vars.MCP_PRODUCTION_URL }}
          WORKER_PRODUCTION_URL: ${{ vars.WORKER_PRODUCTION_URL }}
          EDGE_WORKER_PRODUCTION_URL: ${{ vars.EDGE_WORKER_PRODUCTION_URL }}
        run: |
          python scripts/ci/run_all_guards.py --fast
          printf '%s\n' '### Watchdog self-test diagnostics (simulated)' \
            '- Self-heal fixture: 1 of 400 subjects expanded to 400.' \
            '- Failure fixture: deepening unavailable; census may under-report.' \
            'These are fixtures; real watchdog warnings remain Actions annotations.' >> "$GITHUB_STEP_SUMMARY"

      - name: Detect Tower contract changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: tower
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            contracts:
              - 'infrastructure/mcp-control-plane/**'
              - '.github/workflows/unified-pipeline.yml'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.tower.outputs.contracts == 'true' || steps.runtime-locks.outputs.browser-lock == 'true'
        with:
          node-version: 24

      - name: Verify the Browser worker npm lock
        if: steps.runtime-locks.outputs.browser-lock == 'true'
        working-directory: browser/cloudflare-worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/worker.test.js

      - name: Build and verify Tower tool contracts (offline)
        if: steps.tower.outputs.contracts == 'true'
        working-directory: infrastructure/mcp-control-plane
        run: |
          npm ci
          npm run build
          npm run test:annotations-floor
          npm run test:tool-visibility
          npm run test:access
          npm run test:entry-governance
          npm run test:render-logs
          # বাংলা মন্তব্য: repo allowlist + branch guard + HITL গেট ভাঙলে এখানেই ধরা পড়বে।
          # আগে এই টেস্ট ফাইল ছিল কিন্তু CI-তে কখনো চলত না — তাই গার্ড ভাঙলেও সবুজ দেখাত।
          npm run test:github-guards

  # =========================================================================
  # Golden-Eval Regression Gate (archive workorder bridge-20261028-golden-eval-gate,
  # issue #1362 item 3). Ported verbatim from the workorder's pipeline.yml patch —
  # this repo's release entrypoint is unified-pipeline.yml.
  # =========================================================================
  golden-eval-harness:
    name: "G-GoldenEval harness — scorer self-test + fixture mechanics (#1362)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Scorer self-test (must stay deterministic)
        run: python evals/golden/run_eval.py --self-test
      - name: Fixture mechanics run (calibration subset, honest coverage label)
        run: python evals/golden/run_eval.py

  golden-eval-gate:
    name: "G-GoldenEval — 90% quality regression gate (#1362)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [golden-eval-harness]
    steps:
      # Candidate fixture mechanics run in the separate unprivileged job.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Live golden eval (90% threshold, fail-closed)
        env:
          SUPREME_EVAL_ENDPOINT: ${{ secrets.SUPREME_EVAL_ENDPOINT }}
          SUPREME_EVAL_TOKEN: ${{ secrets.SUPREME_EVAL_TOKEN }}
        run: |
          if [ -z "$SUPREME_EVAL_ENDPOINT" ]; then
            echo "SUPREME_EVAL_ENDPOINT is not configured — skipping live golden eval gate."
            exit 0
          fi
          python evals/golden/run_eval.py --provider http --min-accuracy 0.90

  sync-deployment-config-check:
    name: Sync deployment config check (SSOT drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check sync_deployment_config drift
        run: python scripts/ci/sync_deployment_config.py --check

  sync-public-endpoints:
    name: Sync public endpoints to supremeai-public (Auto-PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sync-deployment-config-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Sync canonical endpoints to supremeai-public
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.ORGANIZATION_SYNC_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Supremeai-bd/supremeai-public.git" ../supremeai-public
          python scripts/ci/sync_to_public_repo.py --target-dir ../supremeai-public --apply --create-pr

  sync-cross-repo-patches:
    name: Sync cross-repo patches to supremeai-public (Auto-PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply patches to supremeai-public
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.ORGANIZATION_SYNC_TOKEN }}
        run: |
          # বাংলা মন্তব্য: শুধুমাত্র .patches/public ডিরেক্টরিতে .patch/.diff ফাইল থাকলেই এক্সিকিউট হবে
          PATCH_COUNT=$(find .patches/public -maxdepth 1 -name '*.patch' -o -name '*.diff' 2>/dev/null | wc -l)
          if [ "$PATCH_COUNT" -gt 0 ]; then
            echo "Found $PATCH_COUNT patch file(s) in .patches/public. Syncing to supremeai-public..."
            git clone "https://x-access-token:${GH_TOKEN}@github.com/Supremeai-bd/supremeai-public.git" ../supremeai-public
            python scripts/ci/apply_cross_repo_patch.py \
              --patch-dir .patches/public \
              --target-dir ../supremeai-public \
              --target-repo Supremeai-bd/supremeai-public \
              --source-repo Supremeai-bd/supremeai \
              --apply --create-pr
          else
            echo "::notice title=Cross-Repo Sync::No cross-repo patches (*.patch, *.diff) in .patches/public; clean state."
          fi

  regenerate-architecture-gap-baseline:
    name: Regenerate architecture gap baseline (auto-commit)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Idempotent PyYAML install — the guardian fails loud (RuntimeError) without
      # it (by design: it refuses to emit a partial graph). Pattern matches the
      # other yaml-dependent lanes in this workflow.
      - name: Install PyYAML
        run: python3 -c 'import yaml' || python3 -m pip install 'PyYAML==6.0.3'
      - name: Regenerate gap baseline and AST graph
        run: |
          python scripts/ci/architecture_gap_guardian.py
          python scripts/ci/sync_graph_to_memory.py || echo "AST graph sync completed with fallback"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/generated/architecture_gap_map.json docs/generated/architecture_gap_map.mmd README.md
          if git diff --cached --quiet; then
            echo "No changes to baseline."
            exit 0
          fi
          git commit -m "chore(ci): auto-regenerate architecture gap baseline [skip ci]"
          git push

  auto-update-open-prs:
    name: Auto-Update Open PRs on Main Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update open PR branches with latest main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[].number'); do
            gh pr update-branch "$pr" --repo "$GITHUB_REPOSITORY" || true
          done

  sync-collective-ai-knowledge:
    name: "🧠 Collective AI Knowledge Exchange (PR & Cross-AI Sync)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.ai_knowledge_json != '' || inputs.ai_knowledge_issue != ''))
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate legacy shared knowledge (no storage)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCH_SHARE_JSON: ${{ inputs.ai_knowledge_json }}
          DISPATCH_SCAN_ISSUE: ${{ inputs.ai_knowledge_issue }}
        run: |
          echo "Legacy knowledge validation only: nothing is stored, reviewed, or approved." >> "$GITHUB_STEP_SUMMARY"
          HEAD_SUBJECT=$(git log -1 --pretty=%s)
          PR_NUM=$(printf '%s' "$HEAD_SUBJECT" | sed -nE 's/.*\(#([0-9]+)\).*/\1/p' | head -n1)
          if [ -n "$PR_NUM" ]; then
            python3 scripts/ci/ingest_pr_knowledge.py --pr-num "$PR_NUM" --dry-run
          fi
          if [ -n "$DISPATCH_SHARE_JSON" ]; then
            python3 scripts/ci/ai_knowledge_exchange.py --share-json "$DISPATCH_SHARE_JSON" --dry-run
          fi
          if [ -n "$DISPATCH_SCAN_ISSUE" ]; then
            python3 scripts/ci/ai_knowledge_exchange.py --scan-issue "$DISPATCH_SCAN_ISSUE" --repo "$GH_REPO" --dry-run
          fi
