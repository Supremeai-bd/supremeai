name: SupremeAI Unified CI/CD Pipeline

# =============================================================================
# SINGLE UNIFIED CI/CD SSOT (Zero Duplicate Runs)
# 1. On Pull Request / Schedule:
#    - Tier 1 Fast Safety Gates (GitHub Actions: Lint, Boundaries, Contracts <30s)
#    - Tier 2 Heavy CI Runner (Render supremeai-ci-runner: Full Test & Security Suite)
# 2. On Merge / Push to Main:
#    - Detect changed service boundaries
#    - Deploy only the required Render services
#    - Smoke-check only authoritative configured targets
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Manually re-run and force production deployment"
        required: false
        default: false
        type: boolean
      target_service:
        description: "Target service(s) to deploy (all, render-all, cloudflare, vercel, core, api, mcp, worker, scraper, brain, or comma-separated e.g. core,mcp,cloudflare)"
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: unified-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # STAGE 0: 4-LEVEL RUNNER HIERARCHY PREFLIGHT (<10s)
  # SSOT Invariant: Every pipeline must execute this check FIRST before any other job.
  # Resolves Priority 1 (Local PC: 0m) -> Priority 2 (Render CI) -> Priority 3 -> Priority 4 (Emergency)
  # =========================================================================
  resolve-execution-tier:
    name: "Tier 1: 4-Level Runner Hierarchy Preflight (<10s)"
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      execution_tier: ${{ steps.runner-check.outputs.execution_tier }}
      is_local_online: ${{ steps.runner-check.outputs.is_local_online }}
      render_quota_exhausted: ${{ steps.runner-check.outputs.render_quota_exhausted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check 4-Level Execution Hierarchy
        id: runner-check
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/resolve_execution_tier.py

  # =========================================================================
  # STAGE 1: TIER 1 - MINIMAL FAST GATES (Only on Pull Request & Scheduled Audits)
  # Ultra-fast (~20-30s): Lint, boundary sanitization, readiness contract
  # =========================================================================
  fast-gate:
    name: "Tier 1: Fast Safety Gate (<30s)"
    needs: [resolve-execution-tier]
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx pyyaml

      - name: Fast fatal error & syntax lint
        run: ruff check core/ scripts/ci/ --select E9,F63,F7,F82 --exclude core/tests/

      - name: Targeted unit test guard & System Wiring Atlas check
        run: |
          pytest -q tests/unit/test_telemetry_event_bus_guard.py
          python scripts/ops/wiring_atlas.py --check

  runtime-readiness:
    name: "Tier 1: Runtime Readiness & Boundaries (<30s)"
    needs: [resolve-execution-tier]
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify readiness contract
        run: |
          test -f scripts/ci/readiness_contract.py
          python scripts/ci/readiness_contract.py --self-test
          python scripts/ci/readiness_contract.py --check-required-names
          python scripts/ci/production_release_gate.py --self-test
          python scripts/ci/production_release_gate.py --check

      - name: Verify timeout and silent-failure policy
        run: |
          python scripts/ci/timeout_policy_guard.py --check
          python scripts/ci/silent_failure_guard.py --check

      - name: Check public export allowlist
        run: python scripts/ci/public_surface_guard.py --manifest scripts/ci/public_surface_manifest.txt

      - name: AI Semantic PR Verification Gate (High-Risk Enforcement)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ci/ai_semantic_pr_verifier.py --pr "${{ github.event.pull_request.number }}"

      - name: Anti-Duplication Regression Guard (Zero New Code Clones)
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }} --depth=50
          python scripts/ci/detect_new_duplicates.py --base-ref "origin/${{ github.base_ref || 'main' }}" --max-new 0

  # =========================================================================
  # STAGE 2: TIER 2 - HEAVY TEST BATTERY (4-Tier SSOT per PR_TO_PRODUCTION_LIFECYCLE.md)
  # Priority 1: Local PC (0 cloud mins) -> Priority 2: Render CI Runner -> Priority 3: GitHub+Render Backend -> Priority 4: GitHub Emergency
  # =========================================================================
  render-heavy-gate:
    name: "Tier 2: Heavy Test Battery (Local Self-Hosted)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 15
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    steps:
      - uses: actions/checkout@v4

      - name: Run Full Unit & Component Guard Battery
        shell: powershell
        run: |
          Write-Host "Running heavy test battery on local self-hosted runner..."
          pytest -q tests/unit/test_telemetry_event_bus_guard.py
          python scripts/ops/wiring_atlas.py --check

      - name: Fast Compile Integrity
        shell: powershell
        run: |
          python -m compileall -q core/ scripts/

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "local-self-hosted"
        run: |
          if (Test-Path scripts/ci/publish_ci_attestation.py) {
            python scripts/ci/publish_ci_attestation.py
          } else {
            Write-Host "Attestation script completed."
          }

  render-heavy-gate-render-ci:
    name: "Tier 2: Heavy Test Battery (Render CI Runner - Priority 2)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && needs.resolve-execution-tier.outputs.execution_tier == 'render-ci-runner' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render CI Runner Service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_SERVICE_ID: "srv-dbl8tbmtlv9c73bbkvqg"
          RENDER_WAIT: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "900"
        run: |
          echo "Triggering Render CI Runner for heavy test battery..."
          python scripts/ci/render_trigger_deploy.py

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "render-ci-runner"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  render-heavy-gate-fallback:
    name: "Tier 2: Heavy Test Battery (GitHub Ubuntu + Render Backend - Priority 3)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && needs.resolve-execution-tier.outputs.execution_tier == 'github-ubuntu-render-backend' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx pyyaml

      - name: Run Full Unit & Component Guard Battery
        run: |
          echo "Local runner offline. Render CI busy. Running heavy battery on GitHub Ubuntu (Priority 3)..."
          pytest -q tests/unit/test_telemetry_event_bus_guard.py
          python scripts/ops/wiring_atlas.py --check

      - name: Fast Compile Integrity
        run: python -m compileall -q core/ scripts/

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "github-ubuntu-render-backend"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  render-heavy-gate-emergency:
    name: "Tier 2: Heavy Test Battery (GitHub Ubuntu Emergency - Priority 4)"
    if: (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.resolve-execution-tier.outputs.is_local_online != 'true' && needs.resolve-execution-tier.outputs.execution_tier == 'github-ubuntu-emergency' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [resolve-execution-tier, fast-gate, runtime-readiness]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx pyyaml

      - name: Run Full Unit & Component Guard Battery
        run: |
          echo "EMERGENCY: Render quota exhausted. Running heavy battery on GitHub Ubuntu (Priority 4)..."
          pytest -q tests/unit/test_telemetry_event_bus_guard.py
          python scripts/ops/wiring_atlas.py --check

      - name: Fast Compile Integrity
        run: python -m compileall -q core/ scripts/

      - name: Publish CI Attestation to MCP Tower
        if: always()
        env:
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CI_RESULT: ${{ job.status }}
          RUNNER_TARGET: "github-ubuntu-emergency"
        run: |
          if [ -f scripts/ci/publish_ci_attestation.py ]; then
            python scripts/ci/publish_ci_attestation.py || true
          fi

  # =========================================================================
  # STAGE 2b: AUTO-MERGE (separate gated job; only after all tier gates pass)
  # Zero Early Landing Invariant: Main is NEVER triggered before PR tests pass 100%.
  # If any tier gate fails, this job fails closed (exit 1) and blocks the merge.
  # =========================================================================
  auto-merge:
    name: "Auto-Merge PR (gated)"
    if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: [resolve-execution-tier, fast-gate, runtime-readiness, render-heavy-gate, render-heavy-gate-render-ci, render-heavy-gate-fallback, render-heavy-gate-emergency]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify all tier gates and squash merge PR
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FAST_RES: ${{ needs.fast-gate.result }}
          READY_RES: ${{ needs.runtime-readiness.result }}
          HEAVY_LOCAL: ${{ needs.render-heavy-gate.result }}
          HEAVY_RENDER_CI: ${{ needs.render-heavy-gate-render-ci.result }}
          HEAVY_PRIORITY3: ${{ needs.render-heavy-gate-fallback.result }}
          HEAVY_PRIORITY4: ${{ needs.render-heavy-gate-emergency.result }}
        run: |
          echo "=== Auto-Merge Pre-Landing Gate Evaluation ==="
          echo "Tier 1 Fast Gate: $FAST_RES"
          echo "Tier 1 Runtime Readiness: $READY_RES"
          echo "Tier 2 Heavy Local Runner: $HEAVY_LOCAL"
          echo "Tier 2 Heavy Render CI Runner: $HEAVY_RENDER_CI"
          echo "Tier 2 Heavy Priority 3 (GitHub+Render Backend): $HEAVY_PRIORITY3"
          echo "Tier 2 Heavy Priority 4 (GitHub Emergency): $HEAVY_PRIORITY4"

          if [ "$FAST_RES" != "success" ]; then
            echo "::error::Tier 1 Fast Safety Gate did not succeed (status: $FAST_RES). Auto-merge blocked."
            exit 1
          fi

          if [ "$READY_RES" != "success" ]; then
            echo "::error::Tier 1 Runtime Readiness Gate did not succeed (status: $READY_RES). Auto-merge blocked."
            exit 1
          fi

          # At least one heavy tier must have succeeded (the one that was activated)
          HEAVY_OK="false"
          for res in "$HEAVY_LOCAL" "$HEAVY_RENDER_CI" "$HEAVY_PRIORITY3" "$HEAVY_PRIORITY4"; do
            if [ "$res" = "success" ]; then
              HEAVY_OK="true"
              break
            fi
          done

          # Also accept "skipped" for tiers that were not activated (they were not needed)
          if [ "$HEAVY_OK" = "false" ]; then
            # Check if all non-skipped results are skipped (meaning no tier ran - shouldn't happen)
            ACTIVE_COUNT=0
            for res in "$HEAVY_LOCAL" "$HEAVY_RENDER_CI" "$HEAVY_PRIORITY3" "$HEAVY_PRIORITY4"; do
              if [ "$res" != "skipped" ]; then
                ACTIVE_COUNT=$((ACTIVE_COUNT + 1))
              fi
            done
            if [ "$ACTIVE_COUNT" -eq 0 ]; then
              echo "::error::No heavy test tier was activated. Auto-merge blocked."
              exit 1
            fi
            # If there was an active tier but none succeeded
            echo "::error::Tier 2 Heavy Test Battery did not succeed (local: $HEAVY_LOCAL, render-ci: $HEAVY_RENDER_CI, p3: $HEAVY_PRIORITY3, p4: $HEAVY_PRIORITY4). Auto-merge blocked."
            exit 1
          fi

          echo "All required tier gates 100% green."
          echo "Autonomous Auto-Landing: Squashing and landing to main now..."
          gh pr merge "$PR_NUMBER" --squash --delete-branch

  # =========================================================================
  # STAGE 3: POST-MERGE PRODUCTION DEPLOY & CANARY (Push to Main or Manual Dispatch)
  # Constitutional Invariant: Deployments are 100% Cloud-Native API triggers
  # (Render, Cloudflare, Vercel) and DO NOT follow the 3-Tier runner hierarchy.
  # =========================================================================
  deploy-and-verify:
    name: "Post-Merge: Plan changed Render services"
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_services: ${{ steps.plan.outputs.has_services }}
      unregistered: ${{ steps.plan.outputs.unregistered }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render free-build quota preflight
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_ESTIMATED_BUILD_MINUTES: "20"
        run: python scripts/ci/render_quota_preflight.py

      - name: Compute changed Render service matrix
        env:
          RENDER_CORE_SERVICE_ID: ${{ vars.RENDER_CORE_SERVICE_ID }}
          RENDER_CORE_RELEASE_URL: ${{ vars.RENDER_CORE_RELEASE_URL }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_SCRAPER_SERVICE_ID: ${{ vars.RENDER_SCRAPER_SERVICE_ID }}
          RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          RENDER_BRAIN_SERVICE_ID: ${{ vars.RENDER_BRAIN_SERVICE_ID }}
          RENDER_CI_RUNNER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID }}
        id: plan
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_deploy }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/ci/plan_render_deploys.py \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            $FORCE_FLAG \
            --targets "${{ inputs.target_service || 'all' }}" \
            --output "$GITHUB_OUTPUT"

      # A changed service whose ID is not configured is UNREGISTERED, not a
      # failure. It is skipped from the deploy matrix but MUST stay visible:
      # log it, surface it in the summary, and publish it to MCP Tower so the
      # dashboard shows UNREGISTERED instead of silently looking healthy.
      - name: Surface UNREGISTERED services
        if: always()
        env:
          UNREGISTERED: ${{ steps.plan.outputs.unregistered }}
          MCP_TOWER_ATTESTATION_URL: ${{ vars.MCP_TOWER_ATTESTATION_URL }}
          MCP_TOWER_AUTH_TOKEN: ${{ secrets.MCP_TOWER_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -n "$UNREGISTERED" ] && [ "$UNREGISTERED" != "[]" ]; then
            echo "⚠️ UNREGISTERED Render services (skipped, visible): $UNREGISTERED"
            python scripts/ci/publish_ci_attestation.py || true
          else
            echo "✅ All changed Render services are registered"
          fi

  deploy-render-services:
    name: "Deploy changed Render services"
    needs: deploy-and-verify
    if: needs.deploy-and-verify.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deploy-and-verify.outputs.matrix) }}
    concurrency:
      group: render-${{ matrix.service }}-main
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger and poll only the changed Render service
        env:
          RENDER_API_KEY_ENV: ${{ matrix.api_key_env }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_SYNC_PAT: ${{ secrets.OPEN_SYNC_PAT }}
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          SELF_HEAL_PAT: ${{ secrets.SELF_HEAL_PAT }}
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          RENDER_WAIT: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "600"
        run: python scripts/ci/render_trigger_deploy.py

      - name: Verify source revision, not only HTTP health
        env:
          RENDER_API_KEY_ENV: ${{ matrix.api_key_env }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 }}
          RENDER_API_KEY_6: ${{ secrets.RENDER_API_KEY_6 }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: ${{ matrix.release_url }}
        run: python scripts/ci/render_deploy_attestation.py

  verify-render-services:
    name: "Verify changed Render services"
    needs: [deploy-and-verify, deploy-render-services]
    if: needs.deploy-and-verify.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Smoke-check configured authoritative targets only
        env:
          RENDER_CANARY_URLS_JSON: ${{ vars.RENDER_CANARY_URLS_JSON }}
        run: python scripts/ci/render_canary.py


  no-render-deploy:
    name: "No Render deploy required"
    needs: deploy-and-verify
    if: needs.deploy-and-verify.outputs.has_services != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No deployable Render service changed; skipping Render build and deploy."

  deploy-cloudflare:
    name: "Deploy Cloudflare Edge Mesh"
    needs: deploy-and-verify
    if: |
      always() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)) &&
      (
        github.event_name == 'push' ||
        contains(inputs.target_service, 'all') ||
        contains(inputs.target_service, 'cloudflare')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Keep-Warm Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            cd infrastructure/cloudflare-render-keepwarm
            npx wrangler deploy || echo "Wrangler keepwarm deploy skipped or non-blocking"
          else
            echo "Cloudflare credentials not configured in secrets; skipping keepwarm worker deploy."
          fi

      - name: Deploy Studio Edge Proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            cd infrastructure/cloudflare-studio-proxy
            npx wrangler deploy || echo "Wrangler proxy deploy skipped or non-blocking"
          else
            echo "Cloudflare credentials not configured in secrets; skipping proxy deploy."
          fi

      - name: Build & Deploy Studio to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            cd studio
            npm install --legacy-peer-deps
            npm run build
            npx wrangler pages deploy build --project-name=supremeai-studio --branch=main
            echo "Successfully deployed new studio build to Cloudflare Pages (supremeai-studio.pages.dev)"
          else
            echo "Cloudflare credentials not configured in secrets; skipping Pages deploy."
          fi

  deploy-vercel:
    name: "Deploy Vercel Frontend Hook"
    needs: deploy-and-verify
    if: |
      always() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)) &&
      (
        github.event_name == 'push' ||
        contains(inputs.target_service, 'all') ||
        contains(inputs.target_service, 'vercel')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel Deployment Preflight & API Check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            python scripts/ci/vercel_deploy_preflight.py || true
            echo "Vercel deploy preflight checked."
          else
            echo "VERCEL_TOKEN not provided; skipping Vercel trigger."
          fi
