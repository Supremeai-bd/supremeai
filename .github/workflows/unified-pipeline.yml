name: SupremeAI Unified CI/CD Pipeline

# =============================================================================
# SINGLE UNIFIED CI/CD SSOT (Zero Duplicate Runs)
# 1. On Pull Request / Schedule:
#    - Tier 1 Fast Safety Gates (GitHub Actions: Lint, Boundaries, Contracts <30s)
#    - Tier 2 Heavy CI Runner (Render supremeai-ci-runner: Full Test & Security Suite)
# 2. On Merge / Push to Main:
#    - Deploy Render Core & Live 5-Node Canary Smoke Check
# =============================================================================

on:
  pull_request:
    paths:
      - "core/**"
      - "gateway/**"
      - "browser/**"
      - "studio/**"
      - "vscode/**"
      - "infrastructure/**"
      - "scripts/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "render.yaml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "gateway/**"
      - "browser/**"
      - "studio/**"
      - "vscode/**"
      - "infrastructure/**"
      - "scripts/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "render.yaml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: unified-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # STAGE 1: TIER 1 - MINIMAL FAST GATES (Only on Pull Request & Scheduled Audits)
  # Ultra-fast (~20-30s): Lint, boundary sanitization, readiness contract
  # =========================================================================
  fast-gate:
    name: "Tier 1: Fast Safety Gate (<30s)"
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx

      - name: Fast fatal error & syntax lint
        run: ruff check core/ scripts/ci/ --select E9,F63,F7,F82 --exclude core/tests/

      - name: Targeted unit test guard
        run: pytest -q tests/unit/test_telemetry_event_bus_guard.py

  runtime-readiness:
    name: "Tier 1: Runtime Readiness & Boundaries (<30s)"
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify readiness contract
        run: |
          test -f scripts/ci/readiness_contract.py
          python scripts/ci/readiness_contract.py --self-test
          python scripts/ci/readiness_contract.py --check-required-names

      - name: Verify timeout and silent-failure policy
        run: |
          python scripts/ci/timeout_policy_guard.py --check
          python scripts/ci/silent_failure_guard.py --check

      - name: Check public export allowlist
        run: python scripts/ci/public_surface_guard.py --manifest scripts/ci/public_surface_manifest.txt

  # =========================================================================
  # STAGE 2: TIER 2 - RENDER REMOTE HEAVY GATE (PR & Nightly Schedule)
  # Offloads heavy test battery, DB migrations, compileall, SAST to Render
  # =========================================================================
  render-heavy-gate:
    name: "Tier 2: Render Remote Heavy Suite"
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [fast-gate, runtime-readiness]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trigger & Poll Render supremeai-ci-runner
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_SVC_ID: "srv-dbl8tbmtlv9c73bbkvqg"
          RENDER_WAIT: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "600"
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SVC_ID" ]; then
            python scripts/ci/render_trigger_deploy.py
          else
            echo "::warning::RENDER_API_KEY_PAYKARI not available in context - skipping remote trigger"
          fi

      - name: Autonomous Auto-Landing on Green CI (Squash Merge)
        if: github.event_name == 'pull_request' && success()
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "🚀 Tier 1 and Tier 2 Render CI verification fully passed for PR #${PR_NUMBER}!"
          echo "🛬 Autonomous Auto-Landing: Squashing and merging PR into main..."
          gh pr merge "$PR_NUMBER" --squash --delete-branch || echo "::warning::Auto-merge failed or branch already merged."

  # =========================================================================
  # STAGE 3: POST-MERGE PRODUCTION DEPLOY & CANARY (Only on Push to Main)
  # =========================================================================
  deploy-and-verify:
    name: "Post-Merge: Render Deploy & Canary Health"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Render is configured with autoDeploy=commit on main. Do not call the
      # Render deploy API here: that would create a second build for this push.

      - name: Wait for services to stabilize
        run: sleep 10

      - name: Post-Deploy Smoke Canary (5 Render Nodes)
        run: |
          python -c "
          import urllib.request, ssl, sys, time

          ctx = ssl.create_default_context()
          targets = [
              ('API Gateway', 'https://supremeai-api-ulw0.onrender.com/healthz'),
              ('Primary Node', 'https://supremeai-primary-node-5xso.onrender.com/health/ready'),
              ('MCP Control Tower', 'https://supremeai-mcp-tower.onrender.com/health'),
              ('Scraper Node', 'https://supremeai-scraper-node.onrender.com/health'),
              ('Worker Node', 'https://supremeai-worker-node.onrender.com/health'),
          ]

          failed = []
          for name, url in targets:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'SupremeAI-Canary/1.0'})
                  with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
                      body = r.read(4096).decode('utf-8', errors='replace')
                      if r.status != 200:
                          raise RuntimeError(f'HTTP {r.status}: {body[:200]}')
                      if name == 'Primary Node' and 'ready' not in body:
                          raise RuntimeError(f'Primary Node status not ready: {body[:200]}')
                      print(f'✅ {name}: HTTP {r.status}')
              except Exception as e:
                  print(f'⚠️ {name} probe warning ({e})')
                  failed.append(name)

          if any(core in failed for core in ['API Gateway', 'Primary Node']):
              print(f'❌ Canary failed: Core node down: {failed}')
              sys.exit(1)

          if len(failed) > 2:
              print(f'❌ Canary failed: Multiple nodes down: {failed}')
              sys.exit(1)
          print('🎉 Production Canary Verified Successfully!')
          "
