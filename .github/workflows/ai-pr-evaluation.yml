# =============================================================================
# AI PR Evaluator (#2935, seq:1) — 2-Criteria Decision Engine (Merge/Hold/Close)
# =============================================================================
# বাংলা মন্তব্য: #2930-এর Instant Auto-Merge ডকট্রিনের ইঞ্জিন। প্রতিটি open PR-কে
# 2-ক্রাইটেরিয়া (Value + Safety) দিয়ে মূল্যায়ন করে রায় দেয়:
#   AUTO_MERGE (দুটোই ✅) · HOLD_AND_FIX (ভ্যালু ✅, সেফটি ❌ — কারণসহ per-PR
#   fix-issue, group:pipeline-failures) · CLOSE (ভ্যালু-প্রমাণ অপর্যাপ্ত)।
#
# ডিজাইন-সিদ্ধান্ত:
#   ১) নিরাপত্তা: স্ক্রিপ্ট main থেকেই চলে (ref: main) — মূল্যায়নকারী কখনোই
#      মূল্যায়িত PR-এর কোড হতে পারবে না (verdict-integrity; ক্ষতিকারক PR নিজের
#      রায় নিজে লিখতে পারবে না)। মূল্যায়ন সম্পূর্ণ API-ভিত্তিক (compare/status)।
#   ২) ডায়নামিজম: কোনো pipeline-নাম হার্ডকোড নেই — statusCheckRollup-এর সব
#      চেক + compare-API freshness স্বয়ংক্রিয়; নতুন pipeline যোগ হলে এই
#      workflow-এ কিছু বদলাতে হয় না (অ্যাডমিন-নির্দেশ #2935)।
#   ৩) এক্সিকিউশন-লুপ (সরাসরি merge/close) = seq:2-এর সুযোগ — এখানে শুধু
#      রায় + hold-issue নিবন্ধন (atomic slice)।
#
# ট্রিগার-নীতি: PR-জীবনচক্রে তাৎক্ষণিক (opened/synchronize/reopened/ready) +
# ২০-মিনিট পর্যায়ক্রমে পুনঃমূল্যায়ন (main এগিয়ে গেলে রায় বদলায় — stale PR
# HOLD-এ যাবে, সারিয়ে AUTO_MERGE-এ ফিরবে)।
# =============================================================================

name: "AI PR Evaluator (2-Criteria Auto-Merge)"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # COST OPTIMIZATION: schedule trigger REMOVED entirely.
  # বাংলা: hourly cron প্রতি দিন ২৪টি schedule run তৈরি করত — বেশিরভাগ PR ইতিমধ্যে
  # evaluated থাকত। PR state change = synchronize event real-time trigger করে।
  # Stuck PR recovery: ops-console.yml এর "reevaluate" action দিয়ে manual trigger
  # করা যায়। সাশ্রয়: ২৪ runs/day × ১৬ min = ৩৮৪ min/day = ১১,৫২০ min/month।
  # (founder directive: stuck PR ২৪ ঘন্টা পরে nightlie audit এ ধরা পড়ে)
  workflow_dispatch:
    inputs:
      pr_number:
        description: "নির্দিষ্ট PR মূল্যায়ন (খালি হলে সব open PR)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  # #4291: repo went PRIVATE — SELF_HEAL_PAT (fine-grained) lacks checks:read →
  # GraphQL statusCheckRollup 403'd → evaluator crash → merge gate held ALL PRs.
  # Evaluator now degrades to REST check-runs via github.token; that fallback
  # needs checks: read (least-privilege, read-only).
  checks: read

concurrency:
  group: ai-pr-eval-${{ github.event.pull_request.number || inputs.pr_number || 'scan' }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: "🤖 2-Criteria Evaluation (Merge/Hold/Close)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # বাংলা মন্তব্য: ইচ্ছাকৃতভাবে main-ref checkout — evaluator নিজে মূল্যায়িত
      # PR-এর কোড হতে পারবে না (নিরাপত্তা-চুক্তি; PR-side tamper-proof রায়)।
      - name: Checkout (main — verdict-integrity)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # #3478 fix: Fetch AI provider keys from Infisical vault.
      # বাংলা: repo-secrets-এ AI keys কখনো set হয়নি — শুধু Infisical vault-এ আছে।
      # এই step vault-থেকে keys fetch করে GITHUB_ENV-এ inject করে।
      # Fail-open: vault unreachable হলে evaluator deterministic-এ fallback করে।
      - name: Fetch AI keys from Infisical vault (#3478)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          python scripts/security/fetch_ai_keys.py >> $GITHUB_ENV || true

      - name: Evaluate PR(s) — verdict + hold-issue (reasons included)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          # #4291: REST check-runs fallback token — github.token HAS checks:read
          # (permissions block above); used only when the PAT 403s on rollup.
          GH_FALLBACK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
          # বাংলা (#3229): AI provider keys — LLM semantic enrichment chain-কে
          # llm-unavailable fallback থেকে বের করতে। না থাকলে deterministic-evidence।
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # বাংলা মন্তব্য: bootstrap-টলারেন্স — evaluator স্ক্রিপ্ট main-এ এখনো
          # নেই (এই workflow-সহ যে PR-এ সে জন্মাচ্ছে) হলে লাল নয়, সৎ-স্কিপ;
          # merge-এর পর থেকেই পূর্ণ মূল্যায়ন চলবে।
          if [ ! -f scripts/ci/ai_pr_evaluator.py ]; then
            echo "bootstrap: ai_pr_evaluator.py main-এ নেই এখনো — এই PR-এর merge-এর পর থেকে পূর্ণ মূল্যায়ন সক্রিয় হবে।"
            exit 0
          fi
          # বাংলা মন্তব্য: বুককিপিং-জব — রায় যা-ই হোক, নিবন্ধন-সফলতা = exit 0
          # (রায়-নির্দিষ্ট exit-code দরকার হলে --strict-exit, টেস্টে ব্যবহৃত)।
          TARGET="${EVENT_PR:-$INPUT_PR}"
          if [ -n "$TARGET" ]; then
            echo "🤖 Evaluating PR #$TARGET (2-criteria: Value + Safety)"
            python scripts/ci/ai_pr_evaluator.py --pr "$TARGET" --apply
          else
            echo "🤖 Evaluating all open PRs (re-scan — verdicts refresh as main moves)"
            python scripts/ci/ai_pr_evaluator.py --scan --apply
          fi

  # ─────────────────── Landing authority moved to Merge Gate ───────────────────
  # বাংলা মন্তব্য (Merge Gate Convergence): এই workflow আর সরাসরি merge করে না।
  # পুরনো instant-merge job-এ `gh pr merge --admin` ছিল — আর branch protection-এ
  # enforce_admins=false থাকায় admin-flag মানেই সব required-check bypass
  # (mergeStateStatus 'unstable' গ্রহণ = non-required লাল চেক থাকলেও merge)।
  # এখন এই evaluator = শুধু প্রমাণ-উৎপাদক (verdict + hold-issue) — রায় খাওয়া হয়
  # .github/workflows/merge-gate.yml (Single Landing Path — RULE 6):
  #   PR Gate = প্রমাণ · Merge Gate = সিদ্ধান্ত · Main = প্রমাণিত সিস্টেম।
  # Admin bypass কেবল explicit human emergency operation-এর জন্য (কখনো automation নয়)।
