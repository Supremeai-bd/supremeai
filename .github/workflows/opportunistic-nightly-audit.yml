name: "Nightly Ops: Opportunistic 24h+ Audit"

on:
  schedule:
    # Lightweight check every 2 hours: evaluates 24h elapsed + SSOT runner hierarchy.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force audit run immediately regardless of 24h timer"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: opportunistic-nightly-audit
  cancel-in-progress: false

jobs:
  resolve-execution-tier:
    name: "Tier 1: 4-Level Runner Hierarchy Preflight (<10s)"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      execution_tier: ${{ steps.runner-check.outputs.execution_tier }}
      is_local_online: ${{ steps.runner-check.outputs.is_local_online }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check 4-Level Execution Hierarchy (SSOT)
        id: runner-check
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RENDER_API_KEY_PAYKARI: ${{ secrets.RENDER_API_KEY_PAYKARI }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_CI_RUNNER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID || 'srv-dbl8tbmtlv9c73bbkvqg' }}
        run: python scripts/ci/resolve_execution_tier.py

  evaluate-audit-timing:
    name: "Evaluate 24h+ Opportunistic Audit Window"
    needs: [resolve-execution-tier]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Check 24h Timer
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "Force run requested. Dispatching audit."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/ci/check_opportunistic_audit.py --timing-only
          fi

  execute-audit-local:
    name: "Run Opportunistic Audit (Local Self-Hosted, 0 cloud mins)"
    needs: [resolve-execution-tier, evaluate-audit-timing]
    if: needs.evaluate-audit-timing.outputs.should_run == 'true' && needs.resolve-execution-tier.outputs.is_local_online == 'true'
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run Heavy Deep Audit & Vulnerability Sweep
        shell: powershell
        run: |
          Write-Host "Executing 24h+ opportunistic audit locally on $env:COMPUTERNAME..."
          if (Test-Path .venv\Scripts\pytest.exe) { .\.venv\Scripts\pytest.exe -q tests/unit/test_telemetry_event_bus_guard.py } else { pytest -q tests/unit/test_telemetry_event_bus_guard.py }
          python scripts/ops/wiring_atlas.py --check
          python scripts/ci/check_opportunistic_audit.py --record
      - name: Publish Audit Attestation
        shell: powershell
        run: Write-Host "Audit completed successfully on local machine. Timestamp recorded."

  execute-audit-cloud-fallback:
    name: "Run Emergency Audit (Cloud Fallback, SSOT tier)"
    needs: [resolve-execution-tier, evaluate-audit-timing]
    if: needs.evaluate-audit-timing.outputs.should_run == 'true' && needs.resolve-execution-tier.outputs.is_local_online != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Cloud Emergency Audit
        run: |
          echo "Local offline / tier fallback. Executing emergency audit on cloud (tier=${{ needs.resolve-execution-tier.outputs.execution_tier }})."
          python scripts/ci/check_opportunistic_audit.py --record
