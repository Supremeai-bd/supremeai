name: Main CI/CD
true:
  push:
    branches:
    - main
    paths-ignore:
    - docs/generated/**
    - docs/audit_reports/**
    - '**.md'
    - LICENSE
  workflow_dispatch: null
concurrency:
  group: main-ci-pipeline
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
jobs:
  verify:
    name: 🧪 Post-Merge Sanity & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
    - name: Setup Backend Runtime (real locked deps — honest boot smoke)
      uses: ./.github/actions/setup-backend
      with:
        python-version: '3.11'
        working-directory: backend
        mode: prepare
    - name: Boot Smoke Test
      run: backend/.venv/bin/python -c "import backend.main; print('✅ Boot smoke passed')"
    - name: Constitution Gates & Rules Sanity
      run: 'backend/.venv/bin/pytest .github/scripts/constitution/tests/ -q

        '
    - name: Zero Silent Exception Swallows Check
      run: 'backend/.venv/bin/pytest -o addopts="" --confcutdir=backend/tests/core
        backend/tests/core/test_no_silent_exception_swallow.py -q

        '
  artifact-regen:
    name: 📦 Artifact Auto-Regen & Sync
    needs:
    - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install Regen Dependencies
      run: 'python -m pip install --upgrade pip

        pip install pyyaml

        '
    - name: Regenerate Architecture Artifacts
      run: "if [ -f scripts/dev/build_import_graph.py ]; then\n  python scripts/dev/build_import_graph.py\
        \ || true\nfi\nif [ -f scripts/dev/update_module_capability_matrix.py ]; then\n\
        \  python scripts/dev/update_module_capability_matrix.py || true\nfi\n"
    - name: Commit regenerated artifacts if drifted
      env:
        GH_PUSH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
      run: "git config user.name \"supremeai-ci-action[bot]\"\ngit config user.email\
        \ \"5085691+supremeai-ci-action[bot]@users.noreply.github.com\"\nif [ -n \"\
        $(git status --porcelain docs/generated)\" ]; then\n  git add docs/generated\n\
        \  git commit -m \"chore(artifacts): post-merge auto-regen [skip ci]\"\n \
        \ git push \"https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git\"\
        \ main || echo \"::warning::Could not push auto-regen commit directly\"\n\
        else\n  echo \"✅ Artifacts already in sync\"\nfi\n"
  watchdog:
    name: 👁️ Post-Merge Watchdog (15-min)
    needs:
    - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Audit main health + auto-create issue if red
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: "set -euo pipefail\necho \"Watchdog monitoring active main commit...\"\n\
        python3 - <<'PY'\nimport json, os, urllib.request\n\nrepo = os.environ[\"\
        GH_REPO\"]\ntoken = os.environ[\"GH_TOKEN\"]\nheaders = {\"Authorization\"\
        : f\"Bearer {token}\", \"Accept\": \"application/vnd.github+json\"}\n\n# বাংলা\
        \ মন্তব্য: main branch-এর সর্বশেষ commit-এর check-runs আনো\nreq = urllib.request.Request(\n\
        \    f\"https://api.github.com/repos/{repo}/commits/main/check-runs?per_page=100\"\
        ,\n    headers=headers\n)\ntry:\n    with urllib.request.urlopen(req, timeout=30)\
        \ as r:\n        data = json.loads(r.read().decode(\"utf-8\"))\n        failing\
        \ = [c[\"name\"] for c in data.get(\"check_runs\", []) if c.get(\"conclusion\"\
        ) == \"failure\"]\n        if failing:\n            print(f\"\U0001F534 FAILING:\
        \ {failing}\")\n            # #2487: auto-create GitHub issue when main is\
        \ red\n            issue_body = f\"\"\"## \U0001F534 Post-Merge Watchdog:\
        \ main CI RED\n\n**Failing checks:** {', '.join(failing)}\n\n**Watchdog detected:**\
        \ main branch has failing CI checks after a merge.\n\n**Action required:**\
        \ Investigate the failing checks above. If this is a regression from a recent\
        \ merge, consider reverting.\n\n**Revert command:**\n```bash\ngh api repos/{repo}/git/refs/heads/main\
        \ -X PATCH -f sha=\"<previous-good-sha>\"\n```\n\n*Auto-created by post-merge\
        \ watchdog (#2487).*\n\"\"\"\n            issue_data = json.dumps({\n    \
        \            \"title\": \"\U0001F534 Post-Merge Watchdog: main CI RED — auto-created\"\
        ,\n                \"body\": issue_body,\n                \"labels\": [\"\
        P0-critical\", \"bug\", \"area:ci\"]\n            }).encode(\"utf-8\")\n \
        \           issue_req = urllib.request.Request(\n                f\"https://api.github.com/repos/{repo}/issues\"\
        ,\n                data=issue_data,\n                headers=headers,\n  \
        \              method=\"POST\"\n            )\n            try:\n        \
        \        with urllib.request.urlopen(issue_req, timeout=30) as resp:\n   \
        \                 issue = json.loads(resp.read().decode(\"utf-8\"))\n    \
        \                print(f\"✅ Auto-created issue #{issue['number']}: {issue['html_url']}\"\
        )\n            except Exception as ie:\n                print(f\"⚠️ Could\
        \ not auto-create issue: {ie}\")\n        else:\n            print(\"✅ All\
        \ check runs healthy on main.\")\nexcept Exception as e:\n    print(f\"Watchdog\
        \ probe info: {e}\")\nPY\n"
  deploy-train:
    name: 🚀 Auto Deploy Train
    needs:
    - verify
    - artifact-regen
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-train.yml
    secrets: inherit
    timeout-minutes: 30
