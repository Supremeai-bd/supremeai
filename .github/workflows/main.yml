# =============================================================================
# SupremeAI Main CI/CD Pipeline (Pipeline 3 of Canonical 3-Pipeline Architecture)
# =============================================================================
# Constitutional Reference: Protocol 14 & Hard Rule 6 (Rules v2.6)
# One single pipeline on main merge:
#   1. verify: Smoke test & critical sanity tests
#   2. artifact-regen: Post-merge auto-regeneration of dynamic artifacts
#   3. post-merge-watchdog: 15-minute watchdog alert
#   4. janitor: Merged branch debris cleaner
# =============================================================================

name: Main CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/generated/**"
      - "docs/audit_reports/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: main-ci-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Post-Merge Verification
  # ---------------------------------------------------------------------------
  verify:
    name: "🧪 Post-Merge Sanity & Smoke"
    runs-on: ubuntu-latest
    # বাংলা (#3253): cache-miss-এ আসল backend lock-deps install হয় (dev+mcp-tools
    # group) — পরিমাপকৃত ~2-4 মিনিট, তাই 10 → 15।
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # বাংলা (#3253 root-cause): আগে "Set up Python" (cache-dependency-path
      # backend/requirements.txt — ফাইলটি নেই-ই!) + ৭টা test-dep pip install হতো,
      # ফলে `import backend.main` CI-তে কখনোই পারত না — loguru প্রথম ধাক্কায়
      # ModuleNotFoundError। আগের `|| echo` যুগে এটা ভুয়া-সবুজে চাপা ছিল (#3227);
      # #3241 swallow সরাতেই সত্যিকারের লাল বেরিয়ে এলো (run 37341552919/37343497874)।
      # এখন ক্যানোনিকাল composite action (deploy-train/migration-gate একইটা ব্যবহার
      # করে) দিয়ে poetry.lock-ভিত্তিক আসল রানটাইম env হয় — in-project .venv,
      # lock-hash cache, `poetry check --lock` validation সহ। লোকাল প্রমাণ (U7):
      # fresh venv + `poetry export --only main` (206 pkgs, ~1m14s) →
      # `import backend.main` exit 0 + constitution 222 passed + swallow 3 passed।
      - name: Setup Backend Runtime (real locked deps — honest boot smoke)
        uses: ./.github/actions/setup-backend
        with:
          python-version: "3.11"
          working-directory: backend
          mode: prepare

      - name: Boot Smoke Test
        # বাংলা (#3227): আগে `|| echo "⚠️ Non-fatal boot check"` ছিল — import failure
        # চুপচাপ swallow করে step success বানাত। এখন সত্যিকারের fail — ভাঙা backend
        # CI-তে ধরা যাবে, false-green আর নয়। venv python explicit — PATH-অস্পষ্টতা নেই।
        # বাংলা (#3253): #3258-এর `pip install -r backend/requirements.txt` step সরানো
        # হলো — ফাইলটি রিপোতে নেই-ই (`git ls-tree origin/main backend/requirements.txt`
        # → 0 hit; dep SSoT = backend/pyproject.toml + backend/poetry.lock), ফলে
        # merged main-এ এই step "Could not open requirements file" দিয়ে লাল হচ্ছিল।
        # আসল deps এখন উপরের composite action-ই দেয় — একটাই setup-সিস্টেম (P2)।
        run: backend/.venv/bin/python -c "import backend.main; print('✅ Boot smoke passed')"

      - name: Constitution Gates & Rules Sanity
        run: |
          backend/.venv/bin/pytest .github/scripts/constitution/tests/ -q

      - name: Zero Silent Exception Swallows Check
        run: |
          backend/.venv/bin/pytest -o addopts="" --confcutdir=backend/tests/core backend/tests/core/test_no_silent_exception_swallow.py -q

  # ---------------------------------------------------------------------------
  # 2. Artifact Auto-Regen & Self-Healing
  # ---------------------------------------------------------------------------
  artifact-regen:
    name: "📦 Artifact Auto-Regen & Sync"
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Regen Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Regenerate Architecture Artifacts
        run: |
          if [ -f scripts/dev/build_import_graph.py ]; then
            python scripts/dev/build_import_graph.py || true
          fi
          if [ -f scripts/dev/update_module_capability_matrix.py ]; then
            python scripts/dev/update_module_capability_matrix.py || true
          fi

      - name: Commit regenerated artifacts if drifted
        env:
          # SELF_HEAL_PAT chain (anti-recursion #1634; artifact-regen.yml/ci-doctor.yml-র
          # একই প্রতিষ্ঠিত প্যাটার্ন) — bare GITHUB_TOKEN push mutation নিষিদ্ধ
          # (scripts/ci/check_self_heal_token_usage.py গেট), তাই push টোকেন এখানেই
          # self-contained: PAT থাকলে PAT, না থাকলে fallback github.token।
          GH_PUSH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
        run: |
          git config user.name "supremeai-ci-action[bot]"
          git config user.email "5085691+supremeai-ci-action[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/generated)" ]; then
            git add docs/generated
            git commit -m "chore(artifacts): post-merge auto-regen [skip ci]"
            git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main || echo "::warning::Could not push auto-regen commit directly"
          else
            echo "✅ Artifacts already in sync"
          fi

  # ---------------------------------------------------------------------------
  # 3. Post-Merge Watchdog (15-min main alert)
  # ---------------------------------------------------------------------------
  watchdog:
    name: "👁️ Post-Merge Watchdog (15-min)"
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit main health + auto-create issue if red
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Watchdog monitoring active main commit..."
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          # বাংলা মন্তব্য: main branch-এর সর্বশেষ commit-এর check-runs আনো
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/main/check-runs?per_page=100",
              headers=headers
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode("utf-8"))
                  failing = [c["name"] for c in data.get("check_runs", []) if c.get("conclusion") == "failure"]
                  if failing:
                      print(f"🔴 FAILING: {failing}")
                      # #2487: auto-create GitHub issue when main is red
                      issue_body = f"""## 🔴 Post-Merge Watchdog: main CI RED

          **Failing checks:** {', '.join(failing)}

          **Watchdog detected:** main branch has failing CI checks after a merge.

          **Action required:** Investigate the failing checks above. If this is a regression from a recent merge, consider reverting.

          **Revert command:**
          ```bash
          gh api repos/{repo}/git/refs/heads/main -X PATCH -f sha="<previous-good-sha>"
          ```

          *Auto-created by post-merge watchdog (#2487).*
          """
                      issue_data = json.dumps({
                          "title": "🔴 Post-Merge Watchdog: main CI RED — auto-created",
                          "body": issue_body,
                          "labels": ["P0-critical", "bug", "area:ci"]
                      }).encode("utf-8")
                      issue_req = urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/issues",
                          data=issue_data,
                          headers=headers,
                          method="POST"
                      )
                      try:
                          with urllib.request.urlopen(issue_req, timeout=30) as resp:
                              issue = json.loads(resp.read().decode("utf-8"))
                              print(f"✅ Auto-created issue #{issue['number']}: {issue['html_url']}")
                      except Exception as ie:
                          print(f"⚠️ Could not auto-create issue: {ie}")
                  else:
                      print("✅ All check runs healthy on main.")
          except Exception as e:
              print(f"Watchdog probe info: {e}")
          PY

  # ---------------------------------------------------------------------------
  # 4. Production Deploy Train (Automated Rollout via Pipeline 3)
  # ---------------------------------------------------------------------------
  deploy-train:
    timeout-minutes: 30  # #3699: prevent stuck deploys
    name: "🚀 Auto Deploy Train"
    needs: [verify, artifact-regen]
    # বাংলা মন্তব্য: vars.AUTO_DEPLOY_ENABLED == 'true' হলে main-এ মার্জ হওয়ার পর
    # স্বয়ংক্রিয়ভাবে পূর্ণ ৫-স্টেশন Deploy Train চালু হবে। কোটা বাঁচাতে ডিফল্ট
    # মোডে বন্ধ থাকবে — এনাবল করলেই সম্পূর্ণ অটোমেটিক রোলআউট হবে।
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-train.yml
    secrets: inherit
