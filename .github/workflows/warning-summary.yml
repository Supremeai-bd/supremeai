name: Warning Annotation Summary

# Runs after each existing workflow. This read-only reporting workflow never
# executes code from the triggering PR, changes checks, approves, or merges.
on:
  workflow_run:
    workflows:
      - SupremeAI Unified CI/CD Pipeline
      - 🔧 Nightly Ops & Maintenance
      - 💾 Nightly DB Backup (encrypted)
      - Deploy Rollback
      - CodeQL Weekly
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Summarize source run annotations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/ci/workflow_annotation_summary.py
