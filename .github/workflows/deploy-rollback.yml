name: "Deploy Rollback"

# Manual, audited rollback lane for the three Render services declared in
# render.yaml (autoDeploy is false everywhere, so a rollback is just a
# deploy of a known-good commit SHA).
#
# This workflow deliberately does NOT reuse unified-pipeline.yml: a rollback
# must not be planned from a diff, and it must fail closed if the requested
# SHA cannot be built. Strict mode (REQUIRE_EXPECTED_SHA) is on, so Render's
# "commit not indexed, fall back to branch HEAD" behavior is refused — a
# rollback that silently deploys HEAD would be worse than no rollback.
#
# Runbook: docs/runbooks/rollback.md

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Render service to roll back"
        required: true
        type: choice
        default: all
        options:
          - api
          - browser
          - mcp-tower
          - all
      target_sha:
        description: "Known-good commit SHA or ref to deploy (full 40-char SHA, HEAD~N, or short SHA; resolved against main)"
        required: true
        type: string
      reason:
        description: "Rollback justification (recorded in the audit trail)"
        required: true
        type: string

run-name: "Rollback ${{ inputs.service }} -> ${{ inputs.target_sha }} (@${{ github.actor }})"

permissions:
  contents: read

concurrency:
  group: deploy-rollback
  cancel-in-progress: false

jobs:
  resolve-targets:
    name: "Resolve rollback targets"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      previous_sha: ${{ steps.previous.outputs.sha }}
    steps:
      - name: Validate dispatch ref and target SHA format
        env:
          DISPATCH_REF: ${{ github.ref }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo "::error::Dispatch rollbacks from main only."
            exit 1
          fi
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::target_sha must not be empty."
            exit 1
          fi
          echo "Target ref accepted for resolution: $TARGET_SHA"

      - name: Record previous SHA (main HEAD at dispatch)
        id: previous
        env:
          GITHUB_SHA_ENV: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$GITHUB_SHA_ENV" >> "$GITHUB_OUTPUT"
          echo "Previous SHA (main HEAD at dispatch): $GITHUB_SHA_ENV"

      - name: Checkout canonical registry from dispatch main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target ref to full commit SHA
        id: resolve-sha
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          RESOLVED=$(git rev-parse "$TARGET_SHA^{commit}" 2>/dev/null || git rev-parse "$TARGET_SHA" 2>/dev/null || true)
          if [ -z "$RESOLVED" ] || ! printf '%s' "$RESOLVED" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::target_sha could not be resolved to a full 40-char commit SHA (got '${TARGET_SHA}')."
            exit 1
          fi
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Resolved target SHA: $RESOLVED"

      - name: Install service registry parser
        run: python -m pip install pyyaml

      - name: Build rollback matrix from the forward deploy registry
        id: matrix
        env:
          SERVICE: ${{ inputs.service }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_SCRAPER_SERVICE_ID: ${{ vars.RENDER_SCRAPER_SERVICE_ID || vars.RENDER_BROWSER_SERVICE_ID }}
          RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
          RENDER_CI_RUNNER_SERVICE_ID: ${{ vars.RENDER_CI_RUNNER_SERVICE_ID }}
        run: |
          case "$SERVICE" in
            api) targets=api ;;
            browser) targets=scraper ;;
            mcp-tower) targets=mcp ;;
            all) targets=api,scraper,mcp ;;
            *) echo "::error::Unsupported rollback service."; exit 1 ;;
          esac
          python scripts/ci/plan_render_deploys.py --force --targets "$targets" --require-configured

  rollback:
    name: "Roll back ${{ matrix.service }}"
    # hierarchy-exception: manual emergency rollback workflow
    needs: resolve-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Approval gate: deployments to production land only after the
    # environment's required reviewers approve.
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
    concurrency:
      group: render-service-${{ matrix.service_id }}
      cancel-in-progress: false
    steps:
      # The target SHA is data for Render, not executable verification policy.
      - name: Checkout the main revision that dispatched this workflow
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate that the target SHA is an ancestor of dispatch main
        env:
          TARGET_SHA: ${{ steps.resolve-sha.outputs.resolved }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "::error::Target ${TARGET_SHA} is not an ancestor of dispatch main."
            exit 1
          fi
          echo "Target ${TARGET_SHA} is on main ✓"

      - name: Trigger the rollback deploy and poll to a terminal state
        id: deploy
        env:
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          RENDER_HEALTH_PATH: ${{ matrix.health_path }}
          EXPECTED_SHA: ${{ steps.resolve-sha.outputs.resolved }}
          REQUIRE_EXPECTED_SHA: "1"
          RENDER_WAIT_TIMEOUT_SECONDS: "600"
          RENDER_API_KEY: ${{ secrets[matrix.api_key_env] || secrets[matrix.api_key_alias_env] }}
        run: python scripts/ci/render_trigger_deploy.py

      - name: Verify the rollback landed (source revision, not only health)
        id: attest
        env:
          RENDER_DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          RENDER_SERVICE_ID: ${{ matrix.service_id }}
          EXPECTED_SHA: ${{ steps.resolve-sha.outputs.resolved }}
          RELEASE_URL: ${{ steps.deploy.outputs.release_url }}
          RENDER_API_KEY: ${{ secrets[matrix.api_key_env] || secrets[matrix.api_key_alias_env] }}
        run: python scripts/ci/render_deploy_attestation.py

      - name: Canary for the rollback service
        id: canary
        if: ${{ !cancelled() && steps.deploy.outputs.health_url != '' }}
        env:
          RENDER_SERVICE_NAME: ${{ matrix.service }}
          RENDER_CANARY_URL: ${{ steps.deploy.outputs.health_url }}
        run: python scripts/ci/render_canary.py

      - name: Post rollback summary
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
          PREVIOUS_SHA: ${{ needs.resolve-targets.outputs.previous_sha }}
          TARGET_SHA: ${{ steps.resolve-sha.outputs.resolved }}
          REASON: ${{ inputs.reason }}
          OPERATOR: ${{ github.actor }}
          OUTCOME: ${{ job.status }}
          DEPLOY: ${{ steps.deploy.outputs.deploy_status || steps.deploy.outcome }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          ATTESTATION: ${{ steps.attest.outputs.release_status || steps.attest.outcome }}
          CANARY: ${{ steps.canary.outcome }}
        run: |
          set -euo pipefail
          # Keep the summary table intact even if the reason contains pipes/newlines.
          reason="$(printf '%s' "$REASON" | tr '\n' ' ' | tr '|' '/')"

          {
            echo "## Rollback: ${SERVICE} (\`${SERVICE}\`)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Service | \`${SERVICE}\` |"
            echo "| Previous SHA (main HEAD at dispatch) | \`${PREVIOUS_SHA}\` |"
            echo "| Rolled back to | \`${TARGET_SHA}\` |"
            echo "| Reason | ${reason} |"
            echo "| Operator | @${OPERATOR} |"
            echo "| Outcome | ${OUTCOME} |"
            echo ""
            echo "Database migrations are NOT reverted by this workflow (see docs/runbooks/rollback.md)."
            echo "- Deploy: $DEPLOY (${DEPLOY_ID:-no deploy ID})"
            echo "- Release attestation: $ATTESTATION"
            echo "- Health canary: $CANARY"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Rollback ${SERVICE} (${OUTCOME})::previous=${PREVIOUS_SHA} target=${TARGET_SHA} operator=@${OPERATOR} reason=${reason}"
