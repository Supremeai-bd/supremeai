name: Full Test Battery & Regression Verification

on:
  schedule:
    # Nightly run at 02:00 UTC (8:00 AM BST) on GitHub-hosted public runner
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - gateway
          - unit_and_guards
      fail_fast:
        description: 'Stop immediately on first failure'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  full-test-battery:
    name: "Full Battery (${{ inputs.test_suite || 'all' }})"
    # hierarchy-exception: scheduled nightly battery running on public GitHub runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            gateway/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r core/requirements.txt -r gateway/requirements.txt ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis "mcp>=1.28.1,<2"

      - name: Run Full Test Battery
        id: run_tests
        shell: bash
        run: |
          set -o pipefail
          SUITE="${{ inputs.test_suite || 'all' }}"
          FAIL_FAST_FLAG=""
          if [ "${{ inputs.fail_fast }}" = "true" ]; then
            FAIL_FAST_FLAG="-x"
          fi

          echo "=========================================================="
          echo "Starting Full Test Battery execution: Target = $SUITE"
          echo "Public Runner: Unlimited compute allocation"
          echo "=========================================================="

          TARGET_PATHS=""
          if [ "$SUITE" = "core" ]; then
            TARGET_PATHS="core/tests"
          elif [ "$SUITE" = "gateway" ]; then
            TARGET_PATHS="gateway/tests"
          elif [ "$SUITE" = "unit_and_guards" ]; then
            TARGET_PATHS="tests/unit tests/security"
          else
            TARGET_PATHS="tests core/tests gateway/tests"
          fi

          # Execute pytest with short traceback, skipping external/slow markers by default if unconfigured
          pytest $TARGET_PATHS $FAIL_FAST_FLAG -ra --tb=short -m "not external" 2>&1 | tee test_output.log
          TEST_EXIT_CODE=$?

          echo "pytest_exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT_CODE

      - name: Generate Summary Report
        if: always()
        shell: bash
        run: |
          echo "### 🧪 Full Test Battery Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Suite:** \`${{ inputs.test_suite || 'all' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner:** \`ubuntu-24.04\` (GitHub Public Unlimited)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test_output.log ]; then
            echo "#### Summary Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 test_output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
