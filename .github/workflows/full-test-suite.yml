name: Full Test Battery & Regression Verification

on:
  schedule:
    - cron: '0 2 * * *'  # 08:00 BDT, independent of production deployment
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-test-suite.yml'
      - 'core/requirements.lock'
      - 'gateway/requirements.lock'
      - 'config/ci/full-test-requirements.txt'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to execute'
        required: true
        default: 'all'
        type: choice
        options: [all, core, gateway, unit_and_guards, windows, tower]
      fail_fast:
        description: 'Stop the selected Python suite on its first failure'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  full-test-battery:
    name: "Full Battery (${{ matrix.suite }})"
    if: inputs.test_suite != 'windows' && inputs.test_suite != 'tower'
    # hierarchy-exception: independent scheduled regressions on hosted runners
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ (inputs.test_suite == '' || inputs.test_suite == 'all') && fromJSON('["repo","core","gateway"]') || fromJSON(format('["{0}"]', inputs.test_suite)) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            core/requirements.lock
            gateway/requirements.lock
            config/ci/full-test-requirements.txt

      - name: Install locked runtimes and pytest tooling
        run: python -m pip install -r core/requirements.lock -r gateway/requirements.lock -r config/ci/full-test-requirements.txt ruff pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis 'mcp>=1.28.1,<2'

      - name: Run regression suite and record JUnit evidence
        env:
          SUITE: ${{ matrix.suite }}
          FAIL_FAST: ${{ inputs.fail_fast }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SUITE" in
            repo) paths=(tests) ;;
            core) paths=(core/tests) ;;
            gateway) paths=(gateway/tests) ;;
            unit_and_guards) paths=(tests/unit tests/security) ;;
            *) echo "::error::Unknown suite"; exit 2 ;;
          esac
          args=()
          if [ "$FAIL_FAST" = true ]; then args+=(-x); fi
          python -m pytest "${paths[@]}" "${args[@]}" -m 'not (external or requires_network or hitl or e2e)' --timeout=90 --junitxml=pytest.xml

      - name: Report the suite and tested revision
        if: ${{ !cancelled() }}
        env:
          SUITE: ${{ matrix.suite }}
          OUTCOME: ${{ job.status }}
        run: |
          printf '### %s regression suite\n\n- SHA: `%s`\n- Result: %s\n' "$SUITE" "$GITHUB_SHA" "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload suite evidence (including failures)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-${{ matrix.suite }}-${{ github.sha }}
          path: pytest.xml
          retention-days: 7

  windows-contracts:
    name: "Windows regression contracts (path and symlink guards)"
    if: inputs.test_suite == '' || inputs.test_suite == 'all' || inputs.test_suite == 'windows'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.lock
      - name: Install the locked Core runtime and test tooling
        run: python -m pip install -r core/requirements.lock pytest pytest-asyncio pytest-timeout
      - name: Run Windows routing and filesystem assertions
        run: python -m pytest core/tests/llm/test_advanced_model_router_regression.py --timeout=60 --junitxml=pytest-windows.xml
      - name: Upload Windows evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-windows-${{ github.sha }}
          path: pytest-windows.xml
          retention-days: 7

  tower-contracts:
    name: "MCP Tower TypeScript regression battery"
    if: inputs.test_suite == '' || inputs.test_suite == 'all' || inputs.test_suite == 'tower'
    # hierarchy-exception: independent scheduled regressions on hosted runners
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infrastructure/mcp-control-plane
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infrastructure/mcp-control-plane/package-lock.json
      - name: Build and verify the locked MCP Tower
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:tower-ci
