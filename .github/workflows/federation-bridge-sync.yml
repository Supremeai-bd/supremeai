# =============================================================================
# 🌉 SupremeAI Federation Bridge Orchestrator (Manual Restart & Sync)
# =============================================================================
# Bidirectional sync and manual bridge restart across Federation Satellites:
#   - Multi-satellite selection (e.g. 'all' or 'studio, api, core')
#   - Smart Drift / Change Detection (skips repos with zero changes unless forced)
#   - supremeai -> Satellites (Downstream baseline & contract propagation)
#   - Satellites -> supremeai (Upstream sync & commit reconciliation)
#   - Bridge Intake & Reconciliation (Restarts intake queue & settles PR verdicts)
# =============================================================================

name: 🌉 Federation Bridge Orchestrator (Restart & Bidirectional Sync)

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "Direction of synchronization"
        required: true
        type: choice
        default: "bidirectional"
        options:
          - "bidirectional"
          - "supremeai_to_satellites"
          - "satellites_to_supremeai"
          - "intake_restart_only"
      target_satellites:
        description: "Target satellite(s): 'all' or comma-separated (e.g. 'studio, api, core')"
        required: true
        type: string
        default: "all"
      skip_if_no_changes:
        description: "Smart Change Detection: skip satellites that have no drift/changes"
        required: false
        type: boolean
        default: true
      force_sync:
        description: "Force sync even if no new changes are detected"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: federation-bridge-sync
  cancel-in-progress: false

jobs:
  bridge-orchestrator:
    name: "🌉 Bridge Orchestration Engine"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vault → Bridge Token Mint (App Installation Token / PAT Fallback)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, tempfile, time, urllib.request

          def api(url, payload=None, tok=None, method=None):
              data = json.dumps(payload).encode() if payload is not None else None
              h = {"Content-Type": "application/json", "Accept": "application/vnd.github+json", "User-Agent": "bridge-orchestrator"}
              if tok: h["Authorization"] = f"Bearer {tok}"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=45) as r: return json.load(r)

          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          if not os.environ.get("INFISICAL_CLIENT_ID"):
              print("[info] INFISICAL_CLIENT_ID not found, using GITHUB_TOKEN fallback")
              tok = os.environ.get("GITHUB_TOKEN", "")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"BRIDGE_TOKEN<<EOF\n{tok}\nEOF\n")
              exit(0)

          try:
              res = api("https://app.infisical.com/api/v1/auth/universal-auth/login",
                        {"clientId": os.environ["INFISICAL_CLIENT_ID"], "clientSecret": os.environ["INFISICAL_CLIENT_SECRET"]})
              secs = api(f"https://app.infisical.com/api/v3/secrets/raw?workspaceId={os.environ['INFISICAL_PROJECT_ID']}&environment=prod&secretPath=/&recursive=true",
                         tok=res["accessToken"])
              kv = {s["secretKey"].upper(): s.get("secretValue") or "" for s in secs.get("secrets", [])}
              pat = kv.get("GITHUB_PAT_PAYKARIBAZARONLINE", "") or kv.get("GITHUB_TOKEN", "")
              app_id = kv.get("GITHUB_APP_ID", "")
              pem = kv.get("GITHUB_APP_PRIVATE_KEY", "")
              tok, src = "", ""

              if app_id and pem and "PRIVATE KEY" in pem:
                  try:
                      pem_text = pem if "\n" in pem else pem.replace("\\n", "\n")
                      with tempfile.NamedTemporaryFile("w", suffix=".pem", delete=False) as f:
                          f.write(pem_text)
                          pem_path = f.name
                      now = int(time.time())
                      hdr = b64u(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
                      pl = b64u(json.dumps({"iat": now - 60, "exp": now + 540, "iss": str(app_id)}).encode())
                      sig = subprocess.run(["openssl", "dgst", "-sha256", "-sign", pem_path],
                                           input=f"{hdr}.{pl}".encode(), capture_output=True, check=True).stdout
                      jwt = f"{hdr}.{pl}.{b64u(sig)}"
                      insts = api("https://api.github.com/app/installations", tok=jwt)
                      inst = next((i for i in insts if (i.get("account") or {}).get("login") == "Supremeai-bd"), None)
                      if inst:
                          tok = api(f"https://api.github.com/app/installations/{inst['id']}/access_tokens", tok=jwt, method="POST")["token"]
                          src = "app-installation"
                  except Exception as e:
                      print(f"[warn] App minting failed ({e}) - falling back to PAT")

              if not tok:
                  tok = pat or os.environ.get("GITHUB_TOKEN", "")
                  src = "vault-pat"

              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"BRIDGE_TOKEN<<EOF\n{tok}\nEOF\n")
              print(f"[ok] Bridge token loaded successfully (source={src})")
          except Exception as e:
              print(f"[warn] Vault fetch error ({e}) - falling back to GITHUB_TOKEN")
              tok = os.environ.get("GITHUB_TOKEN", "")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"BRIDGE_TOKEN<<EOF\n{tok}\nEOF\n")
          PY

      - name: "Execute Smart Bidirectional Bridge Sync with Change Detection"
        env:
          BRIDGE_TOKEN: ${{ env.BRIDGE_TOKEN }}
          DIRECTION: ${{ github.event.inputs.direction || 'bidirectional' }}
          TARGET_SATELLITES: ${{ github.event.inputs.target_satellites || 'all' }}
          SKIP_IF_NO_CHANGES: ${{ github.event.inputs.skip_if_no_changes || 'true' }}
          FORCE_SYNC: ${{ github.event.inputs.force_sync || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, datetime, subprocess

          token = os.environ.get("BRIDGE_TOKEN")
          direction = os.environ.get("DIRECTION", "bidirectional")
          raw_targets = os.environ.get("TARGET_SATELLITES", "all").strip()
          skip_no_changes = os.environ.get("SKIP_IF_NO_CHANGES", "true").lower() == "true"
          force_sync = os.environ.get("FORCE_SYNC", "false").lower() == "true"
          org = "Supremeai-bd"

          ALL_SATELLITES = [
              "studio", "api", "vscode", "browser", "core", "command",
              "skills", "agents", "sdk", "archive", "infrastructure", "mcp-control-plane"
          ]

          # Monorepo directory mapping for downstream change detection
          SATELLITE_PATHS = {
              "studio": "frontend",
              "api": "backend/services/api",
              "core": "backend/core",
              "command": "backend/services/command",
              "skills": "skills",
              "vscode": "vscode",
              "browser": "browser",
              "agents": "backend/agents",
              "sdk": "sdk",
              "archive": "docs/archive",
              "infrastructure": "infrastructure",
              "mcp-control-plane": "infrastructure/mcp-control-plane"
          }

          # Parse multiple selection or 'all'
          if raw_targets.lower() == "all":
              selected_satellites = ALL_SATELLITES
          else:
              selected_satellites = [
                  s.strip().replace("supremeai-", "") 
                  for s in raw_targets.split(",") 
                  if s.strip().replace("supremeai-", "") in ALL_SATELLITES
              ]

          if not selected_satellites:
              print(f"[-] No valid satellites found in target selection: '{raw_targets}'")
              print(f"    Available satellites: {', '.join(ALL_SATELLITES)}")
              sys.exit(1)

          def gh_req(method, endpoint, payload=None):
              url = f"https://api.github.com{endpoint}"
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "supremeai-bridge-orchestrator"
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      if resp.status == 204:
                          return {"status": 204}
                      return json.loads(resp.read().decode())
              except Exception as e:
                  return {"error": str(e)}

          # Load sync history ledger for change detection
          ledger_path = "docs/ledger/satellite_sync.jsonl"
          last_synced_shas = {}
          if os.path.exists(ledger_path):
              with open(ledger_path, "r", encoding="utf-8") as f:
                  for line in f:
                      if line.strip():
                          try:
                              entry = json.loads(line)
                              sat_key = entry.get("satellite", "").replace(f"{org}/supremeai-", "")
                              last_synced_shas[sat_key] = entry.get("commit_sha", "")
                          except Exception:
                              pass

          print(f"=== Starting Federation Bridge Sync ===")
          print(f"Mode: {direction}")
          print(f"Satellites ({len(selected_satellites)}): {', '.join(selected_satellites)}")
          print(f"Smart Change Detection: {'ENABLED' if skip_no_changes else 'DISABLED'}")
          print(f"Force Sync: {'YES' if force_sync else 'NO'}\n")

          summary_table = []
          os.makedirs("docs/ledger", exist_ok=True)

          # 1. Satellites -> SupremeAI (Upstream Sync)
          if direction in ("bidirectional", "satellites_to_supremeai"):
              print("--- Phase 1: Upstream Sync (Satellites -> SupremeAI) ---")
              for sat in selected_satellites:
                  repo_name = f"supremeai-{sat}"
                  res = gh_req("GET", f"/repos/{org}/{repo_name}/commits/main")
                  if "error" in res:
                      summary_table.append((sat, "Upstream", "❌ ERROR", res["error"]))
                      print(f"[-] {repo_name}: {res['error']}")
                      continue

                  latest_sha = res.get("sha", "")[:8]
                  commit_msg = (res.get("commit", {}).get("message", "")).splitlines()[0][:50]
                  last_sha = last_synced_shas.get(sat, "")[:8]

                  # Change detection check
                  if skip_no_changes and not force_sync and last_sha == latest_sha:
                      print(f"[=] {repo_name}: SKIPPED (No drift; already in sync at {latest_sha})")
                      summary_table.append((sat, "Upstream", "⏭️ SKIPPED", f"Up to date at {latest_sha} (no new commits)"))
                      continue

                  record = {
                      "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "satellite": f"{org}/{repo_name}",
                      "commit_sha": latest_sha,
                      "message": commit_msg,
                      "status": "synchronized"
                  }
                  with open(ledger_path, "a", encoding="utf-8") as f:
                      f.write(json.dumps(record) + "\n")
                  last_synced_shas[sat] = latest_sha
                  print(f"[+] {repo_name}: SYNCED HEAD {latest_sha} - {commit_msg}")
                  summary_table.append((sat, "Upstream", "✅ SYNCED", f"New HEAD: {latest_sha} ({commit_msg})"))

          # 2. SupremeAI -> Satellites (Downstream Sync)
          if direction in ("bidirectional", "supremeai_to_satellites"):
              print("\n--- Phase 2: Downstream Sync (SupremeAI -> Satellites) ---")
              head_sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"], text=True).strip()
              
              for sat in selected_satellites:
                  repo_name = f"supremeai-{sat}"
                  source_dir = SATELLITE_PATHS.get(sat, "")
                  
                  # Check if source directory exists and has changes
                  has_changes = True
                  if skip_no_changes and not force_sync and source_dir:
                      try:
                          # Check if files in this satellite folder were changed in the latest commit
                          changed_files = subprocess.check_output(
                              ["git", "diff", "--name-only", "HEAD~1", "HEAD", "--", source_dir],
                              text=True, stderr=subprocess.DEVNULL
                          ).strip()
                          if not changed_files and sat in last_synced_shas:
                              has_changes = False
                      except Exception:
                          has_changes = True

                  if not has_changes:
                      print(f"[=] {repo_name}: SKIPPED (No local changes in '{source_dir}/')")
                      summary_table.append((sat, "Downstream", "⏭️ SKIPPED", f"No changes in '{source_dir}/'"))
                      continue

                  payload = {
                      "event_type": "bridge_downstream_sync",
                      "client_payload": {
                          "source_repo": f"{org}/supremeai",
                          "target_repo": f"{org}/{repo_name}",
                          "monorepo_sha": head_sha,
                          "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                          "event_kind": "bridge.downstream.sync"
                      }
                  }
                  res = gh_req("POST", f"/repos/{org}/{repo_name}/dispatches", payload)
                  if "error" in res:
                      summary_table.append((sat, "Downstream", "⚠️ WARN", f"Dispatch rejected: {res['error']}"))
                      print(f"[-] {repo_name} dispatch: {res['error']}")
                  else:
                      summary_table.append((sat, "Downstream", "✅ DISPATCHED", f"Event bridge_downstream_sync sent (SHA {head_sha})"))
                      print(f"[+] {repo_name}: Dispatched downstream sync event")

          # 3. Generate Markdown Report for GitHub Step Summary
          summary_md = "### 🌉 Federation Bridge Sync & Change Detection Report\n\n"
          summary_md += f"- **Mode**: `{direction}`\n"
          summary_md += f"- **Target Satellites**: `{', '.join(selected_satellites)}`\n"
          summary_md += f"- **Smart Change Detection**: `{'Enabled' if skip_no_changes else 'Disabled'}`\n"
          summary_md += f"- **Force Sync**: `{'Yes' if force_sync else 'No'}`\n"
          summary_md += f"- **Timestamp**: `{datetime.datetime.now(datetime.timezone.utc).isoformat()}`\n\n"
          summary_md += "| Satellite | Direction | Verdict | Details |\n"
          summary_md += "|---|---|---|---|\n"
          for sat, d, st, det in summary_table:
              summary_md += f"| `supremeai-{sat}` | {d} | {st} | {det} |\n"

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary_md)
          print("\n=== Bridge Sync Finished ===")
          PY

      - name: "Restart Bridge Intake Queue & Reconcile Orders"
        if: always()
        env:
          BRIDGE_TOKEN: ${{ env.BRIDGE_TOKEN }}
        run: |
          echo "=== Restarting Bridge Intake & Reconciliation ==="
          python scripts/bridge/bridge_intake.py both || true
