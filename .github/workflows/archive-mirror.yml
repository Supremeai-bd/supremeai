# বাংলা মন্তব্য: ADR-005 Phase B / ADR-007 Phase E — লাইভ main → cold-archive মিরর।
# ২০২৬-১০-১৩ (#130): parent (SaifulHaqueNiloy/supremeai) ডিলিট হয়েছে — push-এ 403 (run 38408955048 প্রমাণ)।
# নতুন টার্গেট = org-নিজস্ব paykaribazaronline/supremeai-archive (২০২৬-১০-০৯ থেকে বিদ্যমান cold-archive repo)।
# টার্গেট ব্রাঞ্চ = archive/main (আর্কাইভ repo-র নিজের main অক্ষত থাকবে — মিরর ব্রাঞ্চে ff-push;
# পুরনো parent-এ ২০২৬-১০-০৯ প্রথম push প্রমাণিত ছিল 3e29a443)। দীর্ঘমেয়াদি topology = #74 ADMIN_DECISION।
# ক্রেডেনশিয়াল: vault GITHUB_PAT_PAYKARIBAZARONLINE (PKO identity — archive repo-তে push প্রমাণিত) —
# INFISICAL_* দিয়ে রানটাইমে ফেচ, কখনো repo-secret/লগে থাকে না (শূন্য-প্রিন্ট শৃঙ্খলা)।
# পুরনো vault GITHUB_TOKEN (SHN identity) নতুন টার্গেটে "Repository not found" — প্রমাণসহ অচল (#130)।
# LFS (#130, run 38413880153): নতুন টার্গেটের সাথে fork-LFS network নেই → সব LFS object upload করতে হয়।
# checkout lfs:true + push-এর আগে `git lfs fetch --all origin` (পূর্ণ-ইতিহাস object, অন্যথায়
# পুরনো commit-এর object মিসিং থেকে push reject — "missing or corrupt local objects")।
# App-token ব্যবহারযোগ্য নয়: App-এ workflows permission নেই → workflow-ফাইল-বহুল commit push-এ remote-rejected (প্রমাণিত)।
name: Archive Mirror (live main → cold archive)

on:
  schedule:
    - cron: "0 4 * * 0" # Workflow Diet #67 (Category E): 6-hourly → weekly Sunday 04:00 UTC off-peak (staggered after nightly-ops 03:00)
  workflow_dispatch:
    inputs:
      verify_only:
        description: "true হলে শুধু ff-check করবে, push করবে না"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  # ২০২৬-১০-১৩ (#130): পুরনো group-এ Oct 10-এর zombie run (38017395370) ৩.৫+ দিন ধরে
  # "in_progress" — cancel 409 / delete 403 (zombie-state, owner-lane cleanup বাকি)।
  # group rename = একমাত্র operational escape — ভবিষ্যতের সব run (cron সহ) নতুন group-এ।
  group: archive-mirror-v2
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live main (পূর্ণ ইতিহাস — push-এর জন্য)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true # archive-টার্গেটে fork-LFS network নেই → object upload লাগবে (#130)

      - name: Vault থেকে mirror-token ফেচ (GITHUB_PAT_PAYKARIBAZARONLINE, মান প্রিন্ট নিষিদ্ধ)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          # বাংলা: Infisical universal-auth login → prod secrets → GITHUB_PAT_PAYKARIBAZARONLINE → GITHUB_ENV
          import json, os, urllib.request
          def api(url, payload=None, tok=None):
              data = json.dumps(payload).encode() if payload is not None else None
              h = {"Content-Type": "application/json", "Accept": "application/json", "User-Agent": "archive-mirror"}
              if tok: h["Authorization"] = f"Bearer {tok}"
              req = urllib.request.Request(url, data=data, headers=h)
              with urllib.request.urlopen(req, timeout=45) as r: return json.load(r)
          res = api("https://app.infisical.com/api/v1/auth/universal-auth/login",
                    {"clientId": os.environ["INFISICAL_CLIENT_ID"], "clientSecret": os.environ["INFISICAL_CLIENT_SECRET"]})
          secs = api(f"https://app.infisical.com/api/v3/secrets/raw?workspaceId={os.environ['INFISICAL_PROJECT_ID']}&environment=prod&recursive=true",
                     tok=res["accessToken"])
          kv = {s["secretKey"].upper(): s.get("secretValue") or "" for s in secs.get("secrets", [])}
          tok = kv.get("GITHUB_PAT_PAYKARIBAZARONLINE", "")
          if not tok:
              raise SystemExit("vault-এ GITHUB_PAT_PAYKARIBAZARONLINE শূন্য — PKO archive-এ mirror অসম্ভব")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"MIRROR_TOKEN<<EOF\n{tok}\nEOF\n")
          print("[ok] vault থেকে mirror-token লোড (মান মাস্কড, প্রিন্ট হয়নি)")
          PY

      - name: Fast-forward যাচাই (receive-only চুক্তি, fail-closed)
        id: ff
        env:
          MIRROR_TOKEN: ${{ env.MIRROR_TOKEN }}
        run: |
          git remote add archive "https://x-access-token:${MIRROR_TOKEN}@github.com/paykaribazaronline/supremeai-archive.git"
          git fetch -q archive main archive/main || true
          if git cat-file -e archive/main 2>/dev/null; then
            # বাংলা: বিদ্যমান মিরর-ব্রাঞ্চ — অবশ্যই fork main-এর পূর্বপুরুষ হতে হবে
            if git merge-base --is-ancestor archive/main main; then
              AHEAD=$(git rev-list --count archive/main..main)
              echo "ff_ok=true" >> "$GITHUB_OUTPUT"; echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
              echo "[ok] fast-forward সম্ভব — মিরর $AHEAD commit পিছিয়ে"
            else
              echo "ff_ok=false" >> "$GITHUB_OUTPUT"
              echo "::error::archive/main fork main-এর পূর্বপুরুষ নয় — receive-only চুক্তি ভাঙা; push বাতিল"
            fi
          else
            echo "ff_ok=true" >> "$GITHUB_OUTPUT"; echo "ahead=$(git rev-list --count main)" >> "$GITHUB_OUTPUT"
            echo "[ok] প্রথম মিরর — নতুন archive/main তৈরি হবে"
          fi

      - name: Mirror push (শুধু fast-forward, main → archive/main)
        if: steps.ff.outputs.ff_ok == 'true' && github.event.inputs.verify_only != 'true'
        env:
          MIRROR_TOKEN: ${{ env.MIRROR_TOKEN }}
        run: |
          # বাংলা: persist-credentials:false-এর কারণে origin-এ এম্বেডেড টোকেন থাকে না →
          # git-lfs-এর batch API কলে "Git credentials not found" (run 38425381801 প্রমাণ)।
          # ff-check-এর archive-remote প্যাটার্নেই origin-এ টোকেন বসানো হয় —
          # শুধু এপিমেরাল রানারের .git-এ থাকে, কোনো লগ/রিপো-তে প্রিন্ট হয় না (শূন্য-প্রিন্ট শৃঙ্খলা)।
          git remote set-url origin "https://x-access-token:${MIRROR_TOKEN}@github.com/paykaribazaronline/supremeai.git"
          git lfs fetch --all origin # পূর্ণ-ইতিহাস LFS object — first-mirror push সম্পূর্ণ রাখতে (#130)
          git push archive main:archive/main
          echo "[ok] archive-mirror push সম্পন্ন — archive/main এখন $(git rev-parse --short main)"

      - name: ফলাফল-সারাংশ
        run: |
          echo "mirror_mode=fast-forward-only"
          echo "target=paykaribazaronline/supremeai-archive@archive/main"
          echo "verify_only=${{ github.event.inputs.verify_only }}"
          echo "ff_ok=${{ steps.ff.outputs.ff_ok }}"
          echo "pending_commits=${{ steps.ff.outputs.ahead }}"
