      security-events: write
    name: Validate constitution governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v6 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate exceptions and expiry
        run: python scripts/ci/validate_constitution_governance.py
      - name: Run constitution unit tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts/constitution/tests -v

  self-audit:
    needs: [resolve-execution-tier]
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_self_audit == true || inputs.run_all == true)) ||
        ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
    name: 🔍 Weekly Self-Audit Scan
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Run offline self-audit scan
      run: "python3 scripts/quality/self_audit_scan.py \\\n  --path . \\\n  --json self_audit_report.json \\\n  --fail-on-syntax-error\n"
    timeout-minutes: 30

  workflow-runs-retention:
    needs: [resolve-execution-tier]
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_workflow_runs_retention == true || inputs.run_all == true)) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    name: 🧹 Workflow Runs Retention & Purge
    concurrency:
      group: nightly-ops-workflow-runs-retention
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6 # v7.0.0
        with:
          python-version: "3.11"

      - name: Purge stale completed workflow runs
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/ci/purge_stale_workflow_runs.py --min-age-days 2 --max-deletions 100

      - name: Nightly Git Optimization, Cache Eviction & Blob/Dependency Hygiene
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          python scripts/ci/nightly_repo_hygiene.py --self-test
          python scripts/ci/nightly_repo_hygiene.py --all \
            --json ci-reports/nightly-hygiene.json \
            --markdown ci-reports/nightly-hygiene.md
          cat ci-reports/nightly-hygiene.md >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # Watchdog & Cron Health (from schedule-watchdog.yml)
  # ---------------------------------------------------------------------------
  watchdog:
    needs: [resolve-execution-tier]
    name: "⏰ Schedule Watchdog (cron self-heal)"
    # 2026-11-24 fix: the watchdog existed only behind workflow_dispatch, so
    # dead/dropped crons were never re-armed automatically (GitHub drops and
    # delays scheduled events under load — observed: the 03:00 UTC bundle ran
    # 9h late and the 30-min redis cron went silent for 12+ hours). The
    # watchdog now rides the daily bundle and self-heals the schedule.
    if: github.event_name == 'workflow_dispatch' || ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Watchdog sweep (re-arm dead cron + compensate missed slots)
        env:
          # The built-in token is read-only under some private-repository/org
          # policies. Prefer the existing narrowly scoped self-heal token for
          # workflow listing, re-arm, and dispatch operations.
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/ci/schedule_watchdog.py

  # ---------------------------------------------------------------------------
  # Pipeline Failure Register (revived 2026-11-24)
  # ---------------------------------------------------------------------------
  # The register runner workflow was deleted during the workflow consolidation
  # (issue-ops.yml → ops-maintenance.yml), orphaning scripts/ci/
  # pipeline_failure_register.py — issue #9 (PIPELINE-FAILURE-REGISTER) has been
  # frozen since 2026-10-09 while nightly failures went untracked. This arm
  # revives it: a cheap API-only scan on every schedule window.
  failure-register:
    needs: [resolve-execution-tier]
    name: "📋 Pipeline Failure Register (auto-maintained ledger)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Scan failures and maintain the register ledger (issue #9)
        env:
          # বাংলা মন্তব্য: SELF_HEAL_PAT মেয়াদোত্তীর্ণ বা স্কোপ-সীমিত হলে GH_FALLBACK_TOKEN (github.token) দিয়ে স্বয়ংক্রিয় ফ্যালব্যাক হয়।
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/ci/pipeline_failure_register.py --scan

  # ---------------------------------------------------------------------------
  # Issue Template Conformance & Ops (from issue-ops.yml)
  # ---------------------------------------------------------------------------
  template-validate:
    needs: [resolve-execution-tier]
    name: "📝 Issue Template Conformance"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install pyyaml
      - name: Validate Issue Template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/constitution/template_gate.py --issue 0

  # ---------------------------------------------------------------------------
  # Dependency Health Scan (from dependency-health-check.yml)
  # ---------------------------------------------------------------------------
  dependency-scan:
    needs: [resolve-execution-tier]
    name: "🩺 Dependency Health Scan"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check studio surface presence
        id: check_studio
        run: |
          if [ -f studio/pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.check_studio.outputs.present == 'true'
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@v7
        if: steps.check_studio.outputs.present == 'true'
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.check_studio.outputs.present == 'true'
        working-directory: studio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pipx install poetry
      - name: Run Dependency Health Checker
        run: python scripts/security/check_dependencies.py

  # ---------------------------------------------------------------------------
  # Kaggle Empirical Learning (consolidated nightly job)
  # ---------------------------------------------------------------------------
  kaggle-learning:
    needs: [resolve-execution-tier]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    name: "🧠 Kaggle Empirical Learning"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: kaggle-learning
      cancel-in-progress: false
    steps:
      - name: Import Secrets from Infisical RAW Vault
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Kaggle Empirical Learning Bridge
        env:
          # The bridge imports the repository's ``core`` package. Scheduled
          # runners execute from the workspace root, but Python does not
          # guarantee that root is on sys.path for scripts/ci entrypoints.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/ci/kaggle_learning_bridge.py --self-test
          if [ -n "${KAGGLE_API_TOKENS:-}" ]; then
            echo "Kaggle pool detected - executing empirical learning distillation..."
            python scripts/ci/kaggle_learning_bridge.py --dry-run
          else
            echo "KAGGLE_API_TOKENS not configured on runner; self-test verified."
          fi

  secret-hygiene-guards:
    # Read-only: no privileged runner probe is needed for candidate rehearsals.
    name: "Secret and Naming Hygiene Guards"
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Workflow job name guard
        run: python scripts/ci/workflow_job_name_guard.py --check
      - name: Mirror drift guard (report-only)
        run: python scripts/ci/mirror_drift_guard.py
      - name: Secret hygiene guard (report-only)
        run: python scripts/ci/secret_hygiene_guard.py --check
      - name: Secret naming guard (report-only)
        run: python scripts/ci/secret_naming_guard.py --check
      - name: Secret graph regen guard (report-only)
        run: python scripts/ci/secret_graph_regen.py --check

  daily-10am-bdt-health-report:
    # Read-only: no privileged runner probe is needed for candidate rehearsals.
    name: "🩺 Full fleet health & release gate report"
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.run_daily_health_report == true || inputs.run_all == true)) ||
      ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Full fleet and cached provider health report
        if: github.ref == 'refs/heads/main'
        run: |
          python3 -c 'import yaml' || python3 -m pip install 'PyYAML==6.0.3'
          python3 scripts/ops/master_health_check.py --timeout 15 --pipeline-snapshot service-health.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save timestamped health evidence
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: service-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: service-health.json
          retention-days: 14
      - name: Report effective main branch safeguards (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protected=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')
          effective=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main")
          rules=$(jq -r '[.[].type] | unique | join(", ")' <<< "$effective")
          printf '### Main branch protection\n\n- Protected: %s\n- Effective ruleset rules: %s\n\n' \
            "$protected" "${rules:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$protected" != true ] && [ -z "$rules" ]; then
            echo '::warning::main has no visible server-side protection; workflow-based landing alone is not enforcement.'
          fi
          # Legacy protection is not described by this endpoint. Never infer it
          # from a green report or from the protected bit alone.
          missing=$(jq -r '["pull_request", "required_status_checks", "non_fast_forward", "deletion"] - [.[].type] | join(", ")' <<< "$effective")
          checks=$(jq -r '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context] | unique | join(", ")' <<< "$effective")
          printf -- '- Rules not visible in effective rulesets: %s\n- Required status contexts in rulesets: %s\n\n' \
            "${missing:-none}" "${checks:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run 5-point production release gate and append report
        run: |
          mkdir -p ci-reports
          python scripts/ci/production_release_gate.py --self-test
          python scripts/ci/production_release_gate.py \
            --check \
            --json ci-reports/daily-health-report.json \
            --markdown ci-reports/daily-health-report.md
          cat ci-reports/daily-health-report.md >> "$GITHUB_STEP_SUMMARY"

  test-local-runner:
    needs: [resolve-execution-tier]
    name: "Verify Local Self-Hosted Runner on Windows PC"
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.run_test_local_runner == true || inputs.run_all == true)) &&
      needs.resolve-execution-tier.outputs.is_local_online == 'true'
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Check Runner OS and Environment
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Hello from SupremeAI Local Self-Hosted Runner!"
          Write-Host "Host Name: $env:COMPUTERNAME"
          Write-Host "User Domain: $env:USERDOMAIN"
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "Current Directory: $(Get-Location)"
          Write-Host "=========================================="

      - name: Fast Unit Test Smoke Check
        shell: powershell
        run: |
          python -V
          pytest --version
          pytest -q tests/unit/test_telemetry_event_bus_guard.py

  evaluate-opportunistic-audit:
    needs: [resolve-execution-tier]
    name: "Evaluate 24h+ Opportunistic Audit Window"
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.run_opportunistic_audit == true || inputs.run_all == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Check 24h Timer
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ inputs.run_opportunistic_audit }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "Force run requested. Dispatching audit."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/ci/check_opportunistic_audit.py --timing-only
          fi

  execute-opportunistic-audit-local:
    needs: [resolve-execution-tier, evaluate-opportunistic-audit]
    name: "Run Opportunistic Audit (Local Self-Hosted, 0 cloud mins)"
    if: needs.evaluate-opportunistic-audit.outputs.should_run == 'true' && needs.resolve-execution-tier.outputs.is_local_online == 'true'
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run Heavy Deep Audit & Vulnerability Sweep
        shell: powershell
        run: |
          Write-Host "Executing 24h+ opportunistic audit locally on $env:COMPUTERNAME..."
          if (Test-Path .venv\Scripts\pytest.exe) { .\.venv\Scripts\pytest.exe -q tests/unit/test_telemetry_event_bus_guard.py } else { pytest -q tests/unit/test_telemetry_event_bus_guard.py }
          python scripts/ops/wiring_atlas.py --check
          python scripts/ci/nightly_repo_hygiene.py --clean-caches --git-optimize --audit-blobs --verify-client-contracts
          python scripts/ci/check_opportunistic_audit.py --record
      - name: Publish Audit Attestation
        shell: powershell
        run: Write-Host "Audit completed successfully on local machine. Timestamp recorded."

  execute-opportunistic-audit-cloud-fallback:
    needs: [resolve-execution-tier, evaluate-opportunistic-audit]
    name: "Run Emergency Audit (Cloud Fallback, SSOT tier)"
    if: needs.evaluate-opportunistic-audit.outputs.should_run == 'true' && needs.resolve-execution-tier.outputs.is_local_online != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Cloud Emergency Audit
        run: |
          echo "Local offline / tier fallback. Executing emergency audit on cloud (tier=${{ needs.resolve-execution-tier.outputs.execution_tier }})."
          python scripts/ci/check_opportunistic_audit.py --record

  redis-quota-monitor:
    name: "Redis Quota & Burn-Rate Monitor"
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_all == true) ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout monorepo mirror
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Restore alert state (persistent [BURN] history)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.supremeai/redis_quota_alert_state.json
          key: rqm-state-${{ github.run_id }}
          restore-keys: |
            rqm-state-

      - name: Run quota monitor (live; alerts -> Telegram)
        id: rqm
        env:
          RENDER_MCP_URL: ${{ vars.RENDER_MCP_URL || secrets.RENDER_MCP_URL }}
          REDIS_QUOTA_STRICT: "1"
          # 2026-11 RBAC: redis_rotation_status is role-gated — send the
          # agent-role Bearer token when configured (otherwise the monitor
          # skips honestly with exit 0 + owner-action message).
          MCP_TOWER_TOKEN: ${{ secrets.MCP_TOWER_TOKEN || secrets.MCP_TOWER_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          code=0
          base="${RENDER_MCP_URL%/}"
          if [ -z "$base" ]; then
            echo '::error::Redis quota not checked: RENDER_MCP_URL is not configured.'
            exit 3
          fi
          python scripts/ops/redis_quota_monitor.py --tower-url "${base%/mcp}/mcp" || code=$?
          echo "rqm_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ge 3 ]; then
            echo "::error::Redis quota monitor failed or could not complete (exit $code)."
            exit "$code"
          fi
          echo "monitor exit $code (0=no alert, 1=warn sent, 2=crit sent) — delivery channel is Telegram"
          exit 0

  garak-redteam:
    name: "Weekly LLM red-team lane (garak toolchain + probe inventory)"
    # hierarchy-exception: weekly garak red-team schedule lane (isolated toolchain validation)
    if: >-
