      # â”€â”€ à§©-à¦¸à§à¦¤à¦° à¦Ÿà§‡à¦¸à§à¦Ÿà¦¿à¦‚ à¦ªà§à¦²à§à¦¯à¦¾à¦¨ (Phase 4): à¦¨à¦¤à§à¦¨ à¦Ÿà§‡à¦¸à§à¦Ÿà¦¿à¦‚ à¦†à¦°à§à¦®à¦—à§à¦²à§‹à¦° à¦¡à¦¿à¦¸à¦ªà§à¦¯à¦¾à¦š à¦‡à¦¨à¦ªà§à¦Ÿ â”€â”€
      run_load_locust:
        description: 'Run Locust load-test arm (Tier-1, 100 VU Ã— 15m vs staging)'
        required: false
