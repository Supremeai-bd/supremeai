  workflow-runs-retention:
    needs: [resolve-execution-tier]
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_workflow_runs_retention == true) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * 0'))
    name: ðŸ§¹ Workflow Runs Retention & Purge
    concurrency:
      group: nightly-ops-workflow-runs-retention
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
