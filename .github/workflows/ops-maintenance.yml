          echo "::error::PRODUCTION_URL is not configured (and no FIREBASE_PROJECT_ID / RENDER_CORE_URL fallback resolvable) â€” live production path cannot be verified. Honest state: production liveness is UNVERIFIED."
          exit 1

      - name: Probe live chain (customer chain + API direct, fail-closed)
        env:
          UI_ORIGIN: ${{ env.UI_ORIGIN }}
          UI_ORIGIN_SOURCE: ${{ env.UI_ORIGIN_SOURCE }}
          API_ORIGIN: ${{ env.API_ORIGIN }}
          API_ORIGIN_SOURCE: ${{ env.API_ORIGIN_SOURCE }}
          RENDER_WORKER_URL: ${{ env.RENDER_WORKER_URL }}
          RENDER_SCRAPER_URL: ${{ env.RENDER_SCRAPER_URL }}
          RENDER_MCP_URL: ${{ env.RENDER_MCP_URL }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          # à¦¬à¦¾à¦‚à¦²à¦¾: à¦ªà§à¦°à¦¤à¦¿à¦Ÿà¦¿ à¦ªà§à¦°à§‹à¦¬à§‡à¦° à¦¬à§à¦¯à¦°à§à¦¥à¦¤à¦¾ à¦ªà§à¦°à¦®à¦¾à¦£à¦¸à¦¹ à¦°à§‡à¦•à¦°à§à¦¡ à¦¹à¦¬à§‡ â€” à¦•à§‹à¦¨à§‹ à¦¬à§à¦¯à¦¤à¦¿à¦•à§à¦°à¦® à¦šà§à¦ªà¦šà¦¾à¦ª
          # à¦—à¦¿à¦²à§‡ à¦«à§‡à¦²à¦¾ à¦¹à¦¬à§‡ à¦¨à¦¾; à¦à¦•à¦Ÿà¦¿à¦“ FAIL à¦¹à¦²à§‡ à¦ªà§à¦°à§‹ job à¦²à¦¾à¦² (fail-closed)à¥¤
          # Render free-tier cold-start (~50s) à¦¸à¦¤à§à¦¯ â€” à¦¤à¦¾à¦‡ à§¨à¦Ÿà¦¿ attempt + à¦¬à¦¡à¦¼ timeout;
          # retry à¦¬à§à¦¯à¦¬à¦¹à¦¾à¦° à¦¹à¦²à§‡ à¦Ÿà§‡à¦¬à¦¿à¦²à§‡ à¦¸à§à¦¬à¦šà§à¦›à¦­à¦¾à¦¬à§‡ à¦¨à§‹à¦Ÿ à¦¹à¦¯à¦¼ (à¦¨à§€à¦°à¦¬ à¦¨à¦¯à¦¼)à¥¤
          ui = os.environ.get("UI_ORIGIN", "").rstrip("/")
          ui_src = os.environ.get("UI_ORIGIN_SOURCE", "")
          api = os.environ.get("API_ORIGIN", "").rstrip("/")
          api_src = os.environ.get("API_ORIGIN_SOURCE", "")

          def probe(label, url, timeout, judge):
              # judge(status, body_bytes) -> note string; "FAIL:..." à¦®à¦¾à¦¨à§‡ à¦¬à§à¦¯à¦°à§à¦¥à¦¤à¦¾à¥¤
              last = None
              for attempt in (1, 2):
                  t0 = time.monotonic()
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "supremeai-live-smoke"})
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          code, body = resp.status, resp.read()
                      ms = int((time.monotonic() - t0) * 1000)
                      note = judge(code, body)
                      retry_note = " (attempt 2, cold-start retry)" if attempt == 2 else ""
                      return code, f"{ms} ms", note + retry_note
                  except urllib.error.HTTPError as exc:
                      # HTTPError-à¦“ à¦à¦•à¦Ÿà¦¿ à¦¸à¦¾à¦°à§à¦­à¦¾à¦° à¦°à§‡à¦¸à¦ªà¦¨à§à¦¸ â€” judge à¦à¦° à¦¸à¦¾à¦¥à§‡à¦‡ à¦¬à¦¿à¦šà¦¾à¦° à¦¹à§‹à¦•à¥¤
                      code, body = exc.code, exc.read()
                      ms = int((time.monotonic() - t0) * 1000)
                      note = judge(code, body)
                      retry_note = " (attempt 2, cold-start retry)" if attempt == 2 else ""
                      return code, f"{ms} ms", note + retry_note
                  except Exception as exc:  # noqa: BLE001 â€” à¦¬à§à¦¯à¦°à§à¦¥à¦¤à¦¾ à¦ªà§à¦°à¦®à¦¾à¦£à¦¸à¦¹ à¦°à§‡à¦•à¦°à§à¦¡ à¦¹à¦¬à§‡
                      last = (type(exc).__name__, str(exc))
                      if attempt == 1:
                          time.sleep(15)
              return "FAIL", "â€”", f"{last[0]}: {last[1]}"

          def j200(code, body, expect_keys=()):
              if code != 200:
                  return f"FAIL: expected 200, got {code}"
              try:
                  data = json.loads(body)
              except Exception:  # noqa: BLE001 â€” à¦¶à¦°à§€à¦°à§‡ à¦…-JSON = à¦šà§à¦•à§à¦¤à¦¿ à¦­à¦¾à¦™à¦¾
                  return "FAIL: non-JSON body"
              missing = [k for k in expect_keys if k not in data]
              if missing:
                  return f"FAIL: missing key(s) {','.join(missing)}"
              return "json ok âœ“"

          rows, failed = [], False

          def record(layer, label, url, code, latency, note):
              # à¦¬à¦¾à¦‚à¦²à¦¾: heredoc à¦¸à§à¦•à§à¦°à¦¿à¦ªà§à¦Ÿ à¦®à¦¡à¦¿à¦‰à¦²-à¦²à§‡à¦­à§‡à¦² â€” à¦¤à¦¾à¦‡ nonlocal à¦¨à¦¯à¦¼, globalà¥¤
              global failed
              if note.startswith("FAIL"):
                  failed = True
              rows.append((layer, label, url, str(code), latency, note))

          # ---- à¦¸à§à¦¤à¦° A: à¦•à¦¾à¦¸à§à¦Ÿà¦®à¦¾à¦° à¦šà§‡à¦‡à¦¨ (SPA + CORS-verified direct API call) ----
          # à¦¬à¦¾à¦‚à¦²à¦¾: à¦¬à§à¦°à¦¾à¦‰à¦œà¦¾à¦° à¦ à¦¿à¦• à¦à¦­à¦¾à¦¬à§‡à¦‡ à¦•à¦² à¦•à¦°à§‡ â€” SPA à¦²à§‹à¦¡ à¦¹à¦¯à¦¼ UI origin à¦¥à§‡à¦•à§‡, à¦¤à¦¾à¦°à¦ªà¦°
          # JS API origin-à¦ direct à¦•à¦² à¦ªà¦¾à¦ à¦¾à¦¯à¦¼ Origin à¦¹à§‡à¦¡à¦¾à¦°à¦¸à¦¹; à¦¸à¦¾à¦°à§à¦­à¦¾à¦°à¦•à§‡ à¦…à¦¬à¦¶à§à¦¯à¦‡
          # access-control-allow-origin à¦¦à¦¿à¦¯à¦¼à§‡ à¦¸à¦¾à¦¡à¦¼à¦¾ à¦¦à¦¿à¦¤à§‡ à¦¹à¦¬à§‡ (à¦¨à¦‡à¦²à§‡ à¦¬à§à¦°à¦¾à¦‰à¦œà¦¾à¦°
          # à¦°à§‡à¦¸à¦ªà¦¨à§à¦¸ à¦¬à§à¦²à¦• à¦•à¦°à§‡)à¥¤ à¦à¦Ÿà¦¿à¦‡ à¦ªà§à¦°à¦•à§ƒà¦¤ à¦ªà§à¦°à§‹à¦¡à¦¾à¦•à¦¶à¦¨ à¦ªà¦¾à¦¥ â€” same-origin rewrite à¦¨à¦¯à¦¼à¥¤
          if ui and api:
              print(f"Layer A origin (UI): {ui}  (source: {ui_src})")
              c, l, n = probe("frontend /", ui + "/", 45,
                              lambda c, b: "SPA served âœ“" if c == 200 and b[:15] == b"<!doctype html>" else f"FAIL: expected 200 SPA html, got {c}")
              record("A chain", "frontend / (SPA)", ui + "/", c, l, n)

              def cors_judge(code, body):
                  # à¦¬à¦¾à¦‚à¦²à¦¾: CORS à¦šà§à¦•à§à¦¤à¦¿ â€” Origin: UI origin à¦ªà¦¾à¦ à¦¾à¦²à§‡ à¦¸à¦¾à¦°à§à¦­à¦¾à¦°à§‡à¦°
                  # allow-origin à¦¹à§‡à¦¡à¦¾à¦° à¦…à¦¬à¦¶à§à¦¯à¦‡ à¦¸à¦¾à¦¡à¦¼à¦¾ à¦¦à§‡à¦¬à§‡; 200 JSON-à¦“ à¦²à¦¾à¦—à¦¬à§‡à¥¤
                  if code != 200:
                      return f"FAIL: expected 200, got {code}"
                  try:
                      data = json.loads(body)
                  except Exception:  # noqa: BLE001 â€” à¦…-JSON = à¦šà§à¦•à§à¦¤à¦¿ à¦­à¦¾à¦™à¦¾
                      return "FAIL: non-JSON body"
                  if "status" not in data:
                      return "FAIL: missing key(s) status"
                  return "CORS âœ“ + json ok âœ“"

              req_headers = {"User-Agent": "supremeai-live-smoke", "Origin": ui}
              last = None
              got = None
              for attempt in (1, 2):
                  t0 = time.monotonic()
                  try:
                      req = urllib.request.Request(api + "/api/v1/health/live", headers=req_headers)
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          code, body = resp.status, resp.read()
                          # à¦¬à¦¾à¦‚à¦²à¦¾: resp.headers (HTTPMessage) case-insensitive â€” dict() à¦¨à¦¯à¦¼,
                          # à¦¨à¦‡à¦²à§‡ HTTP/2-à¦à¦° lowercase à¦¹à§‡à¦¡à¦¾à¦° à¦®à¦¿à¦¸ à¦¹à¦¯à¦¼à¥¤
                          allow = resp.headers.get("Access-Control-Allow-Origin", "")
                      ms = int((time.monotonic() - t0) * 1000)
                      note = cors_judge(code, body)
                      if allow and (allow == ui or allow == "*"):
                          note = note.replace("CORS âœ“", f"CORS allow-origin={allow} âœ“")
                      elif code == 200:
                          note = "FAIL: 200 but no access-control-allow-origin for UI origin (browser would block)"
                      retry_note = " (attempt 2, cold-start retry)" if attempt == 2 else ""
                      got = (code, f"{ms} ms", note + retry_note)
                      break
                  except Exception as exc:  # noqa: BLE001 â€” à¦¬à§à¦¯à¦°à§à¦¥à¦¤à¦¾ à¦ªà§à¦°à¦®à¦¾à¦£à¦¸à¦¹ à¦°à§‡à¦•à¦°à§à¦¡ à¦¹à¦¬à§‡
                      last = (type(exc).__name__, str(exc))
                      if attempt == 1:
                          time.sleep(15)
              if got is None:
                  got = ("FAIL", "â€”", f"{last[0]}: {last[1]}")
              record("A chain", "API direct call w/ Origin (browser path)", api + "/api/v1/health/live", got[0], got[1], got[2])
          elif ui:
              # à¦¬à¦¾à¦‚à¦²à¦¾: UI origin à¦†à¦›à§‡ à¦•à¦¿à¦¨à§à¦¤à§ API origin à¦¨à§‡à¦‡ â€” SPA à¦ªà§à¦°à§‹à¦¬ à¦¹à¦¬à§‡, API à¦šà§‡à¦‡à¦¨ UNVERIFIEDà¥¤
              print(f"Layer A origin (UI): {ui}  (source: {ui_src})")
              c, l, n = probe("frontend /", ui + "/", 45,
                              lambda c, b: "SPA served âœ“" if c == 200 and b[:15] == b"<!doctype html>" else f"FAIL: expected 200 SPA html, got {c}")
              record("A chain", "frontend / (SPA)", ui + "/", c, l, n)
              rows.append(("A chain", "API direct call w/ Origin (browser path)", "(no API origin resolvable)", "SKIP", "â€”", "UNVERIFIED â€” no API origin (configure RENDER_CORE_URL in Infisical or PRODUCTION_URL)"))
          else:
              # à¦¬à¦¾à¦‚à¦²à¦¾: UI origin à¦¡à§‡à¦°à¦¾à¦‡à¦­ à¦•à¦°à¦¾ à¦¯à¦¾à¦¯à¦¼à¦¨à¦¿ â€” à¦¨à§€à¦°à¦¬ à¦ªà¦¾à¦¸ à¦¨à¦¯à¦¼; à¦¸à§à¦ªà¦·à§à¦Ÿ UNVERIFIED à¦¸à¦¾à¦°à¦¿à¥¤
              rows.append(("A chain", "frontend /", "(no UI origin resolvable)", "SKIP", "â€”", "UNVERIFIED â€” no UI origin (configure PRODUCTION_URL or FIREBASE_PROJECT_ID)"))

          # ---- à¦¸à§à¦¤à¦° B: API à¦¸à¦°à¦¾à¦¸à¦°à¦¿ ----
          if api:
              print(f"Layer B origin: {api}  (source: {api_src})")
              c, l, n = probe("health live (direct)", api + "/api/v1/health/live", 90,
                              lambda c, b: j200(c, b, ("status",)))
              record("B api-direct", "/api/v1/health/live", api + "/api/v1/health/live", c, l, n)
              c, l, n = probe("health ready (direct)", api + "/api/v1/health/ready", 90,
                              lambda c, b: j200(c, b, ("status",)))
              record("B api-direct", "/api/v1/health/ready", api + "/api/v1/health/ready", c, l, n)

              def plans_judge(code, body):
                  # à¦¬à¦¾à¦‚à¦²à¦¾: à¦šà§à¦•à§à¦¤à¦¿ â€” plans dict-shaped à¦¹à¦¬à§‡à¥¤ à¦†à¦¨à¦…à¦¥à§‡à¦¨à¦Ÿà¦¿à¦•à§‡à¦Ÿà§‡à¦¡ à¦ªà§à¦°à§‹à¦¬à§‡ à¦¸à¦šà¦²
                  # à¦®à¦¿à¦¡à¦²à¦“à¦¯à¦¼à§à¦¯à¦¾à¦° 401 à¦¦à§‡à¦¯à¦¼ (à¦°à§à¦Ÿ à¦‰à¦ªà¦¸à§à¦¥à¦¿à¦¤ + à¦¸à§Ž guard) â€” à¦‰à¦­à¦¯à¦¼à¦‡ à¦¸à§Ž à¦…à¦¬à¦¸à§à¦¥à¦¾;
                  # 404/5xx/à¦…-JSON = à¦­à¦¾à¦™à¦¾à¥¤
                  if code == 200:
                      try:
                          data = json.loads(body)
                      except Exception:  # noqa: BLE001
                          return "FAIL: non-JSON body on 200"
                      if isinstance(data, dict) and "plans" in data:
                          return "plans-key âœ“ (dict contract)"
                      return "FAIL: plans-key missing (contract drift!)"
                  if code == 401:
                      return "auth-gated âœ“ (route present, middleware honest)"
                  return f"FAIL: expected 200/401, got {code}"

              c, l, n = probe("billing plans contract", api + "/api/billing/plans", 90, plans_judge)
              record("B api-direct", "/api/billing/plans", api + "/api/billing/plans", c, l, n)
          else:
              rows.append(("B api-direct", "API probes", "(no API origin resolvable)", "SKIP", "â€”", "UNVERIFIED â€” no API origin (configure RENDER_CORE_URL in Infisical or PRODUCTION_URL)"))

          # ---- à¦¸à§à¦¤à¦° C: à¦®à¦¾à¦‡à¦•à§à¦°à§‹à¦¸à¦¾à¦°à§à¦­à¦¿à¦¸ à¦“ à¦«à§‡à¦¡à¦¾à¦°à§‡à¦¶à¦¨ à¦¨à§‹à¦¡à¦¸ (Issue #1290) ----
          worker_url = os.environ.get("RENDER_WORKER_URL", "").rstrip("/")
          scraper_url = os.environ.get("RENDER_SCRAPER_URL", "").rstrip("/")
          mcp_url = os.environ.get("RENDER_MCP_URL", "").rstrip("/")

          if worker_url:
              c, l, n = probe("worker node /health", worker_url + "/health", 45, lambda c, b: "worker alive âœ“" if c == 200 else f"FAIL: expected 200, got {c}")
              record("C microservices", "supremeai-worker-node", worker_url + "/health", c, l, n)
          else:
              rows.append(("C microservices", "supremeai-worker-node", "(no RENDER_WORKER_URL)", "SKIP", "â€”", "UNVERIFIED â€” no RENDER_WORKER_URL in Infisical"))

          if scraper_url:
              c, l, n = probe("scraper node /health", scraper_url + "/health", 45, lambda c, b: "scraper alive âœ“" if c == 200 else f"FAIL: expected 200, got {c}")
              record("C microservices", "supremeai-scraper-node", scraper_url + "/health", c, l, n)
          else:
              rows.append(("C microservices", "supremeai-scraper-node", "(no RENDER_SCRAPER_URL)", "SKIP", "â€”", "UNVERIFIED â€” no RENDER_SCRAPER_URL in Infisical"))

          if mcp_url:
              c, l, n = probe("mcp tower /health", mcp_url + "/health", 45, lambda c, b: "mcp alive âœ“" if c == 200 else f"FAIL: expected 200, got {c}")
              record("C microservices", "supremeai-mcp-tower", mcp_url + "/health", c, l, n)
          else:
              rows.append(("C microservices", "supremeai-mcp-tower", "(no RENDER_MCP_URL)", "SKIP", "â€”", "UNVERIFIED â€” no RENDER_MCP_URL in Infisical"))

          verdict = ("âœ… PASS â€” live production path verified (customer chain + API + microservices)"
                     if not failed else "âŒ FAIL â€” live production path broken")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          content = [
              "### ðŸŒ¡ï¸ Live Production Smoke",
              f"**{verdict}**",
              "",
              f"- Layer A origin: `{ui or '(none)'}` â€” source: {ui_src or '-'}",
              f"- Layer B origin: `{api or '(none)'}` â€” source: {api_src or '-'}",
              "",
              "| layer | probe | url | status | latency | note |",
              "|---|---|---|---|---|---|",
              *(("| " + " | ".join(r) + " |") for r in rows),
              "",
              "Root-cause hint: Layer A SPA FAIL = hosting/CDN issue. Layer A CORS call FAIL + Layer B PASS = the backend is alive but rejects/blocks the UI origin â€” check the API CORS config (USER_CORS_ORIGINS / CORS_ORIGINS) and the VITE_* backend URL baked into the SPA build. Layer B FAIL = API service itself down.",
              "",
          ]
          text = "\n".join(content) + "\n"
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)

          # ---- à¦®à§‡à¦¶à¦¿à¦¨-à¦ªà¦¾à¦ à¦¯à§‹à¦—à§à¦¯ production certification artifact (issue #1096) ----
          # à¦¬à¦¾à¦‚à¦²à¦¾: human table à¦¯à¦¥à§‡à¦·à§à¦Ÿ à¦¨à¦¯à¦¼ â€” release certification + CI-à¦•à§‡ à¦à¦•à¦‡
          # à¦¸à¦¤à§à¦¯ machine-readable à¦†à¦•à¦¾à¦°à§‡ à¦¦à¦°à¦•à¦¾à¦°à¥¤ à¦¨à§€à¦¤à¦¿: UNVERIFIED != PASS â€”
          # à¦ªà§à¦°à¦¤à¦¿à¦Ÿà¦¿ à¦¸à¦¾à¦°à¦¿à¦° state à¦¸à§à¦ªà¦·à§à¦Ÿ (PASS/FAIL/UNVERIFIED), provenance à¦¸à¦¹à¥¤
          # à¦à¦Ÿà¦¿ à¦•à¦®à¦¿à¦Ÿ à¦¹à¦¯à¦¼ à¦¨à¦¾ (runtime à¦¡à§‡à¦Ÿà¦¾) â€” Actions artifact à¦¹à¦¿à¦¸à§‡à¦¬à§‡ à¦¥à¦¾à¦•à§‡à¥¤
          def row_state(r):
              layer, label, url, status, latency, note = r
              if str(status) == "SKIP":
                  return "UNVERIFIED"
              if str(note).startswith("FAIL"):
                  return "FAIL"
              return "PASS"

          cert = {
              "schema_version": "1.0",
              "doctrine": "UNVERIFIED != PASS",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "verdict": "FAIL" if failed else "PASS",
              "targets": {
                  "ui_origin": {"value": ui, "source": ui_src},
                  "api_origin": {"value": api, "source": api_src},
              },
              "probes": [
                  {
                      "layer": r[0],
                      "probe": r[1],
                      "url": r[2],
                      "observed": r[3],
                      "latency": r[4],
                      "note": r[5],
                      "state": row_state(r),
                  }
                  for r in rows
              ],
              "summary": {
                  "total": len(rows),
                  "pass": sum(1 for r in rows if row_state(r) == "PASS"),
                  "fail": sum(1 for r in rows if row_state(r) == "FAIL"),
                  "unverified": sum(1 for r in rows if row_state(r) == "UNVERIFIED"),
              },
          }
          out_dir = os.environ.get("CI_REPORTS_DIR", "ci-reports")
          os.makedirs(out_dir, exist_ok=True)
          out_path = os.path.join(out_dir, "production-certification.json")
          with open(out_path, "w", encoding="utf-8") as fh:
              json.dump(cert, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          print(f"certification artifact: {out_path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Upload production certification artifact (issue #1096)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-certification-${{ github.sha }}
          path: ci-reports/production-certification.json
          retention-days: 30
          if-no-files-found: error

  db-retention:
    needs: [resolve-execution-tier]
    name: ðŸ—‘ï¸ DB Retention Prune (logs + learning store)
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_db_retention == true) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * 0'))
    concurrency:
      group: db-retention
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prune evolution_logs older than retention window
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RETENTION_DAYS: ${{ github.event.inputs.db_retention_days || '30' }}
        run: |
          set -euo pipefail
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-zA-Z0-9-]+)\.supabase\.co.*#\1#')
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] || { echo "retention_days must be a positive integer" >&2; exit 2; }
          (( RETENTION_DAYS >= 7 && RETENTION_DAYS <= 3650 )) || { echo "retention_days must be between 7 and 3650" >&2; exit 2; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "SUPABASE_ACCESS_TOKEN is required" >&2; exit 2; }
          body=$(printf '{"query":"SELECT public.prune_evolution_logs(%s::integer) AS deleted"}' "$RETENTION_DAYS")
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          # Safety valve: an unexpected purge must fail closed for review.
          MAX_DELETED=${MAX_DELETED:-50000}
          http_code=$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" --connect-timeout 10 --max-time 120 \
            -o "$response_file" -w '%{http_code}')
          [[ "$http_code" == "200" || "$http_code" == "201" ]] || { echo "Retention API returned HTTP $http_code" >&2; exit 1; }
          python - "$response_file" "$MAX_DELETED" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          # The Management API /database/query returns the rows as a bare JSON
          # array; older builds wrapped them as {"result": [...]} / {"data": [...]}.
          # Handle both shapes so the daily prune cannot crash on the envelope.
          raw = payload if isinstance(payload, list) else payload.get("result", payload.get("data", []))
          print("retention prune completed; response received")
          if isinstance(raw, list) and raw and isinstance(raw[0], dict):
              deleted = raw[0].get("deleted")
              if isinstance(deleted, (int, float)) and deleted > int(sys.argv[2]):
                  raise SystemExit(f"refusing unexpected deletion count: {deleted}")
          PY

      - name: Prune learning store tables (Sprint 2 learning_store.sql)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RETENTION_DAYS: ${{ github.event.inputs.db_retention_days || '30' }}
        run: |
          set -euo pipefail
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-zA-Z0-9-]+)\.supabase\.co.*#\1#')
          # prune_learning_data(retention_days) â€” created by
          # audit/migrations_out/learning_store.sql â€” prunes learning_events,
          # task_outcomes, feedback_events, fitness_snapshots, improvement_runs,
          # provider_metrics and skill_metrics (improvement_proposals and
          # prompt_candidates are kept). NOTE: if this function has not yet been
          # applied to prod (manual step: scripts/apply_sql.py pattern), this
          # step fails; that is intentional so the gap is visible.
          body=$(printf '{"query":"SELECT public.prune_learning_data(%s::integer) AS deleted"}' "$RETENTION_DAYS")
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_code=$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" --connect-timeout 10 --max-time 120 \
            -o "$response_file" -w '%{http_code}')
          [[ "$http_code" == "200" || "$http_code" == "201" ]] || { echo "Retention API returned HTTP $http_code" >&2; exit 1; }
          python - "$response_file" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          # Same envelope handling as step 1: bare array (current API) or
          # legacy {"result"}/{"data"} wrapper â€” both must parse.
          raw = payload if isinstance(payload, list) else payload.get("result", payload.get("data", []))
          if not (isinstance(raw, list) and raw and isinstance(raw[0], dict) and "deleted" in raw[0]):
              raise SystemExit("prune_learning_data response did not contain a deleted count")
          print("learning retention prune completed; response received")
          PY

      - name: Post-prune PostgreSQL planner statistics refresh (ANALYZE)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-zA-Z0-9-]+)\.supabase\.co.*#\1#')
          http_code=$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"ANALYZE;"}' --connect-timeout 10 --max-time 120 \
            -o /dev/null -w '%{http_code}')
          [[ "$http_code" == "200" || "$http_code" == "201" ]] || { echo "ANALYZE returned HTTP $http_code" >&2; exit 1; }
          echo "PostgreSQL ANALYZE planner refresh completed (HTTP $http_code)"

  e2e-customer:
    needs: [resolve-execution-tier]
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' # #67 Tier 2: weekly Sun off-peak (was daily)
    concurrency:
      group: nightly-ops-e2e-customer
      cancel-in-progress: true
    name: ðŸŽ­ Customer E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QA_CUSTOMER_EMAIL: ${{ secrets.QA_CUSTOMER_EMAIL }}
      QA_CUSTOMER_PASSWORD: ${{ secrets.QA_CUSTOMER_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_ADMIN_TOTP_SECRET: ${{ secrets.QA_ADMIN_TOTP_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
          install-deps: 'true'

      - name: Setup Bun (native TS script runner)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Fast Gate (checklist schema + route audit)
        run: |
          bun qa/scripts/validate-checklist.ts
          bun qa/scripts/route-audit.ts

      - name: Setup Playwright Browsers (Chromium)
        uses: ./.github/actions/setup-playwright
        with:
          browser: chromium

      - name: Determine Target Base URL
        id: target
        run: |
          STAGING="${{ secrets.STAGING_URL }}"
          if [ -n "$STAGING" ]; then
            echo "base_url=$STAGING" >> "$GITHUB_OUTPUT"
            echo "mode=remote" >> "$GITHUB_OUTPUT"
          else
            echo "mode=local-preview" >> "$GITHUB_OUTPUT"
            export VITE_USE_RELATIVE_PATH=true
            pnpm --filter supremeai-studio-client build
            pnpm --filter supremeai-studio-client exec vite preview --host 127.0.0.1 --port 3000 --strictPort &
            pnpm exec wait-on http://127.0.0.1:3000 -t 120000
            echo "base_url=http://127.0.0.1:3000" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Credentials if Project Requires Auth
        id: auth_check
        run: |
          if [ -z "$QA_CUSTOMER_EMAIL" ]; then
            echo "::warning::QA_CUSTOMER_EMAIL is unconfigured â€” credential-dependent steps skipped in scheduled runs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Playwright Suite
