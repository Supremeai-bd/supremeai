  # à§©-à¦¸à§à¦¤à¦° à¦Ÿà§‡à¦¸à§à¦Ÿà¦¿à¦‚ à¦ªà§à¦²à§à¦¯à¦¾à¦¨ (Phase 4) â€” à¦¨à¦¤à§à¦¨ à¦Ÿà§‡à¦¸à§à¦Ÿà¦¿à¦‚ à¦†à¦°à§à¦®à¦—à§à¦²à§‹
  # (Tier-1 load / Tier-2 chaos / Tier-3 browser-e2e / DB-pool health)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  load-locust:
    needs: [resolve-execution-tier]
    # #67 Tier 2: weekly Sun off-peak (was daily)
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_load_locust == true) ||
        (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    concurrency:
      group: nightly-ops-load-locust
      cancel-in-progress: false
    name: ðŸ“ˆ Locust Load Test (Tier-1, 100 VU Ã— 15m)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      STAGING_TARGET: ${{ secrets.STAGING_URL }}
      LOAD_TEST_TOKEN: ${{ secrets.LOAD_TEST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify staging target is configured (honest-skip doctrine)
        id: target
        run: |
          if [ -z "$STAGING_TARGET" ]; then
            echo "::warning::STAGING_URL is not configured â€” load test honestly SKIPPED (no fabricated numbers, cf. cloud_db_load_test doctrine)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Backend Environment
        if: steps.target.outputs.skip != 'true'
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: prepare

      # à¦¬à¦¾à¦‚à¦²à¦¾ à¦®à¦¨à§à¦¤à¦¬à§à¦¯ (Tier-1): locust dev-dep à¦¨à¦¯à¦¼ â€” à¦à¦‡ isolated job-à¦à¦‡ à¦‡à¦¨à¦¸à§à¦Ÿà¦²
      # à¦¹à¦¯à¦¼ (gevent monkey-patching à¦Ÿà§‡à¦¸à§à¦Ÿ-à¦¸à§à¦¯à§à¦‡à¦Ÿ à¦ªà§à¦°à¦¸à§‡à¦¸ à¦¥à§‡à¦•à§‡ à¦¦à§‚à¦°à§‡ à¦¥à¦¾à¦•à§‡; à¦¬à¦¿à¦¸à§à¦¤à¦¾à¦°à¦¿à¦¤
      # backend/pyproject.toml-à¦à¦° locust-à¦•à¦®à§‡à¦¨à§à¦Ÿà§‡)à¥¤
      - name: Install Locust (isolated to this runner)
        if: steps.target.outputs.skip != 'true'
        working-directory: ./backend
        run: poetry run pip install --disable-pip-version-check "locust>=2.29,<3.0"

      - name: Run Locust (100 users, 15 minutes)
        if: steps.target.outputs.skip != 'true'
        working-directory: ./backend
        run: |
          set -euo pipefail
          poetry run locust -f tests/load/locustfile.py \
            --headless --host "$STAGING_TARGET" \
            -u 100 -r 10 -t 15m \
            --csv /tmp/locust_stats --html /tmp/locust-report.html \
            --only-summary

      - name: SLO verdict from Locust CSV (p95 + failure ratio)
        if: steps.target.outputs.skip != 'true'
        working-directory: ./backend
        run: |
          set -euo pipefail
          poetry run python - <<'PY'
          import csv, os, sys

          path = "/tmp/locust_stats_stats.csv"
          if not os.path.isfile(path):
              path = "/tmp/locust_stats.csv"
          agg = None
          with open(path, newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  if row.get("Name") == "Aggregated":
                      agg = row
                      break
          if agg is None:
              print("::error::Locust Aggregated row not found â€” gate cannot verify SLOs")
              sys.exit(1)

          reqs = int(float(agg["Request Count"]))
          fails = int(float(agg["Failure Count"]))
          p95 = float(agg.get("95%") or 0.0)
          fail_ratio = (fails / reqs) if reqs else 1.0

          lines = [
              "### ðŸ“ˆ Nightly Load Test (Tier-1)",
              "",
              f"- Requests: {reqs}, Failures: {fails} ({fail_ratio:.3%})",
              f"- p95: {p95:.0f} ms (gate < 2000 ms; steady-state target p95 < 1500 ms)",
              f"- Verdict: {'PASS' if (p95 < 2000 and fail_ratio < 0.01 and reqs > 0) else 'FAIL'}",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if reqs == 0 or p95 >= 2000 or fail_ratio >= 0.01:
              sys.exit(1)
          PY

      - name: Upload Locust report
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locust-load-report
          path: |
            /tmp/locust_stats*.csv
            /tmp/locust-report.html
          retention-days: 7

