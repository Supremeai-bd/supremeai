# Nightly Ops — consolidated scheduled maintenance & audit (epic #1850 Phase B / W3, issue #1854)
# ==============================================================================================
# One workflow for every scheduled/daily/weekly/hourly maintenance duty. Each job is
# guarded by its own cron string (day-guard convention, cf. audit-release.yml) so a
# single cron firing runs exactly its own arm. NO workflow-level concurrency — per-job
# groups preserve each source workflow's isolation semantics verbatim.
#
# Migration map (old file → job here, all job bodies verbatim):
#   scheduled-deep-audit.yml deep-audit              -> deep-audit        (0 3 * * 0, #67 Tier 2 weekly)
#   scheduled-deep-audit.yml nightly-ai-safety-audit -> ai-safety         (0 3 * * *)
#   scheduled-deep-audit.yml mission-reliability-gate + passk-gate        (MERGED — one suite
#     run, gate ≥0.8 + always-published scoreboard artifact; was 2 jobs / 6 suite executions)
#                                                       -> mission-passk   (dispatch-only, #67 Tier 3)
#   qa-live-smoke.yml live-smoke                      -> live-smoke        (0 3 * * *)
#   db-retention.yml prune                            -> db-retention      (0 3 * * *)
#   platform-agent-check.yml sweep (was */3)          -> platform-sweep    (dispatch-only, #67 Tier 3)
#   rate-limit-monitor.yml check-rate-limit (hourly)  -> rate-limit-trend  (0 3 * * *)
#   stale-mutex-cleanup.yml release-stale-mutexes     -> stale-mutex       (0 3 * * *)
#   e2e-suites.yml customer suite (schedule arm; PR/dispatch arms stay in e2e-suites.yml
#     until Phase E #1857)                            -> e2e-customer      (0 3 * * 0, #67 Tier 2 weekly)
#   branch-retention-cleanup.yml cleanup              -> branch-retention  (0 3 * * *, #67 Tier 1 daily)
#   dast-zap.yml dast-gate                            -> dast              (0 3 * * 0, #67 Tier 2 weekly)
#   constitution-governance.yml validate (weekly)     -> constitution      (0 3 * * 0, #67 Tier 2 weekly)
#   audit-release.yml self-audit (weekly arm)         -> self-audit        (0 3 * * 0)
#   audit-release.yml silent-error-scan (weekly)      -> silent-error      (0 3 * * 0, #67 Tier 2 weekly)
#   deploy-doctor.yml */5 cron (D1 dissolution)       -> deploy-doctor-fallback (dormant arm, unchanged by #67;
#     event-driven if:failure() arm lands in ci.yml via #1855; manual arm = ops-console)
#
# Dedup ledger (#1854): pip-audit exactly ONE copy (deep-audit Auto Vulnerability Scanner
# --scan-deps; audit-release pip-audit-nightly deleted). pass^k exactly 3 suite
# executions/night (was 6). Sub-hourly scheduled ticks in the repo drop to the
# merge-train tick only (72/day today → 48/day after #1855).
#
# ci-doctor watch-list lockstep: absorbed workflow names removed and
# "🔧 Nightly Ops & Maintenance" added in this same change (silent-failure doctrine).

name: 🔧 Nightly Ops & Maintenance

on:
  schedule:
    # SCHEDULE DIET (v4 Private): 4-hourly fallback disabled to save quota. Kept on: workflow_dispatch and nightly bundle.
    # - cron: "0 */4 * * *"
    # nightly bundle: deep-audit + ai-safety + mission-passk + platform-sweep
    #   + platform-deep-audit + rate-limit-trend + stale-mutex + live-smoke
    #   + db-retention + workflow-runs-retention + e2e-customer  (#2860 cron bundle)
    - cron: "0 3 * * *"
    # Workflow Diet #67 (Tier 1 daily essentials): workflow-runs-retention + db-retention
    #   + live-smoke + stale-mutex + rate-limit-trend + db-pool-health + branch-retention
    # weekly bundle (Sun 03:00 off-peak, Tier 2 heavy): deep-audit + platform-deep-audit
    #   + docs-garbage-sweep + e2e-customer + load-locust + chaos-suite + browser-e2e
    #   + silent-error + dast + constitution + self-audit
    # (Mon 17 3 * * 1 cron retired by #67 — its arms moved to Sunday Tier 2 / daily Tier 1)
    # Daily health report shares the 03:00 UTC nightly bundle (09:00 Bangladesh).
    # Redis Quota & Burn-rate Monitor (every 30 min at :13/:43 UTC)
    # Weekly LLM Red-Team Garak sweep (Mon 03:00 UTC)
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run ALL jobs at once (manual full sweep)"
        required: false
        default: false
        type: boolean
      run_garak_redteam:
        description: 'Run weekly LLM red-team garak sweep arm'
        required: false
        default: false
        type: boolean
      run_daily_health_report:
        description: 'Run full fleet health and 5-point production release gate report'
        required: false
        default: false
        type: boolean
      run_deep_audit:
        description: 'Run deep-audit (heavy analysis) arm'
        required: false
        default: false
        type: boolean
      run_ai_safety:
        description: 'Run AI safety & system integrity audit arm'
        required: false
        default: false
        type: boolean
      run_passk:
        description: 'Run mission pass^k reliability gate arm'
        required: false
        default: false
        type: boolean
      run_live_smoke:
        description: 'Run live production smoke arm'
        required: false
        default: false
        type: boolean
      run_db_retention:
        description: 'Run DB retention prune arm'
        required: false
        default: false
        type: boolean
      run_stale_mutex:
        description: 'Run stale mutex cleanup arm'
        required: false
        default: false
        type: boolean
      run_platform_sweep:
        description: 'Run platform agent sweep arm'
        required: false
        default: false
        type: boolean
      run_platform_deep_audit:
        description: 'Run platform deep-audit (vault-driven discovery + auto-issue) arm'
        required: false
        default: false
        type: boolean
      # NOTE (2026-11-24): graph-health-sweep has NO dispatch toggle — this file is
      # already at the GitHub 25-input hard cap (test_workflow_validity_guard).
      # Manual trigger: run the whole nightly bundle via workflow_dispatch, or run
      # locally: python scripts/ci/sync_graph_to_memory.py --audit
      run_docs_garbage_sweep:
        description: 'Run docs garbage tree-sweep arm (#4176 — main-tree Zero-Garbage monitoring)'
        required: false
        default: false
        type: boolean
      run_rate_limit_trend:
        description: 'Run rate-limit trend snapshot arm'
        required: false
        default: false
        type: boolean
      run_branch_retention:
        description: 'Run branch retention cleanup arm'
        required: false
        default: false
        type: boolean
      run_dast:
        description: 'Run DAST ZAP gate arm'
        required: false
        default: false
        type: boolean
      run_constitution:
        description: 'Run constitution governance validation arm'
        required: false
        default: false
        type: boolean
      run_self_audit:
        description: 'Run weekly self-audit scan arm'
        required: false
        default: false
        type: boolean
      run_silent_error:
        description: 'Run silent error scan arm'
        required: false
        default: false
        type: boolean
      run_workflow_runs_retention:
        description: 'Run workflow runs retention & stale log purge arm'
        required: false
        default: false
        type: boolean
      # ── ৩-স্তর টেস্টিং প্ল্যান (Phase 4): নতুন টেস্টিং আর্মগুলোর ডিসপ্যাচ ইনপুট ──
      run_load_locust:
        description: 'Run Locust load-test arm (Tier-1, 100 VU × 15m vs staging)'
        required: false
        default: false
        type: boolean
      run_chaos_suite:
        description: 'Run chaos resilience suite arm (Tier-2, -m chaos)'
        required: false
        default: false
        type: boolean
      run_browser_e2e:
        description: 'Run real-browser E2E arm (Tier-3, tests/browser -m e2e)'
        required: false
        default: false
        type: boolean
      run_db_pool_health:
        description: 'Run DB/pool health probe arm (pgBouncer/quota report)'
        required: false
        default: false
        type: boolean
      run_opportunistic_audit:
        description: 'Run 24h+ opportunistic deep audit & wiring atlas check'
        required: false
        default: false
        type: boolean
      run_test_local_runner:
        description: 'Verify and smoke-test Local Self-Hosted Runner on Windows PC'
        required: false
        default: false
        type: boolean

# Least privilege: workflow-wide read-only; jobs carry their own overrides
# (issues:write for issue-opening arms, contents:write for branch retention,
# security-events:write for constitution SARIF — each verbatim from its source).
permissions:
  contents: read

# QUEUE STORM FIX: workflow-level concurrency. Nightly jobs are idempotent but
# long-running; cancel-in-progress: false ensures a 2nd dispatch does NOT kill
# an in-flight nightly (which could leave partial state). Multiple dispatches
# queue serially. Per-job cron guards already ensure only the matching arm runs.
concurrency:
  group: nightly-ops
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  # =========================================================================
  # STAGE 0: 4-LEVEL RUNNER HIERARCHY PREFLIGHT (<10s)
  # SSOT Invariant: Every pipeline must execute this check FIRST before any heavy job.
  # Resolves Priority 1 (Local PC: 0m) -> Priority 2 (Render CI) -> Priority 3 -> Priority 4 (Emergency)
  # =========================================================================
  resolve-execution-tier:
    if: github.ref == 'refs/heads/main'
    name: "Tier 1: 4-Level Runner Hierarchy Preflight (<10s)"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      execution_tier: ${{ steps.runner-check.outputs.execution_tier }}
      is_local_online: ${{ steps.runner-check.outputs.is_local_online }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check 4-Level Execution Hierarchy
        id: runner-check
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          ALLOW_LOCAL_CI: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/resolve_execution_tier.py

  deep-audit-local:
    needs: [resolve-execution-tier]
    # Local-first (Zero Cloud Waste): run weekly deep-audit on self-hosted PC when online.
    if: >-
        needs.resolve-execution-tier.outputs.is_local_online == 'true' &&
        ((github.event_name == 'workflow_dispatch' && (inputs.run_deep_audit == true || inputs.run_all == true)) ||
         ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true)))
    concurrency:
      group: nightly-ops-deep-audit
      cancel-in-progress: false
    name: 🔍 Deep Audit (Local Self-Hosted, 0 cloud mins)
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/poetry.lock
            requirements*.txt

      - name: Install base dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install astroid loguru requests httpx pyyaml

      - name: Duplicate Logic Detector
        id: duplicate_detector
        shell: powershell
        run: python scripts/advanced_analysis/duplicate_detector.py --fail-on-critical --max-findings 50 --engine file_level import

      - name: Feature Parity Sentinel (backend ⇄ frontend drift)
        id: parity_sentinel
        shell: powershell
        run: |
          python scripts/ops/feature_parity_sentinel.py `
            --baseline scripts/ops/feature_parity_baseline.json `
            --json ci-reports/feature-parity-report.json `
            --markdown ci-reports/feature-parity-report.md

      - name: Install Vulnerability Scanner Deps
        id: scanner_setup
        if: ${{ !cancelled() }}
        shell: powershell
        run: pip install pip-audit "bandit[sarif]" httpx loguru pydantic

      - name: Auto Vulnerability Scanner (deps + code + SBOM)
        id: vuln_scanner
        if: ${{ !cancelled() && steps.scanner_setup.outcome == 'success' }}
        shell: powershell
        run: python scripts/ops/security/auto_vulnerability_scanner.py --scan-deps --scan-code --generate-sbom

      - name: Upload vulnerability scan evidence
        if: ${{ !cancelled() && steps.vuln_scanner.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-scan-local-${{ github.sha }}
          path: reports/security/vuln-scan-*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Mutation Testing
        id: mutation_testing
        continue-on-error: true
        shell: powershell
        run: python scripts/testing/mutation_testing.py --target core/health_check.py --threshold 0 # wiring audit 2026-11-11: backend/ → core/

      - name: Performance Benchmark
        id: perf_benchmark
        continue-on-error: true
        shell: powershell
        run: python scripts/testing/performance_benchmark.py --target api

      - name: Blocking security detectors (P0/P1)
        id: blocking_security_detectors
        shell: powershell
        run: |
          python scripts/advanced_analysis/blocking_call_detector.py
          python scripts/advanced_analysis/bola_idor_detector.py
          python scripts/ci/webhook_signature_checker.py
          python scripts/ci/rate_limit_endpoint_checker.py
          python scripts/ci/rls_rbac_auditor.py

      - name: Backend dead-code scan (vulture)
        continue-on-error: true
        shell: powershell
        run: |
          pip install vulture
          python scripts/security/find_dead_code.py

      - name: Generate Smart Audit Summary
        if: always()
        shell: powershell
        run: python scripts/ci/generate_audit_summary.py

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        shell: powershell
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:DISPATCH_TOKEN"; Accept = "application/vnd.github+json" }
          $body = @{ event_type = "federation_ci_failed"; client_payload = @{ repo = "${{ github.repository }}"; workflow_name = "${{ github.workflow }}"; run_id = "${{ github.run_id }}"; html_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; branch = "${{ github.ref_name }}"; commit_sha = "${{ github.sha }}" } } | ConvertTo-Json -Depth 5
          try { Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/Supremeai-bd/supremeai/dispatches" -Headers $headers -Body $body } catch { Write-Host "Watchdog dispatch failed (non-blocking): $_" }

  deep-audit:
    needs: [resolve-execution-tier]
    # Cloud fallback only: runs when local PC is NOT online (Zero Cloud Waste invariant).
    # #67 Tier 2: weekly Sun off-peak (was daily)
    if: >-
        needs.resolve-execution-tier.outputs.is_local_online != 'true' &&
        ((github.event_name == 'workflow_dispatch' && (inputs.run_deep_audit == true || inputs.run_all == true)) ||
         ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true)))
    concurrency:
      group: nightly-ops-deep-audit
      cancel-in-progress: false
    name: 🔍 Deep Audit (cloud fallback)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      # বাংলা মন্তব্য: লোকাল composite action লোডের আগেই checkout প্রয়োজন।
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/deep-audit
        with:
          tier: ${{ needs.resolve-execution-tier.outputs.execution_tier }}
          supremeai_base_url: ${{ secrets.SUPREMEAI_BASE_URL }}
          dispatch_token: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
  ai-safety:
    needs: [resolve-execution-tier]
    # #67 Tier 3: dispatch-only (AI safety evaluations on demand)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run_ai_safety == true || inputs.run_all == true))
    concurrency:
      group: nightly-ops-ai-safety
      cancel-in-progress: false
    name: 🛡️ AI Safety & System Integrity Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/poetry.lock
            requirements*.txt

      - name: Install dependencies
        run: pip install requests httpx pydantic loguru

      - name: AI Memory Integrity Audit
        run: python scripts/advanced_analysis/ai_memory_integrity_audit.py

      - name: Embedding Model Drift Detector
        run: python scripts/advanced_analysis/embedding_drift_detector.py

      - name: Queue Health Checker (DLQ audit)
        run: python scripts/advanced_analysis/queue_health_checker.py

      - name: Metrics Cardinality Auditor
        run: python scripts/advanced_analysis/metrics_cardinality_auditor.py

      - name: Agent Loop Limiter Guard (Trap #15)
        run: python scripts/advanced_analysis/agent_loop_limiter_check.py

  mission-passk:
    needs: [resolve-execution-tier]
    # #67 Tier 3: dispatch-only (PassK benchmarks on demand)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run_passk == true || inputs.run_all == true))
    concurrency:
      group: nightly-ops-mission-passk
      cancel-in-progress: false
    name: 🎯 Mission Reliability Gate (pass^3 ≥ 0.8) + Nightly Scoreboard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write

    # বাংলা মন্তব্য (audit V3 fix, 2026-09-17): আগে এই জবে postgres+redis
    # service container ছিল, কিন্তু conftest `app` fixture sqlite test.db ইনজেক্ট
    # করে এবং `missions_api_tables` fixture sqlite backend assert করে — ফলে
    # ambient DATABASE_URL=postgres হলে TestMissionsAPI-র ৭টি টেস্ট setup-এ
    # ERROR হতো (প্রতি রাতে pass^3=0.6699 < 0.8, ৩ run-এই অভিন্ন 50/57)।
    # লোকাল প্রমাণ: DATABASE_URL=sqlite+aiosqlite দিলে suite ৫৭/৫৭ green।
    # তাই service container বাদ + স্পষ্ট sqlite URL — gate এখন সৎভাবে চলবে।
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: prepare

      - name: Mission suite pass^k nightly gate
        id: mission_gate
        working-directory: ./core
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/core
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: |
          python ../scripts/ci/mission_passk.py --k 3 --min-pass-hat-k 0.8

      - name: Publish gate result to step summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("reports/mission_passk.json")
          if not report.is_file():
              print("No mission_passk.json produced — gate harness itself is broken")
              raise SystemExit(0)
          data = json.loads(report.read_text(encoding="utf-8"))
          verdict = "PASS" if data["gate"]["passed"] else "FAIL"
          line = (
              f"Mission pass^{data['k']} = {data['pass_hat_k']} "
              f"(n={data['n']}, successes_all_runs={data['successes_all_runs']}, "
              f"gate≥{data['gate']['threshold']}) → **{verdict}**"
          )
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"### 🎯 Nightly Reliability Gate\n\n{line}\n")
          PY

      - name: Open/update reliability issue on gate failure
        if: ${{ failure() }}
        uses: actions/github-script@v8 # v9.0.0
        with:
          script: |
            const title = "🎯 Mission Reliability Gate failed (pass^k < 0.8)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "স্বয়ংক্রিয়ভাবে তৈরি — nightly Mission Reliability Gate ব্যর্থ হয়েছে:",
              "- Mission suite pass^k estimator এর threshold (0.8) এর নিচে নেমেছে",
              `- রান ও লগ: ${runUrl}`,
              "- report artifact: mission-passk-report",
              "",
              "Constitution #5: pass^3 ≥ 0.8 ছাড়া কোনো পরিবর্তন promote করা যাবে না।",
              "পরের nightly run-এ গেট পাস করলে এই ইস্যু auto-close হবে।",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scheduled-audit",
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["scheduled-audit", "reliability"],
              });
            }

      - name: Auto-close reliability issue on gate pass
        if: ${{ success() }}
        uses: actions/github-script@v8 # v9.0.0
        with:
          script: |
            const title = "🎯 Mission Reliability Gate failed (pass^k < 0.8)";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scheduled-audit",
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: "✅ সর্বশেষ nightly run-এ Mission Reliability Gate পাস করেছে — ইস্যু বন্ধ করা হচ্ছে।",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: "closed",
              });
            }
      - name: Upload pass^k scoreboard artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mission-passk-nightly-${{ github.sha }}
          path: reports/mission_passk.json
          if-no-files-found: ignore

  platform-sweep:
    needs: [resolve-execution-tier]
    name: 🧹 Platform Sweep (nightly, dispatch-only)
    # #67 Tier 3: dispatch-only (deep platform sweeps on demand)
