  dast:
    needs: [resolve-execution-tier]
    # Temporarily disabled: no authorized staging target is available.
    # Do not scan production. Re-enable only with an authorized staging URL,
    # after reviewing the target checks and scan configuration.
    if: false
    concurrency:
      group: dast-zap-${{ github.ref }}
      cancel-in-progress: true
    name: 🔎 OWASP ZAP API + Full scan (blocking)
    runs-on: ubuntu-24.04
    env:
      # (#4276) dast_base_url dispatch-input বাদ — 25-input ক্যাপ ভাঙছিল (পুরো
      # workflow invalid → সব nightly arm 0-jobs failure)। ZAP টার্গেট এখন সরাসরি
      # SSOT repo var STAGING_BASE_URL থেকে (আগেও default fallback এটাই ছিল;
      # custom override দরকার হলে vars.STAGING_BASE_URL এডিট করা হবে)।
      ZAP_TARGET: ${{ vars.STAGING_BASE_URL }}
    timeout-minutes: 45
    steps:
      - name: Require scan target
        if: env.ZAP_TARGET == ''
        run: |
          echo "::error::STAGING_BASE_URL repo variable is required."
          echo "::error::Refusing to scan without an explicit environment."
          exit 1

      - uses: actions/checkout@v5 # v7.0.1

      - name: Validate authorized staging target syntax
        run: |
          python - <<'PY'
          import os, re, sys
          from urllib.parse import urlsplit
          value = os.environ['ZAP_TARGET']
          parsed = urlsplit(value)
          if (not re.fullmatch(r'https?://[A-Za-z0-9.\-]+(?::[0-9]+)?(?:/[A-Za-z0-9._~/-]*)?', value)
                  or not parsed.hostname or parsed.username or parsed.password):
              print('::error::STAGING_BASE_URL must be an explicit HTTP(S) staging URL without credentials, query or fragment.')
              sys.exit(1)
          PY

      - name: ZAP Full scan (baseline)
        uses: zaproxy/action-full-scan@4f7523a09110bc63d6b349713de6aa697ec7fbe9
        with:
          target: '${{ env.ZAP_TARGET }}'
          fail_action: true # ⚠️ blocking gate
          artifact_name: zap-full-scan

      - name: ZAP API scan (OpenAPI spec 🎯 auth endpoints)
        uses: zaproxy/action-api-scan@472970930c47c2e1a7394c6b62c83b5f8e6b479a
        with:
          target: core/API-swagger.yaml
          format: openapi
          cmd_options: '-O ${{ env.ZAP_TARGET }}'
          fail_action: true # ⚠️ blocking gate
          artifact_name: zap-api-scan

      - name: Upload ZAP reports (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: reports/
          if-no-files-found: ignore

      - name: Summarize gate result
        if: always()
        run: |
          echo "## DAST Gate (OWASP ZAP)"
          echo "- Target: ${{ env.ZAP_TARGET }}"
          echo "- Reports uploaded as artifact: zap-reports"
          echo "- Post-scan IDOR/business-logic rules: tracked in SECURITY_AUDIT_MATRIX.md P8"

  production-passive-baseline:
    # Manual, branch-only rehearsal: not scheduled and never enabled by run_all.
    # Legacy full/API ZAP job above stays disabled and staging-only.
    if: false
    name: "Production ZAP passive root inspection (no spider)"
