  db-pool-health:
    needs: [resolve-execution-tier]
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_db_pool_health == true) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * 0'))
    concurrency:
      group: nightly-ops-db-pool-health
      cancel-in-progress: false
    name: ðŸ—„ï¸ DB & Pool Health Probe (pgBouncer/quota report)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      STAGING_TARGET: ${{ secrets.STAGING_URL }}
      LOAD_TEST_TOKEN: ${{ secrets.LOAD_TEST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # à¦¬à¦¾à¦‚à¦²à¦¾ à¦®à¦¨à§à¦¤à¦¬à§à¦¯ (Tier-1/plan): à¦†à¦—à§‡ pgBouncer à¦¹à§‡à¦²à¦¥ CI-à¦¤à§‡ à¦›à¦¿à¦² à¦¨à¦¾ â€” à¦¶à§à¦§à§
      # SLO à¦¡à¦•à§‡ 'Supabase dashboard à¦¦à§‡à¦–à§‹' à¦²à§‡à¦–à¦¾ à¦›à¦¿à¦²à¥¤ à¦à¦–à¦¨ /health/ready +
      # /health/full à¦ªà§à¦°à§‹à¦¬ à¦•à¦°à§‡ DB à¦•à¦®à§à¦ªà§‹à¦¨à§‡à¦¨à§à¦Ÿà§‡à¦° à¦…à¦¬à¦¸à§à¦¥à¦¾ à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦¹à¦¯à¦¼; degraded
      # à¦¹à¦²à§‡ job à¦¬à§à¦¯à¦°à§à¦¥à¥¤ à¦Ÿà¦¾à¦°à§à¦—à§‡à¦Ÿ/à¦Ÿà§‹à¦•à§‡à¦¨ à¦¨à¦¾ à¦¥à¦¾à¦•à¦²à§‡ à¦¸à§Ž à¦¸à§à¦•à¦¿à¦ªà¥¤
      - name: Probe /health/ready + /health/full (DB components)
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          base = os.environ.get("STAGING_TARGET", "").rstrip("/")
          token = os.environ.get("LOAD_TEST_TOKEN", "")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          if not base:
              print("::warning::STAGING_URL not configured â€” DB pool health honestly SKIPPED.")
              if summary:
                  with open(summary, "a", encoding="utf-8") as h:
                      h.write("### ðŸ—„ï¸ DB & Pool Health\n\n_SKIPPED â€” STAGING_URL not configured_\n")
              sys.exit(0)

          def probe(path, with_auth):
              req = urllib.request.Request(base + path)
              if with_auth and token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8") or "{}")
              except Exception as exc:
                  return 0, {"error": str(exc)}

          ready_code, ready = probe("/health/ready", False)
          full_code, full = probe("/health/full", True)

          lines = ["### ðŸ—„ï¸ DB & Pool Health", "", f"- /health/ready: HTTP {ready_code}", f"- /health/full: HTTP {full_code}"]
          db_status = "unknown"
          components = full.get("components") or full.get("checks") or {}
          if isinstance(components, dict):
              db_comp = components.get("database") or components.get("db") or {}
              if isinstance(db_comp, dict):
                  db_status = str(db_comp.get("status", "unknown"))
                  lines.append(f"- database component: **{db_status}**")
              for key in ("memory", "redis"):
                  comp = components.get(key)
                  if isinstance(comp, dict):
                      lines.append(f"- {key} component: {comp.get('status', 'unknown')}")
          overall = full.get("status", "unknown")
          lines.append(f"- overall: **{overall}**")
          print("\n".join(lines))
          if summary:
              with open(summary, "a", encoding="utf-8") as h:
                  h.write("\n".join(lines) + "\n")

          if ready_code != 200:
              print(f"::error::/health/ready returned {ready_code}")
              sys.exit(1)
          if str(db_status).lower() in ("down", "unhealthy", "error") or str(overall).lower() in ("unhealthy", "down"):
              print("::error::DB component degraded â€” see summary")
              sys.exit(1)
          PY

