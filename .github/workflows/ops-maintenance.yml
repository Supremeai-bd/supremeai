  branch-retention:
    needs: [resolve-execution-tier]
    name: ðŸŒ¿ Branch Retention Cleanup
    # #67 Tier 1: daily storage tidy (was Mon weekly)
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_branch_retention == true) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * 0'))
    concurrency:
      group: branch-retention-cleanup
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply retention policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: "7"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Retention window: ${RETENTION_DAYS} days"
          CUTOFF=$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          OWNER="${REPO%%/*}"

          # #2124: paginate both calls â€” repo is at 100 branches, per_page=100
          # misses anything beyond that as the pool grows.
          open_heads=$(gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[].head.ref' | sort -u || true)

          deleted=0; skipped=0
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            case "$branch" in
              main|develop|master) skipped=$((skipped+1)); continue ;;
              # #2124: protect CURRENT slot convention (coder-N, super-N, planner-N,
              # ci-N, pr-helper-N, browser-N, platform-N) â€” 1-2 digit N only.
              # Legacy agent-N-* branches are NOT protected (they are stale and
              # should be pruned). Legacy coder-<issue_number> (4+ digits) is
              # also NOT protected.
              coder-[0-9]|coder-[0-9][0-9]|\
              super-[0-9]|super-[0-9][0-9]|\
              planner-[0-9]|planner-[0-9][0-9]|\
              ci-[0-9]|ci-[0-9][0-9]|\
              pr-helper-[0-9]|pr-helper-[0-9][0-9]|\
              browser-[0-9]|browser-[0-9][0-9]|\
              platform-[0-9]|platform-[0-9][0-9]) skipped=$((skipped+1)); continue ;;
            esac
            if grep -qx "$branch" <<< "$open_heads"; then skipped=$((skipped+1)); continue; fi

            # Squash-merge-safe merged check: the branch counts as merged only
            # if a CLOSED PR with this head was actually MERGED into the base.
            merged=$(gh api "repos/${REPO}/pulls?head=${OWNER}:${branch}&state=closed&per_page=5" \
              --jq '[.[].merged] | any' 2>/dev/null || echo false)
            if [[ "$merged" != "true" ]]; then skipped=$((skipped+1)); continue; fi

            last_commit_date=$(gh api "repos/${REPO}/branches/${branch}" --jq '.commit.commit.committer.date')
            if [[ "$last_commit_date" < "$CUTOFF" ]]; then
              gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}" >/dev/null && \
                { echo "deleted: ${branch} (merged via PR, last commit ${last_commit_date})"; deleted=$((deleted+1)); }
            else
              skipped=$((skipped+1))
            fi
          done < <(gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' | grep -v '^chore/artifact-regen-')

          echo "Summary: deleted=${deleted} skipped=${skipped}"

