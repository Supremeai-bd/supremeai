# Least privilege: workflow-wide read-only; jobs carry their own overrides
# (issues:write for issue-opening arms, contents:write for branch retention,
# security-events:write for constitution SARIF â€” each verbatim from its source).
permissions:
  contents: read
  issues: write

# QUEUE STORM FIX: workflow-level concurrency. Nightly jobs are idempotent but
# long-running; cancel-in-progress: false ensures a 2nd dispatch does NOT kill
# an in-flight nightly (which could leave partial state). Multiple dispatches
# queue serially. Per-job cron guards already ensure only the matching arm runs.
concurrency:
  group: nightly-ops
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  # =========================================================================
  # STAGE 0: 4-LEVEL RUNNER HIERARCHY PREFLIGHT (<10s)
  # SSOT Invariant: Every pipeline must execute this check FIRST before any heavy job.
  # Resolves Priority 1 (Local PC: 0m) -> Priority 2 (Render CI) -> Priority 3 -> Priority 4 (Emergency)
  # =========================================================================
  resolve-execution-tier:
    name: "Tier 1: 4-Level Runner Hierarchy Preflight (<10s)"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      execution_tier: ${{ steps.runner-check.outputs.execution_tier }}
      is_local_online: ${{ steps.runner-check.outputs.is_local_online }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check 4-Level Execution Hierarchy
        id: runner-check
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/resolve_execution_tier.py

  deep-audit-local:
    needs: [resolve-execution-tier]
    # Local-first (Zero Cloud Waste): run weekly deep-audit on self-hosted PC when online.
    if: >-
        needs.resolve-execution-tier.outputs.is_local_online == 'true' &&
        ((github.event_name == 'workflow_dispatch' && inputs.run_deep_audit == true) ||
         (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'))
    concurrency:
      group: nightly-ops-deep-audit
      cancel-in-progress: false
    name: ðŸ” Deep Audit (Local Self-Hosted, 0 cloud mins)
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/poetry.lock
            requirements*.txt

      - name: Install base dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install astroid loguru requests httpx pyyaml

      - name: Duplicate Logic Detector
        id: duplicate_detector
        shell: powershell
        run: python scripts/advanced_analysis/duplicate_detector.py --fail-on-critical --max-findings 50 --engine file_level import

      - name: Feature Parity Sentinel (backend â‡„ frontend drift)
        id: parity_sentinel
        shell: powershell
        run: |
          python scripts/ops/feature_parity_sentinel.py `
            --baseline scripts/ops/feature_parity_baseline.json `
            --json ci-reports/feature-parity-report.json `
            --markdown ci-reports/feature-parity-report.md

      - name: Install Vulnerability Scanner Deps
        shell: powershell
        run: pip install pip-audit "bandit[sarif]" httpx loguru pydantic

      - name: Auto Vulnerability Scanner (deps + code + SBOM)
        id: vuln_scanner
        shell: powershell
        run: python scripts/ops/security/auto_vulnerability_scanner.py --scan-deps --scan-code --generate-sbom

      - name: Mutation Testing
        id: mutation_testing
        continue-on-error: true
        shell: powershell
        run: python scripts/testing/mutation_testing.py --target core/health_check.py --threshold 0 # wiring audit 2026-11-11: backend/ â†’ core/

      - name: Performance Benchmark
        id: perf_benchmark
        continue-on-error: true
        shell: powershell
        run: python scripts/testing/performance_benchmark.py --target api

      - name: Blocking security detectors (P0/P1)
        id: blocking_security_detectors
        shell: powershell
        run: |
          python scripts/advanced_analysis/blocking_call_detector.py
          python scripts/advanced_analysis/bola_idor_detector.py
          python scripts/ci/webhook_signature_checker.py
          python scripts/ci/rate_limit_endpoint_checker.py
          python scripts/ci/rls_rbac_auditor.py

      - name: Backend dead-code scan (vulture)
        continue-on-error: true
        shell: powershell
        run: |
          pip install vulture
          python scripts/security/find_dead_code.py

      - name: Generate Smart Audit Summary
        if: always()
        shell: powershell
        run: python scripts/ci/generate_audit_summary.py

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        shell: powershell
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:DISPATCH_TOKEN"; Accept = "application/vnd.github+json" }
          $body = @{ event_type = "federation_ci_failed"; client_payload = @{ repo = "${{ github.repository }}"; workflow_name = "${{ github.workflow }}"; run_id = "${{ github.run_id }}"; html_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; branch = "${{ github.ref_name }}"; commit_sha = "${{ github.sha }}" } } | ConvertTo-Json -Depth 5
          try { Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/Supremeai-bd/supremeai/dispatches" -Headers $headers -Body $body } catch { Write-Host "Watchdog dispatch failed (non-blocking): $_" }

  deep-audit:
    needs: [resolve-execution-tier]
    # Cloud fallback only: runs when local PC is NOT online (Zero Cloud Waste invariant).
    # #67 Tier 2: weekly Sun off-peak (was daily)
    if: >-
        needs.resolve-execution-tier.outputs.is_local_online != 'true' &&
        ((github.event_name == 'workflow_dispatch' && inputs.run_deep_audit == true) ||
         (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'))
    concurrency:
      group: nightly-ops-deep-audit
      cancel-in-progress: false
    name: ðŸ” Deep Audit (cloud fallback)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/poetry.lock
            requirements*.txt

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astroid loguru requests httpx pyyaml

      - name: Duplicate Logic Detector
        id: duplicate_detector
        run: python scripts/advanced_analysis/duplicate_detector.py --fail-on-critical --max-findings 50 --engine file_level import

      # à¦¬à¦¾à¦‚à¦²à¦¾: Backend â‡„ Frontend feature-parity drift à¦¸à§‡à¦¨à§à¦Ÿà¦¿à¦¨à§‡à¦² â€” baseline-à¦à¦° à¦¬à¦¾à¦‡à¦°à§‡
      # à¦¨à¦¤à§à¦¨ mismatch (unmounted router, path drift, dead link, ghost UI) à¦¹à¦²à§‡ job failà¥¤
      # à¦¬à¦¿à¦¸à§à¦¤à¦¾à¦°à¦¿à¦¤: docs/architecture/BACKEND_FRONTEND_FEATURE_PARITY_AUDIT.md
      - name: Feature Parity Sentinel (backend â‡„ frontend drift)
        id: parity_sentinel
        run: |
          python scripts/ops/feature_parity_sentinel.py \
            --baseline scripts/ops/feature_parity_baseline.json \
            --json ci-reports/feature-parity-report.json \
            --markdown ci-reports/feature-parity-report.md

      - name: Install Vulnerability Scanner Deps
        run: pip install pip-audit "bandit[sarif]" httpx loguru pydantic

      - name: Auto Vulnerability Scanner (deps + code + SBOM)
        id: vuln_scanner
        run: python scripts/ops/security/auto_vulnerability_scanner.py --scan-deps --scan-code --generate-sbom

      - name: Mutation Testing
        id: mutation_testing
        # Advisory (non-blocking): experimental mutation testing â€” publish visible failure summary, not green.
        continue-on-error: true
        run: python scripts/testing/mutation_testing.py --target core/health_check.py --threshold 0 # wiring audit 2026-11-11: backend/ â†’ core/

      - name: Performance Benchmark
        id: perf_benchmark
        # Advisory (non-blocking): performance baselines â€” collect â‰¥14 nights of data before removing continue-on-error.
        continue-on-error: true
        run: python scripts/testing/performance_benchmark.py --target api

      # à¦¬à¦¾à¦‚à¦²à¦¾ à¦®à¦¨à§à¦¤à¦¬à§à¦¯ (à§©-à¦¸à§à¦¤à¦° à¦Ÿà§‡à¦¸à§à¦Ÿà¦¿à¦‚ à¦ªà§à¦²à§à¦¯à¦¾à¦¨ Phase 4): à¦¬à§‡à¦žà§à¦šà¦®à¦¾à¦°à§à¦• à¦«à¦²à¦¾à¦«à¦² step-summary-à¦¤à§‡
      # à¦¸à§à¦ªà¦·à§à¦Ÿà¦­à¦¾à¦¬à§‡ à¦ªà§à¦°à¦•à¦¾à¦¶ à¦•à¦°à¦¾ à¦¹à¦²à§‹à¥¤ continue-on-error à¦‡à¦šà§à¦›à¦¾à¦•à§ƒà¦¤ â€” à¦¬à§‡à¦¸à¦²à¦¾à¦‡à¦¨ à¦¸à¦‚à¦—à§à¦°à¦¹à§‡à¦° à¦ªà¦°à§‡à¦‡
      # à¦°à§à¦¯à¦¾à¦šà§‡à¦Ÿ-à¦—à§‡à¦Ÿ à¦¹à¦¬à§‡ (à¦ªà¦°à¦¿à¦•à¦²à§à¦ªà¦¨à¦¾-à¦¨à¦¥à¦¿à¦¤ à¦¡à¦•à§à¦®à§‡à¦¨à§à¦Ÿà§‡à¦¡); à¦†à¦ªà¦¾à¦¤à¦¤ 'à¦¸à¦¬à§à¦œ CI à¦•à¦¿à¦¨à§à¦¤à§ à¦®à§‡à¦Ÿà§à¦°à¦¿à¦• à¦…à¦¦à§ƒà¦¶à§à¦¯'
      # à¦¸à¦®à¦¸à§à¦¯à¦¾à¦Ÿà¦¿ à¦¦à§‚à¦° à¦¹à¦²à§‹à¥¤
      - name: Performance Benchmark â†’ Step Summary
        if: always() && steps.perf_benchmark.outcome != 'skipped'
        run: |
          echo "### âš¡ Nightly Performance Benchmark (advisory)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: \`${{ steps.perf_benchmark.outcome }}\` (continue-on-error â€” advisory until baseline ratchet lands)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SLO ladder (docs/operations/SLO_AND_ALERTS.md): target p95 < 1500 ms / p99 < 2000 ms, 5xx < 0.1% steady-state" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate plan: collect â‰¥ 14 nights of baselines â†’ ratchet thresholds â†’ remove continue-on-error" >> "$GITHUB_STEP_SUMMARY"

      - name: Blocking security detectors (P0/P1)
        id: blocking_security_detectors
        run: |
          set -euo pipefail
          # These detectors are release gates. A finding must fail the job;
          # warning-only fallbacks previously made the nightly audit falsely green.
          python scripts/advanced_analysis/blocking_call_detector.py
          python scripts/advanced_analysis/bola_idor_detector.py
          python scripts/ci/webhook_signature_checker.py
          python scripts/ci/rate_limit_endpoint_checker.py
          python scripts/ci/rls_rbac_auditor.py

      # Dead-code detection (moved here from the deleted code-quality.yml; #67).
      # Continues-on-error: advisory until baseline ratchet lands (per Phase-4 plan).
      - name: Backend dead-code scan (vulture)
        # Advisory (non-blocking): dead-code reports â€” publish visible failure summary, not green.
        continue-on-error: true
        run: |
          pip install vulture
          python scripts/security/find_dead_code.py || echo "[WARN] Dead code detected"

      - name: Setup PNPM (SSOT from package.json)
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Audit Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint curl
          python -m pip install 'poetry==2.4.1'
          corepack enable
          # #3265: explicit pnpm@pin à¦¸à¦°à¦¾à¦¨à§‹ â€” bare `corepack prepare --activate`
          # root package.json-à¦à¦° `packageManager` (SSOT) à¦¥à§‡à¦•à§‡ à¦¸à¦‚à¦¸à§à¦•à¦°à¦£ à¦¨à§‡à¦¯à¦¼à¥¤
          corepack prepare --activate
          # à¦¬à¦¾à¦‚à¦²à¦¾ à¦®à¦¨à§à¦¤à¦¬à§à¦¯ (#2524): mutable main-branch curl|bash â†’ pinned release + sha256 à¦¯à¦¾à¦šà¦¾à¦‡à¥¤
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
          wget https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.1/trufflehog_3.97.1_linux_amd64.tar.gz
          tar -xzf trufflehog_3.97.1_linux_amd64.tar.gz
          sudo mv trufflehog /usr/local/bin/
          rm -f trufflehog_3.97.1_linux_amd64.tar.gz
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks_8.18.2_linux_x64.tar.gz

      - name: Run SupremeAI full CI audit
        id: full_audit
        shell: bash
        env:
          SUPREMEAI_JWT_SECRET: "dummy-secret-32-chars-long-123456"
          SUPABASE_DATABASE_URL_WRITER: "postgresql://dummy:pass@localhost:5432/db"
          SUPABASE_URL: "https://dummy.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "example-service-role-key"
          REDIS_URL: "redis://localhost:6379/0"
          SUPREMEAI_BASE_URL: ${{ secrets.SUPREMEAI_BASE_URL }}
        run: |
          chmod +x scripts/ops/ci-full-audit.sh
          ./scripts/ops/ci-full-audit.sh

      - name: Upload CI audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supremeai-ci-audit-reports
          path: ci-reports/
          if-no-files-found: ignore

      - name: Generate Smart Audit Summary
        if: always()
        run: python scripts/ci/generate_audit_summary.py

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true

      # à¦¬à¦¾à¦‚à¦²à¦¾: audit failure-à¦à¦° evidence à¦¹à¦¾à¦°à¦¿à¦¯à¦¼à§‡ à¦¨à¦¾ à¦¯à¦¾à¦“à¦¯à¦¼à¦¾à¦° à¦œà¦¨à§à¦¯ tracking issue
      # auto-à¦–à§à¦²à§‡/à¦†à¦ªà¦¡à§‡à¦Ÿ à¦•à¦°à¦¿à¥¤ Blocking step-à¦à¦° failure job status-à¦à¦“ à¦¦à§ƒà¦¶à§à¦¯à¦®à¦¾à¦¨ à¦¥à¦¾à¦•à§‡à¥¤
      - name: Open/update maintenance issue on failure
        if: ${{ always() && github.event.inputs.skip_issue != 'true' && (steps.duplicate_detector.outcome == 'failure' || steps.vuln_scanner.outcome == 'failure' || steps.mutation_testing.outcome == 'failure' || steps.perf_benchmark.outcome == 'failure' || steps.full_audit.outcome == 'failure' || steps.parity_sentinel.outcome == 'failure') }}
        uses: actions/github-script@v8 # v9.0.0
        with:
          script: |
            const title = "ðŸ”§ Scheduled Deep Audit found issues";
            const failing = [];
            if ("${{ steps.duplicate_detector.outcome }}" === "failure") failing.push("Duplicate Logic Detector");
            if ("${{ steps.vuln_scanner.outcome }}" === "failure") failing.push("Auto Vulnerability Scanner");
            if ("${{ steps.mutation_testing.outcome }}" === "failure") failing.push("Mutation Testing");
            if ("${{ steps.perf_benchmark.outcome }}" === "failure") failing.push("Performance Benchmark");
            if ("${{ steps.full_audit.outcome }}" === "failure") failing.push("SupremeAI full CI audit");
            if ("${{ steps.parity_sentinel.outcome }}" === "failure") failing.push("Feature Parity Sentinel (new backend â‡„ frontend drift â€” see ci-reports/feature-parity-report.md)");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `à¦¸à§à¦¬à¦¯à¦¼à¦‚à¦•à§à¦°à¦¿à¦¯à¦¼à¦­à¦¾à¦¬à§‡ à¦¤à§ˆà¦°à¦¿ â€” Scheduled Deep Audit workflow-à¦à¦° à¦¨à¦¿à¦šà§‡à¦° à¦§à¦¾à¦ªà¦—à§à¦²à§‹ fail à¦•à¦°à§‡à¦›à§‡:`,
              ...failing.map(f => `- ${f}`),
              ``,
              `à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦“ à¦²à¦—: ${runUrl}`,
              ``,
              `à¦à¦‡ à¦‡à¦¸à§à¦¯à§à¦Ÿà¦¾ merge à¦¬à§à¦²à¦• à¦•à¦°à§‡ à¦¨à¦¾ â€” à¦ªà¦°à¦¬à¦°à§à¦¤à§€ à¦°à¦¾à¦¨à§‡ à¦¸à¦¬ à¦ªà¦¾à¦¸ à¦•à¦°à¦²à§‡ à¦à¦Ÿà¦¾ auto-close à¦¹à¦¬à§‡à¥¤`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scheduled-audit",
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["scheduled-audit", "maintenance"],
              });
            }

      - name: Auto-close maintenance issue if everything passed
        if: ${{ always() && steps.duplicate_detector.outcome != 'failure' && steps.vuln_scanner.outcome != 'failure' && steps.mutation_testing.outcome != 'failure' && steps.perf_benchmark.outcome != 'failure' && steps.full_audit.outcome != 'failure' && steps.parity_sentinel.outcome != 'failure' }}
        uses: actions/github-script@v8 # v9.0.0
        with:
          script: |
            const title = "ðŸ”§ Scheduled Deep Audit found issues";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scheduled-audit",
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: "âœ… à¦¸à¦°à§à¦¬à¦¶à§‡à¦· scheduled run-à¦ à¦¸à¦¬ heavy check à¦ªà¦¾à¦¸ à¦•à¦°à§‡à¦›à§‡ â€” à¦‡à¦¸à§à¦¯à§ à¦¬à¦¨à§à¦§ à¦•à¦°à¦¾ à¦¹à¦šà§à¦›à§‡à¥¤",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: "closed",
