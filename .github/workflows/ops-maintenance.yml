  dast:
    needs: [resolve-execution-tier]
    # #67 Tier 2: weekly Sun off-peak (was Mon)
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_dast == true) ||
        (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    concurrency:
      group: dast-zap-${{ github.ref }}
      cancel-in-progress: true
    name: ðŸ”Ž OWASP ZAP API + Full scan (blocking)
    runs-on: ubuntu-24.04
    env:
      # (#4276) dast_base_url dispatch-input à¦¬à¦¾à¦¦ â€” 25-input à¦•à§à¦¯à¦¾à¦ª à¦­à¦¾à¦™à¦›à¦¿à¦² (à¦ªà§à¦°à§‹
      # workflow invalid â†’ à¦¸à¦¬ nightly arm 0-jobs failure)à¥¤ ZAP à¦Ÿà¦¾à¦°à§à¦—à§‡à¦Ÿ à¦à¦–à¦¨ à¦¸à¦°à¦¾à¦¸à¦°à¦¿
      # SSOT repo var STAGING_BASE_URL à¦¥à§‡à¦•à§‡ (à¦†à¦—à§‡à¦“ default fallback à¦à¦Ÿà¦¾à¦‡ à¦›à¦¿à¦²;
      # custom override à¦¦à¦°à¦•à¦¾à¦° à¦¹à¦²à§‡ vars.STAGING_BASE_URL à¦à¦¡à¦¿à¦Ÿ à¦•à¦°à¦¾ à¦¹à¦¬à§‡)à¥¤
      ZAP_TARGET: ${{ vars.STAGING_BASE_URL }}
    timeout-minutes: 45
    steps:
      - name: Require scan target
        if: env.ZAP_TARGET == ''
        run: |
          echo "::error::STAGING_BASE_URL repo variable (or base_url input) is required."
          echo "::error::Refusing to scan without an explicit environment."
          exit 1

      - uses: actions/checkout@v5 # v7.0.1

      - name: ZAP Full scan (baseline)
        uses: zaproxy/action-full-scan@4f7523a09110bc63d6b349713de6aa697ec7fbe9
        with:
          target: '${{ env.ZAP_TARGET }}'
          allow_404_warnings: true
          fail_action: true # âš ï¸ blocking gate
          cmd_options: '-I'

      - name: ZAP API scan (OpenAPI spec ðŸŽ¯ auth endpoints)
        uses: zaproxy/action-api-scan@472970930c47c2e1a7394c6b62c83b5f8e6b479a
        with:
          target: '${{ env.ZAP_TARGET }}'
          spec: core/API-swagger.yaml # wiring audit 2026-11-11: backend/ â†’ core/ (backend/ does not exist)
          fail_action: true # âš ï¸ blocking gate

      - name: Upload ZAP reports (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: reports/
          if-no-files-found: ignore

      - name: Summarize gate result
        if: always()
        run: |
          echo "## DAST Gate (OWASP ZAP)"
          echo "- Target: ${{ env.ZAP_TARGET }}"
          echo "- Reports uploaded as artifact: zap-reports"
          echo "- Post-scan IDOR/business-logic rules: tracked in SECURITY_AUDIT_MATRIX.md P8"

