  stale-mutex:
    needs: [resolve-execution-tier]
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_stale_mutex == true) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * 0'))
    concurrency:
      group: stale-mutex-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    name: ðŸ”“ Release Stale Mutex Locks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      STALE_HOURS: ${{ github.event.inputs.stale_hours || '24' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Ensure in-progress label exists (self-healing, issue #903)
        run: |
          set -euo pipefail
          # Idempotent: if the label already exists (color e3b341) gh errors
          # out, which we swallow; --force updates color/description if changed.
          gh label create "status:in-progress" \
            --color "e3b341" \
            --description "Work currently claimed and in progress by an agent (canonical active-work lock)" \
            --force 2>/dev/null || true

      - name: Find in-progress issues without open PRs
        id: find
        run: |
          set -euo pipefail
          echo "ðŸ” Looking for stale in-progress issues (>$STALE_HOURS h without PR)"

          # Get all open issues with status:in-progress label
          ISSUES_JSON=$(gh issue list --label "status:in-progress" --state open \
            --json number,title,createdAt,updatedAt,labels --limit 100)
          # issue #1321: gh à¦–à¦¾à¦²à¦¿/à¦…-JSON output à¦¦à¦¿à¦²à§‡ à¦ªà§à¦°à§‹ workflow à¦²à¦¾à¦² à¦¹à¦¯à¦¼à§‡ à¦¯à§‡à¦¤ â€”
          # maintenance job-à¦à¦° à¦¨à§€à¦¤à¦¿: à¦šà§à¦ªà¦šà¦¾à¦ª à¦ªà¦¾à¦¸ à¦¨à¦¯à¦¼, à¦¸à§à¦ªà¦·à§à¦Ÿ à¦“à¦¯à¦¼à¦¾à¦°à§à¦¨à¦¿à¦‚ à¦¦à¦¿à¦¯à¦¼à§‡ à¦¸à¦ à¦¿à¦• exità¥¤
          if [ -z "$(echo "$ISSUES_JSON" | tr -d '[:space:]')" ]; then
            echo "::warning::gh issue list returned empty output â€” treating as 0 in-progress claims (input honesty preserved)"
            echo "[]" > /tmp/issues_json
          else
            echo "$ISSUES_JSON" > /tmp/issues_json
          fi

          python3 - /tmp/issues_json << 'PYEOF'
          import json, os, subprocess, sys
          from datetime import datetime, timezone, timedelta

          raw = open(sys.argv[1]).read().strip()
          try:
              issues = json.loads(raw) if raw else []
          except json.JSONDecodeError:
              # issue #1321: malformed gh output â€” à¦¸à§à¦ªà¦·à§à¦Ÿ à¦¸à¦¤à¦°à§à¦•à¦¬à¦¾à¦°à§à¦¤à¦¾, crash à¦¨à¦¯à¦¼
              print("::warning::gh issue list returned non-JSON output â€” treating as 0 in-progress claims")
              issues = []
          stale_hours = int(os.environ.get('STALE_HOURS', '24'))
          dry_run = os.environ.get('DRY_RUN', 'false') == 'true'
          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=stale_hours)

          stale_count = 0
          released_count = 0

          for issue in issues:
              num = issue['number']
              title = issue['title']
              updated = datetime.fromisoformat(issue['updatedAt'].replace('Z', '+00:00'))

              # Skip if updated within stale_hours
              if updated > cutoff:
                  continue

              # Check if any open PR references this issue number in its title or body
              # gh pr list --search "issue #N" or "fixes #N"
              try:
                  pr_check = subprocess.run(
                      ['gh', 'pr', 'list', '--state', 'open',
                       '--search', f'"{num}" in:title,body',
                       '--json', 'number', '--limit', '1'],
                      capture_output=True, text=True, timeout=15
                  )
                  prs = json.loads(pr_check.stdout) if pr_check.stdout.strip() else []
              except Exception:
                  prs = []

              if prs:
                  # Open PR exists â€” not stale, skip
                  continue

              # Stale! No PR + older than cutoff
              stale_count += 1
              print(f"  ðŸŸ¡ Issue #{num} ({title[:50]}) â€” stale since {updated.isoformat()}")

              if dry_run:
                  print(f"     (dry-run â€” would release)")
                  continue

              # Remove the status:in-progress label
              try:
                  subprocess.run(
                      ['gh', 'issue', 'edit', str(num), '--remove-label', 'status:in-progress'],
                      check=True, capture_output=True, text=True, timeout=15
                  )
                  released_count += 1
                  print(f"     âœ… released mutex")

                  # Post a comment explaining
                  comment_body = f"""### ðŸ”“ Stale Mutex Released (GAP-03)

          à¦à¦‡ issue-à¦Ÿà¦¿ {stale_hours}+ à¦˜à¦£à§à¦Ÿà¦¾ à¦§à¦°à§‡ `status:in-progress` à¦›à¦¿à¦², à¦•à¦¿à¦¨à§à¦¤à§ à¦•à§‹à¦¨à§‹ open PR à¦¨à§‡à¦‡à¥¤
          à¦¸à¦®à§à¦­à¦¬à¦¤ à¦à¦œà§‡à¦¨à§à¦Ÿ à¦•à§à¦°à§à¦¯à¦¾à¦¶ à¦¹à¦¯à¦¼à§‡à¦›à§‡ à¦¬à¦¾ à¦¸à¦‚à¦¯à§‹à¦— à¦¬à¦¿à¦šà§à¦›à¦¿à¦¨à§à¦¨ à¦¹à¦¯à¦¼à§‡à¦›à§‡à¥¤

          **Mutex released:** {now.isoformat()}

          à¦à¦‡ issue à¦à¦–à¦¨ à¦…à¦¨à§à¦¯ à¦à¦œà§‡à¦¨à§à¦Ÿ à¦§à¦°à¦¤à§‡ à¦ªà¦¾à¦°à¦¬à§‡à¥¤

          _Automated by stale-mutex-cleanup.yml (GAP-03 fix)_"""
                  subprocess.run(
                      ['gh', 'issue', 'comment', str(num), '--body', comment_body],
                      check=True, capture_output=True, text=True, timeout=15
                  )
              except subprocess.CalledProcessError as e:
                  print(f"     âš ï¸ failed: {e.stderr[:100] if e.stderr else 'unknown'}")

          print(f"\nðŸ“Š Summary: {stale_count} stale issues found, {released_count} released")
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "## ðŸ”“ Stale Mutex Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "Stale threshold: ${STALE_HOURS} hours" >> $GITHUB_STEP_SUMMARY
          echo "Dry-run: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for details." >> $GITHUB_STEP_SUMMARY

