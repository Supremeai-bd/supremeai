  db-pool-health:
    needs: [resolve-execution-tier]
    # বাংলা মন্তব্য: free tier-এর লিমিট নষ্ট না করার জন্য staging DB pool health প্রোব নিষ্ক্রিয় করা হয়েছে
    if: false
    concurrency:
      group: nightly-ops-db-pool-health
      cancel-in-progress: false
    name: 🗄️ DB & Pool Health Probe (pgBouncer/quota report)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      STAGING_TARGET: ${{ secrets.STAGING_URL }}
      LOAD_TEST_TOKEN: ${{ secrets.LOAD_TEST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # বাংলা মন্তব্য (Tier-1/plan): আগে pgBouncer হেলথ CI-তে ছিল না — শুধু
      # SLO ডকে 'Supabase dashboard দেখো' লেখা ছিল। এখন /health/ready +
      # /health/full প্রোব করে DB কম্পোনেন্টের অবস্থা রিপোর্ট হয়; degraded
      # হলে job ব্যর্থ। টার্গেট/টোকেন না থাকলে সৎ স্কিপ।
      - name: Probe /health/ready + /health/full (DB components)
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          base = os.environ.get("STAGING_TARGET", "").rstrip("/")
          token = os.environ.get("LOAD_TEST_TOKEN", "")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          if not base:
              print("::warning::STAGING_URL not configured — DB pool health honestly SKIPPED.")
              if summary:
                  with open(summary, "a", encoding="utf-8") as h:
                      h.write("### 🗄️ DB & Pool Health\n\n_SKIPPED — STAGING_URL not configured_\n")
              sys.exit(0)

          def probe(path, with_auth):
              req = urllib.request.Request(base + path)
              if with_auth and token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8") or "{}")
              except Exception as exc:
                  return 0, {"error": str(exc)}

          ready_code, ready = probe("/health/ready", False)
          full_code, full = probe("/health/full", True)

          lines = ["### 🗄️ DB & Pool Health", "", f"- /health/ready: HTTP {ready_code}", f"- /health/full: HTTP {full_code}"]
          db_status = "unknown"
          components = full.get("components") or full.get("checks") or {}
          if isinstance(components, dict):
              db_comp = components.get("database") or components.get("db") or {}
              if isinstance(db_comp, dict):
                  db_status = str(db_comp.get("status", "unknown"))
                  lines.append(f"- database component: **{db_status}**")
              for key in ("memory", "redis"):
                  comp = components.get(key)
                  if isinstance(comp, dict):
                      lines.append(f"- {key} component: {comp.get('status', 'unknown')}")
          overall = full.get("status", "unknown")
          lines.append(f"- overall: **{overall}**")
          print("\n".join(lines))
          if summary:
              with open(summary, "a", encoding="utf-8") as h:
                  h.write("\n".join(lines) + "\n")

          if ready_code != 200:
              print(f"::error::/health/ready returned {ready_code}")
              sys.exit(1)
          if str(db_status).lower() in ("down", "unhealthy", "error") or str(overall).lower() in ("unhealthy", "down"):
              print("::error::DB component degraded — see summary")
              sys.exit(1)
          PY

  branch-retention:
    needs: [resolve-execution-tier]
    name: 🌿 Branch Retention Cleanup
    # #67 Tier 1: daily storage tidy (was Mon weekly)
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_branch_retention == true || inputs.run_all == true)) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    concurrency:
      group: branch-retention-cleanup
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply retention policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: "7"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Retention window: ${RETENTION_DAYS} days"
          CUTOFF=$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          OWNER="${REPO%%/*}"

          # #2124: paginate both calls — repo is at 100 branches, per_page=100
          # misses anything beyond that as the pool grows.
          open_heads=$(gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[].head.ref' | sort -u || true)

          deleted=0; skipped=0
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            case "$branch" in
              main|develop|master) skipped=$((skipped+1)); continue ;;
              # #2124: protect CURRENT slot convention (coder-N, super-N, planner-N,
              # ci-N, pr-helper-N, browser-N, platform-N) — 1-2 digit N only.
              # Legacy agent-N-* branches are NOT protected (they are stale and
              # should be pruned). Legacy coder-<issue_number> (4+ digits) is
              # also NOT protected.
              coder-[0-9]|coder-[0-9][0-9]|\
              super-[0-9]|super-[0-9][0-9]|\
              planner-[0-9]|planner-[0-9][0-9]|\
              ci-[0-9]|ci-[0-9][0-9]|\
              pr-helper-[0-9]|pr-helper-[0-9][0-9]|\
              browser-[0-9]|browser-[0-9][0-9]|\
              platform-[0-9]|platform-[0-9][0-9]) skipped=$((skipped+1)); continue ;;
            esac
            if grep -qx "$branch" <<< "$open_heads"; then skipped=$((skipped+1)); continue; fi

            # Squash-merge-safe merged check: the branch counts as merged only
            # if a CLOSED PR with this head was actually MERGED into the base.
            merged=$(gh api "repos/${REPO}/pulls?head=${OWNER}:${branch}&state=closed&per_page=5" \
              --jq '[.[].merged] | any' 2>/dev/null || echo false)
            if [[ "$merged" != "true" ]]; then skipped=$((skipped+1)); continue; fi

            last_commit_date=$(gh api "repos/${REPO}/branches/${branch}" --jq '.commit.commit.committer.date')
            if [[ "$last_commit_date" < "$CUTOFF" ]]; then
              gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}" >/dev/null && \
                { echo "deleted: ${branch} (merged via PR, last commit ${last_commit_date})"; deleted=$((deleted+1)); }
            else
              skipped=$((skipped+1))
            fi
          done < <(gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' | grep -v '^chore/artifact-regen-')

          echo "Summary: deleted=${deleted} skipped=${skipped}"

  guard-roster:
    needs: [resolve-execution-tier]
    # The roster's full lane: guards that audit the whole tree (repo-wide CVE
    # scans, dependency inventory, live fleet probes). Their findings change when
    # main moves, not when a feature branch moves, so running them per-PR spends
    # minutes to catch nothing a PR caused. The fast lane runs per-PR in
    # unified-pipeline.yml (syntax-and-governance-gate).
    # Gated on the daily cron ONLY. This workflow already defines the maximum 25
    # `workflow_dispatch` inputs GitHub permits; adding a 26th to trigger this lane
    # made GitHub reject the ENTIRE file ("you may only define up to 25 inputs"),
    # which surfaced as a run with ZERO jobs on both push and schedule. Keep this
    # job reachable without an input so the count can never be exceeded again.
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true)
    name: "🛡️ Guard Roster (full, nightly)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install guard dependencies
      # Measured: the whole 56-guard roster passes in a venv containing exactly
      # pyyaml, pytest, pyjwt and requests. Keeping this list minimal is what
      # stops the job from silently becoming a 5-minute install.
      run: pip install --quiet pyyaml pytest pyjwt requests
    - name: Record guard environment (failure triage)
      # বাংলা: nightly রোস্টার ২০+ বার পরপর লাল হয়েছে, অথচ লোকালে (একই ৪টি ডিপ,
      # এমনকি shallow clone-এ) ১০৮/১০৮ পাস করে। কারণ নির্ণয়ের জন্য দরকার
      # ইন্টারপ্রেটার + gh auth + ডিপ সংস্করণ — যা আগে লগে ছিল না।
      # নীতি: এই স্টেপ কখনো job ব্যর্থ করবে না (|| true), শুধু প্রমাণ যোগাবে।
      run: |
        {
          echo "guard_env python: $(python -V 2>&1)"
          echo "guard_env interpreter: $(python -c 'import sys;print(sys.executable)')"
          echo "guard_env gh: $(gh --version 2>/dev/null | head -1 || echo 'gh missing')"
          echo "guard_env gh_auth: $(gh auth status 2>&1 | head -2 | tr '\n' ' ' || echo unknown)"
          echo "guard_env GH_TOKEN set: ${{ github.token != '' }}"
          echo "guard_env deps: $(python -c 'import yaml,pytest,jwt,requests;print("yaml",yaml.__version__,"pytest",pytest.__version__,"requests",requests.__version__)' 2>&1)"
          echo "guard_env shallow: $(git rev-parse --is-shallow-repository 2>/dev/null || echo unknown)"
          echo "guard_env network: $(python - <<'PY'
        import urllib.request
        try:
            with urllib.request.urlopen("https://api.github.com/rate_limit", timeout=10) as r:
                print("api.github.com reachable", r.status)
        except Exception as exc:
            print("api.github.com UNREACHABLE", type(exc).__name__, str(exc)[:120])
        PY
        )"
        } | tee guard-env.txt || true
        { echo "### 🛡️ Guard roster environment"; echo '```'; cat guard-env.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
    - name: Run every guard
      # tee so the artifact below is the full transcript, not just the tail CI
      # happens to render. pipefail keeps the guard's exit code through the pipe.
      # `|| true` keeps the job alive so the failure list reaches the step summary:
      # a red job whose only reason lives in an artifact nobody can open is the
      # exact "silent failure" this roster exists to prevent.
      # 2026-11 RBAC: the tower default-denies role-gated MCP tools — pass the
      # agent-role Bearer token so hollow_read_guard reads real data planes
      # (without it the guard now reports honest AUTH_GATED + warning, not red).
      env:
        MCP_TOWER_TOKEN: ${{ secrets.MCP_TOWER_TOKEN || secrets.MCP_TOWER_AUTH_TOKEN }}
      run: |
        set -o pipefail
        set +e
        python scripts/ci/run_all_guards.py --full 2>&1 | tee guard-roster.log
        roster_rc=$?
        set -e
        status=$(grep -oE '[0-9]+/[0-9]+ guards exited 0' guard-roster.log | tail -1)
        {
          echo "### 🛡️ Guard Roster (full, nightly)"
          echo ""
          echo "**${status:-roster produced no verdict — the run died before reporting}**"
          echo ""
          if grep -q '^FAILED:' guard-roster.log; then
            echo "**Failed guards** (each is a fixable, named line — not a mystery red job):"
            echo ""
            echo '```'
            sed -n '/^FAILED:/,$p' guard-roster.log
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$roster_rc" -ne 0 ] || grep -q '^FAILED:' guard-roster.log; then
          echo "::error::guard roster failed (exit $roster_rc) — see named failures in the step summary"
          exit 1
        fi
        if ! grep -qE '([0-9]+)/\1 guards exited 0' guard-roster.log; then
          echo "::error::guard roster did not report a full exit-0 summary — treating as failure"
          exit 1
        fi
    - name: Upload roster log
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: guard-roster-log
        path: |
          guard-roster.log
          guard-env.txt
        if-no-files-found: ignore

  silent-error:
    needs: [resolve-execution-tier]
    # #67 Tier 2: weekly Sun off-peak (was Mon)
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_silent_error == true || inputs.run_all == true)) ||
        ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
