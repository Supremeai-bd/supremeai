      # à¦¬à¦¾à¦‚à¦²à¦¾ (#1132): resolution à¦šà§‡à¦‡à¦¨ à¦à¦–à¦¨ scripts/ci/resolve_production_targets.py â€”
      # à¦à¦•à¦Ÿà¦¾à¦‡ canonical à¦šà§à¦•à§à¦¤à¦¿, qa-live-smoke + 09-post-deploy-smoke + release
      # certification à¦¸à¦¬à¦¾à¦‡ à¦à¦•à¦‡ UI/API target + provenance à¦¦à§‡à¦–à¦¾à¦¯à¦¼à¥¤ à¦‡à¦¨à¦²à¦¾à¦‡à¦¨ à¦ªà¦¾à¦‡à¦¥à¦¨
      # à¦¡à§à¦ªà§à¦²à¦¿à¦•à§‡à¦Ÿ à¦®à§à¦›à§‡ à¦«à§‡à¦²à¦¾ à¦¹à¦¯à¦¼à§‡à¦›à§‡ (drift = à¦†à¦²à¦¾à¦¦à¦¾ à¦†à¦²à¦¾à¦¦à¦¾ à¦¸à¦¤à§à¦¯ â€” à¦†à¦° à¦¸à¦®à§à¦­à¦¬ à¦¨à¦¯à¦¼)à¥¤
      - name: Resolve live targets (canonical resolver, zero-hardcode, with provenance)
        id: resolve
