            - PR Helper auto-merge à¦¬à¦¨à§à¦§ à¦¹à¦¬à§‡
            - Agent workflow disruption

          ### Recommended Action
          - [ ] à¦¸à¦®à¦¾à¦¨à§à¦¤à¦°à¦¾à¦² agents à¦•à¦®à¦¾à¦¨ (max 3-5 concurrent)
          - [ ] à¦­à¦¾à¦°à§€ CI jobs à¦¸à§à¦Ÿà§à¦¯à¦¾à¦—à¦¾à¦° à¦•à¦°à§à¦¨
          - [ ] à¦ªà§à¦°à¦¯à¦¼à§‹à¦œà¦¨à§‡ GitHub App à¦¬à¦¾ à¦¦à§à¦¬à¦¿à¦¤à§€à¦¯à¦¼ PAT à¦¬à§à¦¯à¦¬à¦¹à¦¾à¦° à¦•à¦°à§à¦¨
          - [ ] à¦†à¦°à§à¦•à¦¿à¦Ÿà§‡à¦•à¦šà¦¾à¦° à¦°à¦¿à¦­à¦¿à¦‰: à¦•à§‹à¦¨ à¦•à¦®à§à¦ªà§‹à¦¨à§‡à¦¨à§à¦Ÿ à¦¸à¦¬à¦šà§‡à¦¯à¦¼à§‡ à¦¬à§‡à¦¶à¦¿ API call à¦•à¦°à¦›à§‡

          ### Policy
          - **Max Concurrent Agent Policy** (OPS-06 Safeguard 5): active slots MUST be <= 10 â€” enforced via `AGENT_SLOT_REGISTRY.yaml` active count (cap raised 5â†’10 by the 2026-09-26 registry rewrite; was stale at `<= 5` â€” #1411)
          - Rate budget: agent ~10 + PR Helper ~20 + CI ~50 calls/cycle â€” see OPS-06 Safeguard 5 table

          ### Tracking
          - Label: `rate-limit-alert`
          - Date: $TODAY
          MD
          )

          # Create issue (substitute variables in body)
          BODY=$(echo "$BODY" | sed "s/\$ICON/$ICON/g; s/\$SEVERITY/$SEVERITY/g; s/\$REMAINING/$REMAINING/g; s/\$TODAY/$TODAY/g")
