      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '46046931910'
          name: zap-passive-root
      - name: Report safe cache metadata only
        run: |
          python3 - <<'PYTHON'
          import json, re
          report = json.load(open('zap-passive-report.json'))
          for alert in report['alerts']:
              evidence = str(alert.get('evidence', '')).lower()
              directives = re.findall(r'(?<![a-z-])(no-store|no-cache|private|public|must-revalidate|s-maxage|max-age)(?:\s*=\s*([0-9]+))?', evidence)
              summary = ', '.join(k + ('=' + v if v else '') for k, v in directives) or 'not present in evidence'
              confidence = re.sub(r'[^a-zA-Z ]', '', str(alert.get('confidence', 'unknown')))[:20]
              print(f'::notice::Cache alert confidence: {confidence}; recognized evidence directives: {summary}')
          PYTHON

  constitution:
    needs: [resolve-execution-tier]
    # #67 Tier 2: weekly Sun off-peak (was Mon)
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_constitution == true || inputs.run_all == true)) ||
        ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
    concurrency:
      group: nightly-ops-constitution
