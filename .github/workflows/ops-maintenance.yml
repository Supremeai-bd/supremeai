  # -------------------------------------------------------------------------
  # Graph Health / Dead-Code Sweep (Graphify AST Intelligence — audit 2026-11-24)
  # -------------------------------------------------------------------------
  # বাংলা মন্তব্য: sync_graph_to_memory.py-এর audit_graph_health() ইঞ্জিনটি
  # অনেকদিন ছিল কিন্তু কোনো scheduled কাজ এটিকে চালাত না — zero-importer
  # dead-code প্রার্থী, circular import cycle ও God nodes নীরবে জমত। এই job
  # প্রতি সপ্তাহে গ্রাফ অডিট চালিয়ে ফলাফল issue হিসেবে ফাইল করে (dedup-
  # fingerprint সহ, প্রতি রানে ডুপ্লিকেট issue নয়)। ইস্যু-তৈরির জন্য
  # existing platform agent চ্যানেল ব্যবহার করা হয় — নতুন অটোমেশন লেন নয়।
  graph-health-sweep:
    needs: [resolve-execution-tier]
    name: 🕸️ Graph Health & Dead-Code Sweep (weekly)
    # No dispatch toggle — see the 25-input hard-cap note near run_docs_garbage_sweep.
    if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true)
    concurrency:
      group: graph-health-sweep
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Run graph health audit
        run: |
          mkdir -p ci-reports
          # graphify CLI GitHub runner-এ নেই — stdlib AST fallback CI-safe।
          python scripts/ci/sync_graph_to_memory.py --refresh --audit > ci-reports/graph_health.json
          python - <<'PY'
          import json
          from pathlib import Path
          h = json.loads(Path('ci-reports/graph_health.json').read_text(encoding='utf-8'))
          lines = [
              '## 🕸️ Graph Health Report (Graphify AST audit)',
              '',
              f"- Files: **{h['total_files']}** | Nodes: **{h['total_nodes']}** | Links: **{h['total_links']}**",
              f"- Circular import cycles: **{h['import_cycle_count']}**",
              f"- Layer violations (core → gateway/studio): **{h['layer_violation_count']}**",
              f"- Zero-importer dead-code candidates: **{h['zero_importer_count']}**",
              '',
              '### Cycles',
              *['- ' + ' ↔ '.join(c) for c in h['import_cycles'][:10]],
              '',
              '### Dead-code candidates (first 30)',
              *['- `' + f + '`' for f in h['zero_importer_sample']],
              '',
              '### Top hotspots (first 10)',
              *[f"- `{x['file']}` — {x['dependents']} dependents" for x in h['top_hotspots'][:10]],
          ]
          Path('ci-reports/graph_health.md').write_text('\n'.join(lines), encoding='utf-8')
          print(f"cycles={h['import_cycle_count']} dead={h['zero_importer_count']} violations={h['layer_violation_count']}")
          PY

      - name: File findings as issue (deduped, fail-soft)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # বাংলা: শুধু বাস্তব সমস্যা থাকলেই issue ফাইল হয় (cycles > 0 বা
          # layer violations > 0); dead-code candidates রিপোর্টে থাকে কিন্তু
          # একা দিয়ে issue খোলে না — সেগুলো হাতে যাচাই করে মুছতে হয়।
          CYCLES=$(python -c "import json;print(json.load(open('ci-reports/graph_health.json'))['import_cycle_count'])")
          VIOLATIONS=$(python -c "import json;print(json.load(open('ci-reports/graph_health.json'))['layer_violation_count'])")
          DEAD=$(python -c "import json;print(json.load(open('ci-reports/graph_health.json'))['zero_importer_count'])")
          TITLE="[Graph Audit] ${CYCLES} import cycles, ${VIOLATIONS} layer violations, ${DEAD} dead-code candidates"
          EXISTING=$(gh issue list --state open --search "[Graph Audit] in:title" --json number --limit 5 | python3 -c "import json,sys;print(len(json.load(sys.stdin)))")
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "$TITLE" --body-file ci-reports/graph_health.md --label 'status:unclaimed' || \
              echo "issue create failed (non-fatal — report is in the artifact)"
          else
            echo "Open [Graph Audit] issue exists — skipping duplicate"
          fi

      - name: Upload graph health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-health-${{ github.run_id }}
          path: ci-reports/graph_health.*
          if-no-files-found: ignore
          retention-days: 14

  rate-limit-trend:
    needs: [resolve-execution-tier]
    name: 📊 Rate Limit Trend Snapshot (daily)
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_rate_limit_trend == true || inputs.run_all == true)) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    concurrency:
      group: rate-limit-monitor
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Query GitHub rate_limit endpoint
        id: check
        run: |
          set -euo pipefail

          # Query rate_limit endpoint (uses GH_TOKEN which is the canonical one)
          RESPONSE=$(gh api /rate_limit)

          # Extract core rate limit info
          CORE_LIMIT=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          core = d['resources']['core']
          print(f\"limit={core['limit']} remaining={core['remaining']} used={core['used']} reset={core['reset']}\")
          core_remaining = core['remaining']
          core_limit = core['limit']
          # Write to GITHUB_ENV for next step
          with open('/tmp/ratelimit.json', 'w') as f:
              json.dump({'remaining': core_remaining, 'limit': core_limit, 'used': core['used'], 'reset': core['reset']}, f)
          ")
          echo "$CORE_LIMIT"

          # Determine severity
          REMAINING=$(echo "$RESPONSE" | python3 -c "import json,sys;print(json.load(sys.stdin)['resources']['core']['remaining'])")
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"

          if [ "$REMAINING" -lt 100 ]; then
            echo "severity=critical" >> "$GITHUB_OUTPUT"
            echo "::error::GitHub API rate limit CRITICAL — only $REMAINING requests remaining"
          elif [ "$REMAINING" -lt 500 ]; then
            echo "severity=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub API rate limit LOW — $REMAINING requests remaining"
          else
            echo "severity=ok" >> "$GITHUB_OUTPUT"
            echo "✅ Rate limit OK — $REMAINING requests remaining"
          fi

      - name: Open alert issue (if warning or critical)
        if: steps.check.outputs.severity != 'ok'
        env:
          SEVERITY: ${{ steps.check.outputs.severity }}
          REMAINING: ${{ steps.check.outputs.remaining }}
        run: |
          set -euo pipefail

          # Check for existing open rate-limit alert issue (dedup per day)
          TODAY=$(date -u +'%Y-%m-%d')
          EXISTING=$(gh issue list --label "rate-limit-alert" --state open \
            --json number,title --limit 5 --jq ".[] | select(.title | contains(\"$TODAY\")) | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            echo "ℹ️ Already have an open rate-limit alert issue #$EXISTING for today — commenting instead of creating new"
            gh issue comment "$EXISTING" --body "📊 Update at $(date -u +'%H:%M UTC'): severity=$SEVERITY, remaining=$REMAINING"
            exit 0
          fi

          # Create label if not exists
          # Create label if not exists (issue #904: GitHub label colors are
          # 6-hex-char strings WITHOUT spaces — `"FB CA 04"` was being rejected
          # by the API, which cascaded to issue creation failure).
          gh label create "rate-limit-alert" --color "FBCA04" \
            --description "GitHub API rate limit warning" --force 2>/dev/null || true

          # Build issue body
          if [ "$SEVERITY" = "critical" ]; then
            TITLE="🔴 CRITICAL: GitHub API rate limit critical ($REMAINING remaining)"
            ICON="🔴"
          else
            TITLE="🟡 WARNING: GitHub API rate limit low ($REMAINING remaining)"
            ICON="🟡"
          fi

          # Build issue body — unquoted heredoc terminator so $SEVERITY,
          # $REMAINING, $TODAY, $ICON actually expand (issue #904: the previous
          # single-quoted 'MD' terminator prevented all variable substitution
          # and the post-hoc sed workaround only patched 4 of them).
          BODY=$(cat << MD
          ## $ICON GitHub API Rate Limit Alert

          **Detected at:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          **Severity:** $SEVERITY
          **Remaining requests:** $REMAINING (out of 5,000/hour)

          ### Impact
          - সব agents + PR Helper + CI scripts একই GITHUB_TOKEN ব্যবহার করে
          - Rate limit hit হলে:
            - `gh issue edit`, `gh pr review`, `gh pr merge` সব fail করবে
            - PR Helper auto-merge বন্ধ হবে
            - Agent workflow disruption

          ### Recommended Action
          - [ ] সমান্তরাল agents কমান (max 3-5 concurrent)
          - [ ] ভারী CI jobs স্ট্যাগার করুন
          - [ ] প্রয়োজনে GitHub App বা দ্বিতীয় PAT ব্যবহার করুন
          - [ ] আর্কিটেকচার রিভিউ: কোন কম্পোনেন্ট সবচেয়ে বেশি API call করছে

          ### Policy
          - **Max Concurrent Agent Policy** (OPS-06 Safeguard 5): active slots MUST be <= 10 — enforced via `AGENT_SLOT_REGISTRY.yaml` active count (cap raised 5→10 by the 2026-09-26 registry rewrite; was stale at `<= 5` — #1411)
          - Rate budget: agent ~10 + PR Helper ~20 + CI ~50 calls/cycle — see OPS-06 Safeguard 5 table

          ### Tracking
          - Label: `rate-limit-alert`
          - Date: $TODAY
          MD
          )

          # Create issue (substitute variables in body)
          BODY=$(echo "$BODY" | sed "s/\$ICON/$ICON/g; s/\$SEVERITY/$SEVERITY/g; s/\$REMAINING/$REMAINING/g; s/\$TODAY/$TODAY/g")
          gh issue create --title "$TITLE" --body "$BODY" --label "rate-limit-alert"

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Rate Limit Monitor Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "Severity: ${{ steps.check.outputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "Remaining: ${{ steps.check.outputs.remaining }}" >> $GITHUB_STEP_SUMMARY

  docs-garbage-sweep:
    needs: [resolve-execution-tier]
    # ── #4176 Step 3: PR-independent main-tree Zero-Garbage monitoring ──────
    # PR-path gate (pr.yml → constitution.gates docs_garbage) শুধু PR-এর
    # changed-files দেখে — main-এ direct push হলে কোনো gate চলে না (প্রমাণ:
    # 9e4d9df/889da16, 2026-10-06)। এই job পুরো docs/ tree দিনে একবার sweep
    # করে — baseline-বাইরে নতুন non-allowlisted docs/*.md = লাল (fail-closed)।
    name: 🧹 Docs Garbage Tree Sweep (daily, #4176)
    # #67 Tier 2: weekly Sun off-peak (was daily)
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_docs_garbage_sweep == true || inputs.run_all == true)) ||
        ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
    concurrency:
      group: docs-garbage-sweep
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout main tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Tree sweep (fail-closed on new offenders)
        run: |
          set -euo pipefail
          # #4279: setup-python হলেও PyYAML থাকে না — sweep স্ক্রিপ্টর lazy
          # `import yaml`-এ ModuleNotFoundError ছিল (প্রথম run-এই ধরা পড়েছিল,
          # এতদিন nightly parse-ভাঙা থাকায় অদৃশ্য ছিল)। runner FS-এ একবার
          # install করলে পরের summary step-ও লাভ করে (same runner FS)।
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/ci/docs_garbage_tree_sweep.py

      - name: Sweep summary (offender inventory on failure)
        if: failure()
        run: |
          echo "## 🧹 Docs Garbage Tree Sweep — NEW OFFENDERS (#4176)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/docs_garbage_tree_sweep.py --list >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Remediation:** ফাইলটি \`docs/archive/\`-এ সরাও, অথবা rules.yml \`docs_garbage_policy.allowed_patterns\`-এ (approved PR-এ) যোগ করো, অথবা liability-audit-এ সিদ্ধান্ত নাও।" >> "$GITHUB_STEP_SUMMARY"

  stale-mutex:
    needs: [resolve-execution-tier]
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_stale_mutex == true || inputs.run_all == true)) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    concurrency:
      group: stale-mutex-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    name: 🔓 Release Stale Mutex Locks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      STALE_HOURS: "24"
      DRY_RUN: "false"
    steps:
      - name: Ensure in-progress label exists (self-healing, issue #903)
        run: |
          set -euo pipefail
          # Idempotent: if the label already exists (color e3b341) gh errors
          # out, which we swallow; --force updates color/description if changed.
          gh label create "status:in-progress" \
            --color "e3b341" \
            --description "Work currently claimed and in progress by an agent (canonical active-work lock)" \
            --force 2>/dev/null || true

      - name: Find in-progress issues without open PRs
        id: find
        run: |
          set -euo pipefail
          echo "🔍 Looking for stale in-progress issues (>$STALE_HOURS h without PR)"

          # Get all open issues with status:in-progress label
          ISSUES_JSON=$(gh issue list --label "status:in-progress" --state open \
            --json number,title,createdAt,updatedAt,labels --limit 100)
          # issue #1321: gh খালি/অ-JSON output দিলে পুরো workflow লাল হয়ে যেত —
          # maintenance job-এর নীতি: চুপচাপ পাস নয়, স্পষ্ট ওয়ার্নিং দিয়ে সঠিক exit।
          if [ -z "$(echo "$ISSUES_JSON" | tr -d '[:space:]')" ]; then
            echo "::warning::gh issue list returned empty output — treating as 0 in-progress claims (input honesty preserved)"
            echo "[]" > /tmp/issues_json
          else
            echo "$ISSUES_JSON" > /tmp/issues_json
          fi

          python3 - /tmp/issues_json << 'PYEOF'
          import json, os, subprocess, sys
          from datetime import datetime, timezone, timedelta

          raw = open(sys.argv[1]).read().strip()
          try:
              issues = json.loads(raw) if raw else []
          except json.JSONDecodeError:
              # issue #1321: malformed gh output — স্পষ্ট সতর্কবার্তা, crash নয়
              print("::warning::gh issue list returned non-JSON output — treating as 0 in-progress claims")
              issues = []
          stale_hours = int(os.environ.get('STALE_HOURS', '24'))
          dry_run = os.environ.get('DRY_RUN', 'false') == 'true'
          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=stale_hours)

          stale_count = 0
          released_count = 0

          for issue in issues:
              num = issue['number']
              title = issue['title']
              updated = datetime.fromisoformat(issue['updatedAt'].replace('Z', '+00:00'))

              # Skip if updated within stale_hours
              if updated > cutoff:
                  continue

              # Check if any open PR references this issue number in its title or body
              # gh pr list --search "issue #N" or "fixes #N"
              try:
                  pr_check = subprocess.run(
                      ['gh', 'pr', 'list', '--state', 'open',
                       '--search', f'"{num}" in:title,body',
                       '--json', 'number', '--limit', '1'],
                      capture_output=True, text=True, timeout=15
                  )
                  prs = json.loads(pr_check.stdout) if pr_check.stdout.strip() else []
              except Exception:
                  prs = []

              if prs:
                  # Open PR exists — not stale, skip
                  continue

              # Stale! No PR + older than cutoff
              stale_count += 1
              print(f"  🟡 Issue #{num} ({title[:50]}) — stale since {updated.isoformat()}")

              if dry_run:
                  print(f"     (dry-run — would release)")
                  continue

              # Remove the status:in-progress label
              try:
                  subprocess.run(
                      ['gh', 'issue', 'edit', str(num), '--remove-label', 'status:in-progress'],
                      check=True, capture_output=True, text=True, timeout=15
                  )
                  released_count += 1
                  print(f"     ✅ released mutex")

                  # Post a comment explaining
                  comment_body = f"""### 🔓 Stale Mutex Released (GAP-03)

          এই issue-টি {stale_hours}+ ঘণ্টা ধরে `status:in-progress` ছিল, কিন্তু কোনো open PR নেই।
          সম্ভবত এজেন্ট ক্র্যাশ হয়েছে বা সংযোগ বিচ্ছিন্ন হয়েছে।

          **Mutex released:** {now.isoformat()}

          এই issue এখন অন্য এজেন্ট ধরতে পারবে।

          _Automated by stale-mutex-cleanup.yml (GAP-03 fix)_"""
                  subprocess.run(
                      ['gh', 'issue', 'comment', str(num), '--body', comment_body],
                      check=True, capture_output=True, text=True, timeout=15
                  )
              except subprocess.CalledProcessError as e:
                  print(f"     ⚠️ failed: {e.stderr[:100] if e.stderr else 'unknown'}")

          print(f"\n📊 Summary: {stale_count} stale issues found, {released_count} released")
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "## 🔓 Stale Mutex Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "Stale threshold: ${STALE_HOURS} hours" >> $GITHUB_STEP_SUMMARY
          echo "Dry-run: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for details." >> $GITHUB_STEP_SUMMARY

  live-smoke:
    needs: [resolve-execution-tier]
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_live_smoke == true || inputs.run_all == true)) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    concurrency:
      group: qa-live-smoke
      cancel-in-progress: false
    name: 🌐 Live Production Smoke (fail-closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # বাংলা মন্তব্য: লোকাল composite action লোডের আগেই checkout প্রয়োজন।
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-smoke
        with:
          tier: ${{ needs.resolve-execution-tier.outputs.execution_tier }}
          infisical_client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
          infisical_client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          infisical_project_slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          frontend_production_url: ${{ secrets.FRONTEND_PRODUCTION_URL }}
          production_url: ${{ secrets.PRODUCTION_URL }}
  # বাংলা মন্তব্য: আলাদা scheduled workflow নয়; প্রতিদিনের একক Nightly bundle।
  daily-key-health-sweep:
    needs: [resolve-execution-tier]
    name: Daily Key Health Sweep
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned verifier dependencies
        run: |
          set -euo pipefail
          # বাংলা মন্তব্য: config ও credential store-এর সরাসরি import-ও প্রয়োজন।
          grep -E '^(httpx|supabase|cryptography|pydantic-settings|fastapi)==' core/requirements.lock > /tmp/key-health-requirements.txt
          test "$(wc -l < /tmp/key-health-requirements.txt)" -eq 5
          python -m pip install -r /tmp/key-health-requirements.txt
      - name: Run daily key verifier
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPREMEAI_CREDENTIAL_ENC_KEY: ${{ secrets.SUPREMEAI_CREDENTIAL_ENC_KEY }}
          ENCRYPTION_KEYS: ${{ secrets.ENCRYPTION_KEYS }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python scripts/ops/daily_key_verifier.py
  db-retention:
    needs: [resolve-execution-tier]
    name: 🗑️ DB Retention Prune (logs + learning store)
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_db_retention == true || inputs.run_all == true)) ||
        (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * *'))
    concurrency:
      group: db-retention
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prune evolution_logs older than retention window
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RETENTION_DAYS: "30"
        run: |
          set -euo pipefail
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-zA-Z0-9-]+)\.supabase\.co.*#\1#')
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] || { echo "retention_days must be a positive integer" >&2; exit 2; }
          (( RETENTION_DAYS >= 7 && RETENTION_DAYS <= 3650 )) || { echo "retention_days must be between 7 and 3650" >&2; exit 2; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "SUPABASE_ACCESS_TOKEN is required" >&2; exit 2; }
          body=$(printf '{"query":"SELECT public.prune_evolution_logs(%s::integer) AS deleted"}' "$RETENTION_DAYS")
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          # Safety valve: an unexpected purge must fail closed for review.
          MAX_DELETED=${MAX_DELETED:-50000}
          http_code=$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" --connect-timeout 10 --max-time 120 \
            -o "$response_file" -w '%{http_code}')
          [[ "$http_code" == "200" || "$http_code" == "201" ]] || { echo "Retention API returned HTTP $http_code" >&2; exit 1; }
          python - "$response_file" "$MAX_DELETED" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          # The Management API /database/query returns the rows as a bare JSON
          # array; older builds wrapped them as {"result": [...]} / {"data": [...]}.
          # Handle both shapes so the daily prune cannot crash on the envelope.
          raw = payload if isinstance(payload, list) else payload.get("result", payload.get("data", []))
          print("retention prune completed; response received")
          if isinstance(raw, list) and raw and isinstance(raw[0], dict):
              deleted = raw[0].get("deleted")
              if isinstance(deleted, (int, float)) and deleted > int(sys.argv[2]):
                  raise SystemExit(f"refusing unexpected deletion count: {deleted}")
          PY

      - name: Prune learning store tables (Sprint 2 learning_store.sql)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RETENTION_DAYS: "30"
        run: |
          set -euo pipefail
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-zA-Z0-9-]+)\.supabase\.co.*#\1#')
          # prune_learning_data(retention_days) — created by
          # audit/migrations_out/learning_store.sql — prunes learning_events,
          # task_outcomes, feedback_events, fitness_snapshots, improvement_runs,
          # provider_metrics and skill_metrics (improvement_proposals and
          # prompt_candidates are kept). NOTE: if this function has not yet been
          # applied to prod (manual step: scripts/apply_sql.py pattern), this
          # step fails; that is intentional so the gap is visible.
          body=$(printf '{"query":"SELECT public.prune_learning_data(%s::integer) AS deleted"}' "$RETENTION_DAYS")
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_code=$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" --connect-timeout 10 --max-time 120 \
            -o "$response_file" -w '%{http_code}')
          [[ "$http_code" == "200" || "$http_code" == "201" ]] || { echo "Retention API returned HTTP $http_code" >&2; exit 1; }
          python - "$response_file" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          # Same envelope handling as step 1: bare array (current API) or
          # legacy {"result"}/{"data"} wrapper — both must parse.
          raw = payload if isinstance(payload, list) else payload.get("result", payload.get("data", []))
          if not (isinstance(raw, list) and raw and isinstance(raw[0], dict) and "deleted" in raw[0]):
              raise SystemExit("prune_learning_data response did not contain a deleted count")
          print("learning retention prune completed; response received")
          PY

      - name: Post-prune PostgreSQL planner statistics refresh (ANALYZE)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-zA-Z0-9-]+)\.supabase\.co.*#\1#')
          http_code=$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"ANALYZE;"}' --connect-timeout 10 --max-time 120 \
            -o /dev/null -w '%{http_code}')
          [[ "$http_code" == "200" || "$http_code" == "201" ]] || { echo "ANALYZE returned HTTP $http_code" >&2; exit 1; }
          echo "PostgreSQL ANALYZE planner refresh completed (HTTP $http_code)"

  e2e-customer:
    needs: [resolve-execution-tier]
    # বাংলা মন্তব্য: free tier-এর লিমিট নষ্ট না করার জন্য এবং retired QA surface-এর কারণে staging/E2E টেস্ট নিষ্ক্রিয় করা হয়েছে
    if: false
    concurrency:
      group: nightly-ops-e2e-customer
      cancel-in-progress: true
    name: 🎭 Customer E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QA_CUSTOMER_EMAIL: ${{ secrets.QA_CUSTOMER_EMAIL }}
      QA_CUSTOMER_PASSWORD: ${{ secrets.QA_CUSTOMER_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_ADMIN_TOTP_SECRET: ${{ secrets.QA_ADMIN_TOTP_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1

      # বাংলা: retired QA surface লুকিয়ে PNPM সেটআপের অস্পষ্ট error নয়।
      - name: Require customer E2E test surface
        run: |
          for path in package.json pnpm-lock.yaml qa/playwright.config.qa.ts qa/scripts/validate-checklist.ts qa/scripts/route-audit.ts; do
            if [ ! -f "$path" ]; then
              echo "::error::Customer E2E test surface missing: $path; no customer test ran."
              exit 1
            fi
          done

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
          install-deps: 'true'

      - name: Setup Bun (native TS script runner)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Fast Gate (checklist schema + route audit)
        run: |
          bun qa/scripts/validate-checklist.ts
          bun qa/scripts/route-audit.ts

      - name: Setup Playwright Browsers (Chromium)
        uses: ./.github/actions/setup-playwright
        with:
          browser: chromium

      - name: Determine Target Base URL
        id: target
        run: |
          STAGING="${{ secrets.STAGING_URL }}"
          if [ -n "$STAGING" ]; then
            echo "base_url=$STAGING" >> "$GITHUB_OUTPUT"
            echo "mode=remote" >> "$GITHUB_OUTPUT"
          elif [ -d studio ] && [ -f studio/package.json ]; then
            echo "mode=local-preview" >> "$GITHUB_OUTPUT"
            export VITE_USE_RELATIVE_PATH=true
            pnpm --filter supremeai-studio-client build
            pnpm --filter supremeai-studio-client exec vite preview --host 127.0.0.1 --port 3000 --strictPort &
            pnpm exec wait-on http://127.0.0.1:3000 -t 120000
            echo "base_url=http://127.0.0.1:3000" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Customer E2E requires an authorized STAGING_URL or a local Studio preview."
            exit 1
          fi

      - name: Check Credentials if Project Requires Auth
        id: auth_check
        run: |
          if [ -z "$QA_CUSTOMER_EMAIL" ] || [ -z "$QA_CUSTOMER_PASSWORD" ]; then
            echo "::error::Customer E2E credentials are missing; no authenticated customer test ran."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Execute Playwright Suite
        if: steps.auth_check.outputs.skip != 'true'
        env:
          QA_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          pnpm exec playwright test -c qa/playwright.config.qa.ts --project=setup-customer --project=customer

      - name: Generate QA Report + Release Gate
        if: always() && steps.auth_check.outcome == 'success' && steps.auth_check.outputs.skip != 'true'
        run: bun qa/scripts/generate-report.ts --results qa/results/results.json --out qa/results/report.md

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.auth_check.outcome == 'success' && steps.auth_check.outputs.skip != 'true'
        with:
          name: qa-customer-results
          path: |
            qa/results/results.json
            qa/results/report.md
            qa/results/html/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # ৩-স্তর টেস্টিং প্ল্যান (Phase 4) — নতুন টেস্টিং আর্মগুলো
  # (Tier-1 load / Tier-2 chaos / Tier-3 browser-e2e / DB-pool health)
  # ────────────────────────────────────────────────────────────────────────────
  load-locust:
    needs: [resolve-execution-tier]
    # বাংলা মন্তব্য: free tier-এর লিমিট নষ্ট না করার জন্য staging load test নিষ্ক্রিয় করা হয়েছে
    if: false
    concurrency:
      group: nightly-ops-load-locust
      cancel-in-progress: false
    name: 📈 Locust Load Test (Tier-1, 100 VU × 15m)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      STAGING_TARGET: ${{ secrets.STAGING_URL }}
      LOAD_TEST_TOKEN: ${{ secrets.LOAD_TEST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify staging target is configured (honest-skip doctrine)
        id: target
        run: |
          if [ -z "$STAGING_TARGET" ]; then
            echo "::error::STAGING_URL is required; the load test did not run."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Backend Environment
        if: steps.target.outputs.skip != 'true'
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: prepare

      # বাংলা মন্তব্য (Tier-1): locust dev-dep নয় — এই isolated job-এই ইনস্টল
      # হয় (gevent monkey-patching টেস্ট-স্যুইট প্রসেস থেকে দূরে থাকে; বিস্তারিত
      # backend/pyproject.toml-এর locust-কমেন্টে)।
      - name: Install Locust (isolated to this runner)
        if: steps.target.outputs.skip != 'true'
        working-directory: ./core
        run: python -m pip install --disable-pip-version-check "locust>=2.29,<3.0"

      - name: Run Locust (100 users, 15 minutes)
        if: steps.target.outputs.skip != 'true'
        working-directory: ./core
        run: |
          set -euo pipefail
          locust -f tests/load/locustfile.py \
            --headless --host "$STAGING_TARGET" \
            -u 100 -r 10 -t 15m \
            --csv /tmp/locust_stats --html /tmp/locust-report.html \
            --only-summary

      - name: SLO verdict from Locust CSV (p95 + failure ratio)
        if: steps.target.outputs.skip != 'true'
        working-directory: ./core
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, os, sys

          path = "/tmp/locust_stats_stats.csv"
          if not os.path.isfile(path):
              path = "/tmp/locust_stats.csv"
          agg = None
          with open(path, newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  if row.get("Name") == "Aggregated":
                      agg = row
                      break
          if agg is None:
              print("::error::Locust Aggregated row not found — gate cannot verify SLOs")
              sys.exit(1)

          reqs = int(float(agg["Request Count"]))
          fails = int(float(agg["Failure Count"]))
          p95 = float(agg.get("95%") or 0.0)
          fail_ratio = (fails / reqs) if reqs else 1.0

          lines = [
              "### 📈 Nightly Load Test (Tier-1)",
              "",
              f"- Requests: {reqs}, Failures: {fails} ({fail_ratio:.3%})",
              f"- p95: {p95:.0f} ms (gate < 2000 ms; steady-state target p95 < 1500 ms)",
              f"- Verdict: {'PASS' if (p95 < 2000 and fail_ratio < 0.01 and reqs > 0) else 'FAIL'}",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if reqs == 0 or p95 >= 2000 or fail_ratio >= 0.01:
              sys.exit(1)
          PY

      - name: Upload Locust report
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locust-load-report
          path: |
            /tmp/locust_stats*.csv
            /tmp/locust-report.html
          retention-days: 7

  chaos-suite:
    needs: [resolve-execution-tier]
    # #67 Tier 2: weekly Sun off-peak (was daily)
    if: >-
        (github.event_name == 'workflow_dispatch' && (inputs.run_chaos_suite == true || inputs.run_all == true)) ||
        ((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_all == true))
    concurrency:
      group: nightly-ops-chaos-suite
      cancel-in-progress: false
    name: 💉 Chaos Resilience Suite (Tier-2, -m chaos)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: prepare

      # বাংলা মন্তব্য (Tier-2): `chaos` marker PR-CI-তে deselect করা — এই রাতের
      # job-ই একমাত্র জায়গা যেখানে কেওস-চিহ্নিত ড্রিল (429-storm breaker,
      # memory-pressure hold) চলে। সব লোকাল/mocked — নেটওয়ার্ক নেই।
      - name: Run chaos-marked tests
        working-directory: ./core
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/core
        run: |
          set -euo pipefail
