name: client-release
# Unified Client Release Pipeline (root monorepo single door)
# Builds VS Code Extension (.vsix), Desktop Client (.exe/NSIS/MSI via Tauri),
# and Mobile Client (.apk via Capacitor). Runs only when relevant paths change
# (or via manual dispatch) to keep CI cost low.
# Desktop build prefers the local self-hosted Windows runner when online
# (saves cloud minutes); falls back to windows-latest otherwise.

on:
  push:
    branches: [main]
    paths:
      - "vscode/extension/**"
      - "vscode/desktop/**"
      - "vscode/mobile/**"
      - "vscode/package.json"
      - "vscode/package-lock.json"
  workflow_dispatch:
    inputs:
      release_extension:
        description: "Force release VS Code Extension (.vsix)"
        required: false
        type: boolean
        default: false
      release_desktop:
        description: "Force release Desktop Client (.exe & NSIS setup)"
        required: false
        type: boolean
        default: false
      release_mobile:
        description: "Force release Mobile Client (.apk)"
        required: false
        type: boolean
        default: false

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  runner-check:
    name: "Check Local Self-Hosted Runner"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      is_local_online: ${{ steps.rc.outputs.is_local_online }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve execution tier
        id: rc
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/resolve_execution_tier.py

  detect-changes:
    name: "Detect Client Changes"
    runs-on: ubuntu-24.04
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            extension:
              - 'vscode/extension/**'
              - 'vscode/package.json'
              - 'vscode/package-lock.json'
            desktop:
              - 'vscode/desktop/**'
              - 'vscode/package.json'
              - 'vscode/package-lock.json'
            mobile:
              - 'vscode/mobile/**'
              - 'vscode/package.json'
              - 'vscode/package-lock.json'

  package-extension:
    name: "Package & Release Extension (.vsix)"
    needs: detect-changes
    if: needs.detect-changes.outputs.extension == 'true' || github.event.inputs.release_extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile --workspace=extension

      - name: Run Extension Tests
        run: npm test --workspace=extension

      - name: Package VSIX Extension
        run: npx --yes @vscode/vsce package --no-git-tag-version --out supremeai-vscode.vsix
        working-directory: vscode/extension

      - name: Determine Version
        id: version
        run: |
          VER=$(node -p "require('./extension/package.json').version")
          echo "version=v$VER" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v6
        with:
          name: supremeai-vscode-vsix
          path: vscode/extension/supremeai-vscode.vsix
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: vscode/extension/supremeai-vscode.vsix
          tag_name: ${{ steps.version.outputs.version }}
          name: "SupremeAI IDE Bridge ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-local:
    name: "Build Desktop (Local Self-Hosted Windows)"
    needs: [detect-changes, runner-check]
    if: (needs.detect-changes.outputs.desktop == 'true' || github.event.inputs.release_desktop == 'true') && needs.runner-check.outputs.is_local_online == 'true'
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vscode/desktop/src-tauri -> vscode/desktop/src-tauri/target"

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Web App
        run: npm run build --workspace=desktop

      - name: Build Tauri NSIS Installer & Binary
        shell: cmd
        working-directory: vscode/desktop
        run: npx tauri build --config src-tauri/tauri.conf.json

      - name: Determine Desktop Version
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          echo "version=desktop-v$VER" >> "$GITHUB_OUTPUT"

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: supremeai-desktop-windows-x64
          path: |
            vscode/desktop/src-tauri/target/release/*.exe
            vscode/desktop/src-tauri/target/release/bundle/nsis/*.exe
            vscode/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Publish Desktop GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            vscode/desktop/src-tauri/target/release/*.exe
            vscode/desktop/src-tauri/target/release/bundle/nsis/*.exe
            vscode/desktop/src-tauri/target/release/bundle/msi/*.msi
          tag_name: ${{ steps.version.outputs.version }}
          name: "SupremeAI Desktop ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-cloud:
    name: "Build Desktop (Cloud windows-latest Fallback)"
    needs: [detect-changes, runner-check]
    if: (needs.detect-changes.outputs.desktop == 'true' || github.event.inputs.release_desktop == 'true') && needs.runner-check.outputs.is_local_online != 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vscode/desktop/src-tauri -> vscode/desktop/src-tauri/target"

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Web App
        run: npm run build --workspace=desktop

      - name: Build Tauri NSIS Installer & Binary
        shell: cmd
        working-directory: vscode/desktop
        run: npx tauri build --config src-tauri/tauri.conf.json

      - name: Sign Binaries and Installer (Fail-Closed Release Signing)
        shell: powershell
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            if ($env:REQUIRE_RELEASE_SIGNING -eq "true") {
              Write-Error "Release signing failed: WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD secrets are required for tagged releases."
              exit 1
            }
            Write-Warning "Signing secrets not configured for non-tag build; skipping binary signing."
            exit 0
          }
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found on runner."
            exit 1
          }
          $pfx = Join-Path $RUNNER_TEMP "release-signing-cert.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $binaries = Get-ChildItem -Path "vscode\desktop\src-tauri\target\release" -Include "*.exe","*.msi" -Recurse
            if (-not $binaries) {
              Write-Error "No release binaries found to sign."
              exit 1
            }
            foreach ($bin in $binaries) {
              Write-Host "Signing: $($bin.FullName)"
              & $signtool sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 $bin.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($bin.FullName)" }
              & $signtool verify /pa /v $bin.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($bin.FullName)" }
            }
          } finally {
            if (Test-Path $pfx) { Remove-Item -Path $pfx -Force -ErrorAction SilentlyContinue }
          }

      - name: Determine Desktop Version
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          echo "version=desktop-v$VER" >> "$GITHUB_OUTPUT"

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: supremeai-desktop-windows-x64
          path: |
            vscode/desktop/src-tauri/target/release/*.exe
            vscode/desktop/src-tauri/target/release/bundle/nsis/*.exe
            vscode/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Publish Desktop GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            vscode/desktop/src-tauri/target/release/*.exe
            vscode/desktop/src-tauri/target/release/bundle/nsis/*.exe
            vscode/desktop/src-tauri/target/release/bundle/msi/*.msi
          tag_name: ${{ steps.version.outputs.version }}
          name: "SupremeAI Desktop ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mobile:
    name: "Build & Release Mobile Client (Android .apk)"
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true' || github.event.inputs.release_mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build Mobile Web App & Prepare Dist
        run: |
          npm run build --workspace=mobile
          mkdir -p mobile/dist
          if [ ! -f mobile/dist/index.html ]; then
            printf '<!DOCTYPE html><html><head><meta charset="utf-8"><title>SupremeAI Mobile</title></head><body><div id="root"></div></body></html>' > mobile/dist/index.html
          fi

      - name: Sync Capacitor Android
        working-directory: vscode/mobile
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: vscode/mobile/android
        run: ./gradlew assembleDebug

      - name: Determine Mobile Version
        id: version
        run: |
          VER=$(node -p "require('./mobile/package.json').version")
          echo "version=mobile-v$VER" >> "$GITHUB_OUTPUT"

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v6
        with:
          name: supremeai-mobile-android-debug
          path: vscode/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Mobile GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: vscode/mobile/android/app/build/outputs/apk/debug/*.apk
          tag_name: ${{ steps.version.outputs.version }}
          name: "SupremeAI Mobile ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
