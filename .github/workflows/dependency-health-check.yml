name: 🩺 Dependency Health Check
true:
  push:
    branches:
    - main
    - develop
    paths:
    - '**/pnpm-lock.yaml'
    - '**/package.json'
    - '**/pyproject.toml'
    - '**/poetry.lock'
  pull_request:
    branches:
    - main
    - develop
    paths:
    - '**/pnpm-lock.yaml'
    - '**/package.json'
    - '**/pyproject.toml'
    - '**/poetry.lock'
  workflow_dispatch: null
concurrency:
  group: dependency-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-scan:
    name: 🩺 Dependency Health Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: pnpm
    - name: Install Node.js dependencies
      run: pnpm install --frozen-lockfile
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install Poetry
      run: pipx install poetry
    - name: Run Dependency Health Checker
      run: python scripts/security/check_dependencies.py
    timeout-minutes: 10
