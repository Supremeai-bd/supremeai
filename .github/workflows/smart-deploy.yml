# =============================================================================
# Smart Deploy Scheduler — SOFT-RETIRED (#4246 Phase 1)
# =============================================================================
# ⚠️  DEPRECATED: schedule-triggered time-window deploy path বন্ধ — deploy
#     decisions এখন একমাত্র deploy-train-ই নেয় (Pipeline 3)।
#
# বাংলা — কেন অবসর (#4246 ফরেনসিক প্রমাণসহ):
#   ১. `date -d "4 hours ago"` টাইম-উইন্ডো ডিটেকশন অনির্ণেয় (Rule 9 ভাঙে):
#      dropped cron run = ওই উইন্ডোর সব deploy চিরতরে মিস; আর `git log
#      --since` commit-DATE সেমান্টিক্সে পুরনো-তারিখের commit দেরিতে merge
#      হলে ধরাই পড়ে না → মিসড ডিপ্লয়, নীরবে। (লাইভ প্রমাণ: সাম্প্রতিক ৫টি
#      schedule run-এর ২টি failure।)
#   ২. `vercel deploy --prod ... || true` — deploy নিজেই ফাঁদ-সবুজ (Rule 10
#      ভাঙে: Missing evidence ≠ healthy)। ব্যর্থ vercel deploy সবুজ দেখাত।
#   ৩. force_deploy input খালি-উইন্ডোতে DEAD ছিল — `exit 0` force-override-এর
#      আগেই ফিরে যেত।
#   ৪. deploy-train এখন vercel/firebase স্টেশনসহ সম্পূর্ণ (#4246) — এই ফাইলের
#      সদৃশ deploy-পথ অপ্রয়োজনীয় ও drift-প্রবণ।
#
# নতুন দায়িত্ব-বিভাজন:
#   - প্রতি main push (vars.AUTO_DEPLOY_ENABLED == 'true') → main.yml →
#     deploy-train = নির্ধারিত SHA-ভিত্তিক (event.before...HEAD) deploy —
#     Render core/worker/scraper/mcp + Cloudflare + Vercel + Firebase।
#   - Deploy ব্যর্থতার তদারকি → deploy_doctor.py (Render failure detective)।
#   - জরুরি ম্যানুয়াল redeploy → এই ফাইলের workflow_dispatch (নিচে thin
#     wrapper) বা deploy-train-এর সরাসরি dispatch।
#
# Reversibility: schedule ফিরাতে চাইলে নিচের `schedule:` ব্লক আন-কমেন্ট করুন
# (auto-sync soft-retire-এর মতোই revertible soft-retire)।
# =============================================================================

name: 🧠 Smart Deploy Scheduler (retired → dispatch-only)

on:
  # SOFT-RETIRED (#4246): টাইম-উইন্ডো schedule অবসর — পুরনো ব্লক (revert করতে আন-কমেন্ট):
  # schedule:
  #   # Every 4 hours at :20 (#4208 — deconflicted from the :00 slot)
  #   - cron: "20 */4 * * *"
  workflow_dispatch:
    inputs:
      deploy-scraper:
        description: 'Scraper সার্ভিসও deploy হবে'
        required: false
        type: boolean
        default: false
      deploy-mcp:
        description: 'MCP Control Towerও deploy হবে'
        required: false
        type: boolean
        default: false
      deploy-cloudflare:
        description: 'Cloudflare Worker-ও deploy হবে'
        required: false
        type: boolean
        default: false
      deploy-frontend:
        description: 'Vercel (Frontend)-ও deploy হবে'
        required: false
        type: boolean
        default: false
      deploy-firebase:
        description: 'Firebase rules-ও deploy হবে'
        required: false
        type: boolean
        default: false

concurrency:
  group: smart-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # বাংলা (#4246): সম্পূর্ণ detect+deploy লজিক সরানো হয়েছে — deploy-train
  # নিজেই detect-changes চালায় (topology SSOT: config/service_topology.yaml)।
  # এই workflow এখন জরুরি-ম্যানুয়াল ট্রিগারের thin wrapper মাত্র।
  deploy:
    name: "🚆 Dispatch Deploy Train (all stations)"
    uses: ./.github/workflows/deploy-train.yml
    secrets: inherit
    with:
      deploy-scraper: ${{ inputs.deploy-scraper }}
      deploy-mcp: ${{ inputs.deploy-mcp }}
      deploy-cloudflare: ${{ inputs.deploy-cloudflare }}
      deploy-frontend: ${{ inputs.deploy-frontend }}
      deploy-firebase: ${{ inputs.deploy-firebase }}
