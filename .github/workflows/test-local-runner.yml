name: Test Local Self-Hosted Runner

on:
  workflow_dispatch:

jobs:
  test-local-runner:
    name: "Verify Local Self-Hosted Runner on Windows PC"
    runs-on: [self-hosted, local-pc]
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Runner OS and Environment
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Hello from SupremeAI Local Self-Hosted Runner!"
          Write-Host "Host Name: $env:COMPUTERNAME"
          Write-Host "User Domain: $env:USERDOMAIN"
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "Current Directory: $(Get-Location)"
          Write-Host "=========================================="

      - name: Fast Unit Test Smoke Check
        shell: powershell
        run: |
          python -V
          pytest --version
          pytest -q tests/unit/test_telemetry_event_bus_guard.py
