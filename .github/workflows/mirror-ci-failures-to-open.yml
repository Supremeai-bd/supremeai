name: 🪞 Mirror CI Failures to Open

on:
  workflow_run:
    workflows:
      - "Main CI/CD"
      - "🚦 Merge Gate (Sequential Landing)"
      - "Bridge Intake (public work orders → private gates)"
      - "🌿 Branch Creation Guard"
      - "PR Gate"
    types:
      - completed
  issues:
    types:
      - opened
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Core issue number to mirror"
        required: false
      run_id:
        description: "Workflow run ID to mirror"
        required: false

concurrency:
  group: mirror-ci-failures-to-open
  cancel-in-progress: false

jobs:
  mirror-failure:
    name: "🪞 Mirror Failure to supremeai-open"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Process Issue Trigger
        if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'area:ci') || contains(github.event.issue.labels.*.name, 'ci-failure') || contains(github.event.issue.labels.*.name, 'group:pipeline-failures'))
        env:
          OPEN_SYNC_PAT: ${{ secrets.OPEN_SYNC_PAT || secrets.SELF_HEAL_PAT || github.token }}
          CORE_REPO: ${{ github.repository }}
        run: |
          python scripts/ci/mirror_issue_to_open.py --issue-number ${{ github.event.issue.number }}

      - name: Process Workflow Run Failure
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          OPEN_SYNC_PAT: ${{ secrets.OPEN_SYNC_PAT || secrets.SELF_HEAL_PAT || github.token }}
          CORE_REPO: ${{ github.repository }}
        run: |
          python scripts/ci/mirror_issue_to_open.py --run-id ${{ github.event.workflow_run.id }}

      - name: Process Manual Dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          OPEN_SYNC_PAT: ${{ secrets.OPEN_SYNC_PAT || secrets.SELF_HEAL_PAT || github.token }}
          CORE_REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            python scripts/ci/mirror_issue_to_open.py --issue-number ${{ github.event.inputs.issue_number }}
          fi
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            python scripts/ci/mirror_issue_to_open.py --run-id ${{ github.event.inputs.run_id }}
          fi
