name: 'Setup Node & PNPM'
description: 'Standardized Node.js and PNPM setup with frozen cache'
inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  working-directory:
    description: 'Directory containing package.json / pnpm-lock.yaml'
    required: false
    default: '.'
  install-deps:
    description: 'Whether to run pnpm install'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    # #3265: `pnpm-version` ইনপুট ও `version:` হার্ডকোড সরানো হয়েছে —
    # pnpm সংস্করণের একমাত্র উৎস root package.json-এর `packageManager`
    # (SSOT)। হার্ডকোড সংস্করণ packageManager-এর সাথে সংঘর্ষে
    # ERR_PNPM_BAD_PM_VERSION → ব্যবহারকারী ৬ lane একসাথে লাল (PR gate সহ)।
    - name: Setup PNPM
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        # The monorepo has one lockfile at the repository root; frontend has no local lockfile.
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
