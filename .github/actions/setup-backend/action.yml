name: 'Setup Core Test Environment'
description: 'Install the current core runtime lock and test dependencies'
inputs:
  python-version:
    description: 'Python version to setup'
    required: false
    default: '3.11'
  install-browser-deps:
    description: 'Install the Python Playwright package'
    required: false
    default: 'false'
  mode:
    description: 'Only prepare mode is supported'
    required: false
    default: 'prepare'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: core/requirements.lock
    - name: Install core and test dependencies
      shell: bash
      env:
        SETUP_MODE: ${{ inputs.mode }}
        INSTALL_BROWSER: ${{ inputs.install-browser-deps }}
      run: |
        set -euo pipefail
        if [ "$SETUP_MODE" != prepare ]; then
          echo '::error::Only prepare mode is supported for the core test environment.'
          exit 1
        fi
        python -m pip install --prefer-binary -r core/requirements.lock pytest pytest-asyncio pytest-cov pytest-timeout pytest-mock aiosqlite fakeredis 'mcp>=1.28.1,<2'
        if [ "$INSTALL_BROWSER" = true ]; then
          python -m pip install 'playwright>=1.62.0,<2'
        fi
