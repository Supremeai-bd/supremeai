# G10 handoff (reaudit) — REPAIRED composite action (valid action.yml).
# APPLY MANUALLY — .github/ is bridge-protected. Review before committing.
# Place at: .github/actions/live-smoke/action.yml
#
# Job envelope stays in ops-maintenance.yml (NOT valid inside composite runs:):
#   needs:
#   - resolve-execution-tier
#   if: (github.event_name == 'workflow_dispatch' && inputs.run_live_smoke == true) || (github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 3 * * 1'))
#   concurrency:
#     group: qa-live-smoke
#     cancel-in-progress: false
#   name: 🌐 Live Production Smoke (fail-closed)
#   runs-on: ubuntu-24.04
#   timeout-minutes: 15
#
# secrets.* replaced with inputs.* (no secrets context inside composite).
#
name: Live Smoke
description: Live production smoke steps extracted from ops-maintenance live-smoke job (G10)
inputs:
  tier:
    description: Execution tier (informational; job-level if/needs stay in workflow)
    required: false
    default: ''
  infisical_client_id:
    description: INFISICAL_CLIENT_ID secret — pass from workflow
    required: true
  infisical_client_secret:
    description: INFISICAL_CLIENT_SECRET secret — pass from workflow
    required: true
  infisical_project_slug:
    description: INFISICAL_PROJECT_SLUG secret — pass from workflow
    required: true
  firebase_project_id:
    description: FIREBASE_PROJECT_ID secret — pass from workflow
    required: false
    default: ''
  frontend_production_url:
    description: FRONTEND_PRODUCTION_URL secret — pass from workflow
    required: false
    default: ''
  production_url:
    description: PRODUCTION_URL secret (vars.PRODUCTION_URL takes precedence)
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Import RENDER_CORE_URL from Infisical
    uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
    with:
      client-id: ${{ inputs.infisical_client_id }}
      client-secret: ${{ inputs.infisical_client_secret }}
      project-slug: ${{ inputs.infisical_project_slug }}
      env-slug: prod
      secret-path: /
      export-type: env
  - name: Checkout (canonical resolver lives in-repo)
    uses: actions/checkout@v5
  - name: Resolve live targets (canonical resolver, zero-hardcode, with provenance)
    id: resolve
    env:
      EXPLICIT_URL: ${{ vars.PRODUCTION_URL || inputs.production_url }}
      FRONTEND_EXPLICIT_URL: ${{ inputs.frontend_production_url }}
      FIREBASE_PROJECT: ${{ inputs.firebase_project_id }}
      RENDER_CORE: ${{ env.RENDER_CORE_URL }}
    run: python3 scripts/ci/resolve_production_targets.py --env-file "$GITHUB_ENV"
  - name: Require live target (fail-closed)
    if: ${{ env.UI_ORIGIN == '' && env.API_ORIGIN == '' }}
    run: 'echo "### 🌡️ Live Production Smoke" >> "$GITHUB_STEP_SUMMARY"

      echo "**UNVERIFIED** — no live target could be resolved. This job is fail-closed by design; it will not fabricate a pass." >> "$GITHUB_STEP_SUMMARY"

      echo "" >> "$GITHUB_STEP_SUMMARY"

      echo "Owner action: set repo **variable** \`vars.PRODUCTION_URL\` (or secret \`PRODUCTION_URL\`) to the deployed base URL that serves both UI and API, or ensure \`FIREBASE_PROJECT_ID\` / Infisical \`RENDER_CORE_URL\` are configured." >> "$GITHUB_STEP_SUMMARY"

      echo "::error::PRODUCTION_URL is not configured (and no FIREBASE_PROJECT_ID / RENDER_CORE_URL fallback resolvable) — live production path cannot be verified. Honest state: production liveness is UNVERIFIED."

      exit 1

      '
  - name: Probe live chain (customer chain + API direct, fail-closed)
    env:
      UI_ORIGIN: ${{ env.UI_ORIGIN }}
      UI_ORIGIN_SOURCE: ${{ env.UI_ORIGIN_SOURCE }}
      API_ORIGIN: ${{ env.API_ORIGIN }}
      API_ORIGIN_SOURCE: ${{ env.API_ORIGIN_SOURCE }}
      RENDER_WORKER_URL: ${{ env.RENDER_WORKER_URL }}
      RENDER_SCRAPER_URL: ${{ env.RENDER_SCRAPER_URL }}
      RENDER_MCP_URL: ${{ env.RENDER_MCP_URL }}
    run: "set -uo pipefail\npython3 - <<'PY'\nimport json, os, sys, time, urllib.error, urllib.request\nfrom datetime import datetime, timezone\n\n# বাংলা: প্রতিটি প্রোবের ব্যর্থতা প্রমাণসহ রেকর্ড হবে — কোনো ব্যতিক্রম চুপচাপ\n# গিলে ফেলা হবে না; একটিও FAIL হলে পুরো job লাল (fail-closed)।\n# Render free-tier cold-start (~50s) সত্য — তাই ২টি attempt + বড় timeout;\n# retry ব্যবহার হলে টেবিলে স্বচ্ছভাবে নোট হয় (নীরব নয়)।\nui = os.environ.get(\"UI_ORIGIN\", \"\").rstrip(\"/\")\nui_src = os.environ.get(\"UI_ORIGIN_SOURCE\", \"\")\napi = os.environ.get(\"API_ORIGIN\", \"\").rstrip(\"/\")\napi_src = os.environ.get(\"API_ORIGIN_SOURCE\", \"\")\n\ndef probe(label, url, timeout, judge):\n    # judge(status, body_bytes) -> note string; \"FAIL:...\" মানে ব্যর্থতা।\n    last = None\n    for attempt in (1, 2):\n        t0 = time.monotonic()\n        try:\n            req = urllib.request.Request(url, headers={\"User-Agent\": \"supremeai-live-smoke\"})\n            with urllib.request.urlopen(req, timeout=timeout) as resp:\n                code, body = resp.status, resp.read()\n            ms = int((time.monotonic() - t0) * 1000)\n            note = judge(code, body)\n            retry_note = \" (attempt 2, cold-start retry)\" if attempt == 2 else \"\"\n            return code, f\"{ms} ms\", note + retry_note\n        except urllib.error.HTTPError as exc:\n            # HTTPError-ও একটি সার্ভার রেসপন্স — judge এর সাথেই বিচার হোক।\n            # Render free-tier cold-start (502/503/504)-এ attempt 1 হলে ১৫ সেকেন্ড অপেক্ষা করে পুনরায় চেষ্টা করো।\n            code, body = exc.code, exc.read()\n            ms = int((time.monotonic() - t0) * 1000)\n            note = judge(code, body)\n            if attempt == 1 and code in (502, 503, 504):\n                time.sleep(15)\n                continue\n            retry_note = \" (attempt 2, cold-start retry)\" if attempt == 2 else \"\"\n            return code, f\"{ms} ms\", note + retry_note\n        except Exception as exc:  # noqa: BLE001 — ব্যর্থতা প্রমাণসহ রেকর্ড হবে\n            last = (type(exc).__name__, str(exc))\n            if attempt == 1:\n                time.sleep(15)\n    return \"FAIL\", \"—\", f\"{last[0]}: {last[1]}\"\n\ndef j200(code, body, expect_keys=()):\n    if code != 200:\n        return f\"FAIL: expected 200, got {code}\"\n    try:\n        data = json.loads(body)\n    except Exception:  # noqa: BLE001 — শরীরে অ-JSON = চুক্তি ভাঙা\n        return \"FAIL: non-JSON body\"\n    missing = [k for k in expect_keys if k not in data]\n    if missing:\n        return f\"FAIL: missing key(s) {','.join(missing)}\"\n    return \"json ok ✓\"\n\nrows, failed = [], False\n\ndef record(layer, label, url, code, latency, note):\n    # বাংলা: heredoc স্ক্রিপ্ট মডিউল-লেভেল — তাই nonlocal নয়, global।\n    global failed\n    if note.startswith(\"FAIL\"):\n        failed = True\n    rows.append((layer, label, url, str(code), latency, note))\n\n# ---- স্তর A: কাস্টমার চেইন (SPA + CORS-verified direct API call) ----\n# বাংলা: ব্রাউজার ঠিক এভাবেই কল করে — SPA লোড হয় UI origin থেকে, তারপর\n# JS API origin-এ direct কল পাঠায় Origin হেডারসহ; সার্ভারকে অবশ্যই\n# access-control-allow-origin দিয়ে সাড়া দিতে হবে (নইলে ব্রাউজার\n# রেসপন্স ব্লক করে)। এটিই প্রকৃত প্রোডাকশন পাথ — same-origin rewrite নয়।\nif ui and api:\n    print(f\"Layer A origin (UI): {ui}  (source: {ui_src})\")\n    c, l, n = probe(\"frontend /\", ui + \"/\", 45,\n                    lambda c, b: \"SPA served ✓\" if c == 200 and b[:15] == b\"<!doctype html>\" else f\"FAIL: expected 200 SPA html, got {c}\")\n    record(\"A chain\", \"frontend / (SPA)\", ui + \"/\", c, l, n)\n\n    def cors_judge(code, body):\n        # বাংলা: CORS চুক্তি — Origin: UI origin পাঠালে সার্ভারের\n        # allow-origin হেডার অবশ্যই সাড়া দেবে; 200 JSON-ও লাগবে।\n        if code != 200:\n            return f\"FAIL: expected 200, got {code}\"\n        try:\n            data = json.loads(body)\n        except Exception:  # noqa: BLE001 — অ-JSON = চুক্তি ভাঙা\n            return \"FAIL: non-JSON body\"\n        if \"status\" not in data:\n            return \"FAIL: missing key(s) status\"\n        return \"CORS ✓ + json ok ✓\"\n\n    req_headers = {\"User-Agent\": \"supremeai-live-smoke\", \"Origin\": ui}\n    last = None\n    got = None\n    for attempt in (1, 2):\n        t0 = time.monotonic()\n        try:\n            req = urllib.request.Request(api + \"/api/v1/health/live\", headers=req_headers)\n            with urllib.request.urlopen(req, timeout=90) as resp:\n                code, body = resp.status, resp.read()\n                # বাংলা: resp.headers (HTTPMessage) case-insensitive — dict() নয়,\n                # নইলে HTTP/2-এর lowercase হেডার মিস হয়।\n                allow = resp.headers.get(\"Access-Control-Allow-Origin\", \"\")\n            ms = int((time.monotonic() - t0) * 1000)\n            note = cors_judge(code, body)\n            if allow and (allow == ui or allow == \"*\"):\n                note = note.replace(\"CORS ✓\", f\"CORS allow-origin={allow} ✓\")\n            elif code == 200:\n                note = \"FAIL: 200 but no access-control-allow-origin for UI origin (browser would block)\"\n            retry_note = \" (attempt 2, cold-start retry)\" if attempt == 2 else \"\"\n            got = (code, f\"{ms} ms\", note + retry_note)\n            break\n        except Exception as exc:  # noqa: BLE001 — ব্যর্থতা প্রমাণসহ রেকর্ড হবে\n            last = (type(exc).__name__, str(exc))\n            if attempt == 1:\n                time.sleep(15)\n    if got is None:\n        got = (\"FAIL\", \"—\", f\"{last[0]}: {last[1]}\")\n    record(\"A chain\", \"API direct call w/ Origin (browser path)\", api + \"/api/v1/health/live\", got[0], got[1], got[2])\nelif ui:\n    # বাংলা: UI origin আছে কিন্তু API origin নেই — SPA প্রোব হবে, API চেইন UNVERIFIED।\n    print(f\"Layer A origin (UI): {ui}  (source: {ui_src})\")\n    c, l, n = probe(\"frontend /\", ui + \"/\", 45,\n                    lambda c, b: \"SPA served ✓\" if c == 200 and b[:15] == b\"<!doctype html>\" else f\"FAIL: expected 200 SPA html, got {c}\")\n    record(\"A chain\", \"frontend / (SPA)\", ui + \"/\", c, l, n)\n    rows.append((\"A chain\", \"API direct call w/ Origin (browser path)\", \"(no API origin resolvable)\", \"SKIP\", \"—\", \"UNVERIFIED — no API origin (configure RENDER_CORE_URL in Infisical or PRODUCTION_URL)\"))\nelse:\n    # বাংলা: UI origin ডেরাইভ করা যায়নি — নীরব পাস নয়; স্পষ্ট UNVERIFIED সারি।\n    rows.append((\"A chain\", \"frontend /\", \"(no UI origin resolvable)\", \"SKIP\", \"—\", \"UNVERIFIED — no UI origin (configure PRODUCTION_URL or FIREBASE_PROJECT_ID)\"))\n\n# ---- স্তর B: API সরাসরি ----\nif api:\n    print(f\"Layer B origin: {api}  (source: {api_src})\")\n    c, l, n = probe(\"health live (direct)\", api + \"/api/v1/health/live\", 90,\n                    lambda c, b: j200(c, b, (\"status\",)))\n    record(\"B api-direct\", \"/api/v1/health/live\", api + \"/api/v1/health/live\", c, l, n)\n    c, l, n = probe(\"health ready (direct)\", api + \"/api/v1/health/ready\", 90,\n                    lambda c, b: j200(c, b, (\"status\",)))\n    record(\"B api-direct\", \"/api/v1/health/ready\", api + \"/api/v1/health/ready\", c, l, n)\n\n    def plans_judge(code, body):\n        # বাংলা: চুক্তি — plans dict-shaped হবে। আনঅথেনটিকেটেড প্রোবে সচল\n        # মিডলওয়্যার 401 দেয় (রুট উপস্থিত + সৎ guard) — উভয়ই সৎ অবস্থা;\n        # 404/5xx/অ-JSON = ভাঙা।\n        if code == 200:\n            try:\n                data = json.loads(body)\n            except Exception:  # noqa: BLE001\n                return \"FAIL: non-JSON body on 200\"\n            if isinstance(data, dict) and \"plans\" in data:\n                return \"plans-key ✓ (dict contract)\"\n            return \"FAIL: plans-key missing (contract drift!)\"\n        if code == 401:\n            return \"auth-gated ✓ (route present, middleware honest)\"\n        return f\"FAIL: expected 200/401, got {code}\"\n\n    c, l, n = probe(\"billing plans contract\", api + \"/api/billing/plans\", 90, plans_judge)\n    record(\"B api-direct\", \"/api/billing/plans\", api + \"/api/billing/plans\", c, l, n)\nelse:\n    rows.append((\"B api-direct\", \"API probes\", \"(no API origin resolvable)\", \"SKIP\", \"—\", \"UNVERIFIED — no API origin (configure RENDER_CORE_URL in Infisical or PRODUCTION_URL)\"))\n\n# ---- স্তর C: মাইক্রোসার্ভিস ও ফেডারেশন নোডস (Issue #1290) ----\nworker_url = os.environ.get(\"RENDER_WORKER_URL\", \"\").rstrip(\"/\")\nscraper_url = os.environ.get(\"RENDER_SCRAPER_URL\", \"\").rstrip(\"/\")\nmcp_url = os.environ.get(\"RENDER_MCP_URL\", \"\").rstrip(\"/\")\n\nif worker_url:\n    c, l, n = probe(\"worker node /health\", worker_url + \"/health\", 45, lambda c, b: \"worker alive ✓\" if c == 200 else f\"FAIL: expected 200, got {c}\")\n    record(\"C microservices\", \"supremeai-worker-node\", worker_url + \"/health\", c, l, n)\nelse:\n    rows.append((\"C microservices\", \"supremeai-worker-node\", \"(no RENDER_WORKER_URL)\", \"SKIP\", \"—\", \"UNVERIFIED — no RENDER_WORKER_URL in Infisical\"))\n\nif scraper_url:\n    c, l, n = probe(\"scraper node /health\", scraper_url + \"/health\", 45, lambda c, b: \"scraper alive ✓\" if c == 200 else f\"FAIL: expected 200, got {c}\")\n    record(\"C microservices\", \"supremeai-scraper-node\", scraper_url + \"/health\", c, l, n)\nelse:\n    rows.append((\"C microservices\", \"supremeai-scraper-node\", \"(no RENDER_SCRAPER_URL)\", \"SKIP\", \"—\", \"UNVERIFIED — no RENDER_SCRAPER_URL in Infisical\"))\n\nif mcp_url:\n    c, l, n = probe(\"mcp tower /health\", mcp_url + \"/health\", 45, lambda c, b: \"mcp alive ✓\" if c == 200 else f\"FAIL: expected 200, got {c}\")\n    record(\"C microservices\", \"supremeai-mcp-tower\", mcp_url + \"/health\", c, l, n)\nelse:\n    rows.append((\"C microservices\", \"supremeai-mcp-tower\", \"(no RENDER_MCP_URL)\", \"SKIP\", \"—\", \"UNVERIFIED — no RENDER_MCP_URL in Infisical\"))\n\nverdict = (\"✅ PASS — live production path verified (customer chain + API + microservices)\"\n           if not failed else \"❌ FAIL — live production path broken\")\nsummary = os.environ.get(\"GITHUB_STEP_SUMMARY\")\ncontent = [\n    \"### \U0001F321️ Live Production Smoke\",\n    f\"**{verdict}**\",\n    \"\",\n    f\"- Layer A origin: `{ui or '(none)'}` — source: {ui_src or '-'}\",\n    f\"- Layer B origin: `{api or '(none)'}` — source: {api_src or '-'}\",\n    \"\",\n    \"| layer | probe | url | status | latency | note |\",\n    \"|---|---|---|---|---|---|\",\n    *((\"| \" + \" | \".join(r) + \" |\") for r in rows),\n    \"\",\n    \"Root-cause hint: Layer A SPA FAIL = hosting/CDN issue. Layer A CORS call FAIL + Layer B PASS = the backend is alive but rejects/blocks the UI origin — check the API CORS config (USER_CORS_ORIGINS / CORS_ORIGINS) and the VITE_* backend URL baked into the SPA build. Layer B FAIL = API service itself down.\",\n    \"\",\n]\ntext = \"\\n\".join(content) + \"\\n\"\nprint(text)\nif summary:\n    with open(summary, \"a\", encoding=\"utf-8\") as fh:\n        fh.write(text)\n\n# ---- মেশিন-পাঠযোগ্য production certification artifact (issue #1096) ----\n# বাংলা: human table যথেষ্ট নয় — release certification + CI-কে একই\n# সত্য machine-readable আকারে দরকার। নীতি: UNVERIFIED != PASS —\n# প্রতিটি সারির state স্পষ্ট (PASS/FAIL/UNVERIFIED), provenance সহ।\n# এটি কমিট হয় না (runtime ডেটা) — Actions artifact হিসেবে থাকে।\ndef row_state(r):\n    layer, label, url, status, latency, note = r\n    if str(status) == \"SKIP\":\n        return \"UNVERIFIED\"\n    if str(note).startswith(\"FAIL\"):\n        return \"FAIL\"\n    return \"PASS\"\n\ncert = {\n    \"schema_version\": \"1.0\",\n    \"doctrine\": \"UNVERIFIED != PASS\",\n    \"generated_at\": datetime.now(timezone.utc).isoformat(),\n    \"commit\": os.environ.get(\"GITHUB_SHA\", \"\"),\n    \"run_id\": os.environ.get(\"GITHUB_RUN_ID\", \"\"),\n    \"verdict\": \"FAIL\" if failed else \"PASS\",\n    \"targets\": {\n        \"ui_origin\": {\"value\": ui, \"source\": ui_src},\n        \"api_origin\": {\"value\": api, \"source\": api_src},\n    },\n    \"probes\": [\n        {\n            \"layer\": r[0],\n            \"probe\": r[1],\n            \"url\": r[2],\n            \"observed\": r[3],\n            \"latency\": r[4],\n            \"note\": r[5],\n            \"state\": row_state(r),\n        }\n        for r in rows\n    ],\n    \"summary\": {\n        \"total\": len(rows),\n        \"pass\": sum(1 for r in rows if row_state(r) == \"PASS\"),\n        \"fail\": sum(1 for r in rows if row_state(r) == \"FAIL\"),\n        \"unverified\": sum(1 for r in rows if row_state(r) == \"UNVERIFIED\"),\n    },\n}\nout_dir = os.environ.get(\"CI_REPORTS_DIR\", \"ci-reports\")\nos.makedirs(out_dir, exist_ok=True)\nout_path = os.path.join(out_dir, \"production-certification.json\")\nwith open(out_path, \"w\", encoding=\"utf-8\") as fh:\n    json.dump(cert, fh, indent=2, ensure_ascii=False)\n    fh.write(\"\\n\")\nprint(f\"certification artifact: {out_path}\")\nsys.exit(1 if failed else 0)\nPY\n"
  - name: Upload production certification artifact (issue
    if: always()
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    with:
      name: production-certification-${{ github.sha }}
      path: ci-reports/production-certification.json
      retention-days: 30
      if-no-files-found: error
