# SupremeAI Unified Monorepo - Render Blueprint
services:
  - type: web
    name: supremeai-api
    runtime: docker
    plan: free
    # GitHub Actions owns selective deployment. Keeping Render native
    # autoDeploy enabled would rebuild this service on every main commit.
    autoDeploy: false
    dockerfilePath: gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: GATEWAY_CONFIG
        value: config/routing_policy.example.json
      - key: GATEWAY_USAGE_LOG
        value: /tmp/supremeai_api_usage.jsonl
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: STEALTH_WEBHOOK_URL
        sync: false
      - key: STEALTH_WEBHOOK_SECRET
        sync: false
      # Required by the core runtime if this service owns Redis-backed paths.
      # Provision the value through the approved secret manager; never commit
      # the secret value to this file.
      - key: UPSTASH_REDIS_REST_URL
        sync: false

  - type: web
    name: supremeai-browser
    runtime: docker
    plan: free
    # GitHub Actions owns selective deployment. Keeping Render native
    # autoDeploy enabled would rebuild this service on every main commit.
    autoDeploy: false
    dockerfilePath: browser/Dockerfile
    dockerContext: browser
    healthCheckPath: /health
    envVars:
      - key: GEMINI_PROFILE_DIR
        value: /tmp/profile
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: STEALTH_WEBHOOK_SECRET
        sync: false
      - key: CREDENTIAL_MASTER_KEY
        sync: false

  - type: web
    name: supremeai-mcp-tower
    env: node
    plan: free
    autoDeploy: false
    rootDir: infrastructure/mcp-control-plane
    healthCheckPath: /health
    buildCommand: npm ci && npm run build
    # Fix (audit 2026-11-11): the bootstrap lives at repo root, NOT under this
    # rootDir — the previous relative path crashed start on fresh deploys with
    # "can't open file". Fall back to plain start only if python3 is absent.
    startCommand: sh -c 'if command -v python3 >/dev/null 2>&1; then python3 ../../scripts/runtime/infisical_bootstrap.py npm run start; else npm run start; fi'
    envVars:
      # Fix (audit 2026-11-11): production gates (webhook HMAC verification,
      # health-endpoint auth, admin-route fail-closed 503) are all conditioned on
      # NODE_ENV === "production"; the node runtime image does not set it.
      - key: NODE_ENV
        value: production
      - key: MCP_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: RENDER_API_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_SECRET_PATH
        value: /
      - key: INFISICAL_TOKEN
        sync: false
      - key: SUPREMEAI_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: MCP_ADMIN_KEY
        sync: false
      - key: TOWER_AUTH_TOKEN
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
