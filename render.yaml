# SupremeAI Unified Monorepo - Render Blueprint
services:
  - type: web
    name: supremeai-api
    runtime: docker
    plan: free
    # GitHub Actions owns selective deployment. Keeping Render native
    # autoDeploy enabled would rebuild this service on every main commit.
    autoDeploy: false
    dockerfilePath: gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # `ENV` drives security defaults in gateway/service/admin_auth.py
      # (Secure/SameSite cookie flags, dev-secret refusal). Without it the app
      # falls back to "local", which issues admin cookies without Secure.
      - key: ENV
        value: production
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: STEALTH_WEBHOOK_URL
        sync: false
      - key: STEALTH_WEBHOOK_SECRET
        sync: false
      # Required by the core runtime if this service owns Redis-backed paths.
      # Provision the value through the approved secret manager; never commit
      # the secret value to this file.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      # Audit P1-27 fix: the gateway previously received only the URL — Redis
      # caching silently no-oped without the token (the tower service already
      # passes both).
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  - type: web
    name: supremeai-browser
    runtime: docker
    plan: free
    # GitHub Actions owns selective deployment. Keeping Render native
    # autoDeploy enabled would rebuild this service on every main commit.
    autoDeploy: false
    dockerfilePath: browser/Dockerfile
    dockerContext: browser
    healthCheckPath: /health
    envVars:
      - key: GEMINI_PROFILE_DIR
        value: /tmp/profile
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: STEALTH_WEBHOOK_SECRET
        sync: false
      - key: CREDENTIAL_MASTER_KEY
        sync: false

  - type: web
    name: supremeai-mcp-tower-live
    env: node
    plan: free
    autoDeploy: false
    rootDir: infrastructure/mcp-control-plane
    healthCheckPath: /health
    # Fix (audit F5, 2026-11-25): devtools_* tools spawned `chrome` (default of
    # DEVTOOLS_CHROME_PATH) and failed with `spawn chrome ENOENT` — the node
    # runtime image ships no browser, leaving render-mcp permanently degraded
    # and devtools_audit stuck on its HTTP fallback verdict.
    # বাংলা মন্তব্য (2026-11-26): Render native (env: node) বিল্ড root ছাড়া চলে —
    # apt-get ও /usr/local/bin-এ লেখা ব্যর্থ হয়, তাই লাইভে এখনো ENOENT। এখন
    # pinned chrome-headless-shell rootDir-এর ভেতরে (.devtools-browser/) নামানো হয়,
    # যা বিল্ড থেকে রানটাইমে একই পাথে থাকে; symlink `.devtools-browser/chrome`।
    # ব্রাউজার নামাতে ব্যর্থ হলে বিল্ড ভাঙে না (devtools শুধু HTTP fallback-এ থাকে)।
    # @puppeteer/browsers is version-pinned (#2525 policy).
    buildCommand: >
      npm ci && npm run build &&
      (npx -y @puppeteer/browsers@3.3.0 install chrome-headless-shell@stable --path "$PWD/.devtools-browser" &&
       ln -sf "$(find "$PWD/.devtools-browser" -type f -name chrome-headless-shell | head -1)" "$PWD/.devtools-browser/chrome" &&
       "$PWD/.devtools-browser/chrome" --version ||
       echo "WARN: chrome-headless-shell install failed; devtools_* stays on HTTP fallback")
    # Fix (audit 2026-11-11): the bootstrap lives at repo root, NOT under this
    # rootDir — the previous relative path crashed start on fresh deploys with
    # "can't open file". Fall back to plain start only if python3 is absent.
    startCommand: sh -c 'if command -v python3 >/dev/null 2>&1; then python3 ../../scripts/runtime/infisical_bootstrap.py npm run start; else npm run start; fi'
    envVars:
      # Fix (audit 2026-11-11): production gates (webhook HMAC verification,
      # health-endpoint auth, admin-route fail-closed 503) are all conditioned on
      # NODE_ENV === "production"; the node runtime image does not set it.
      - key: NODE_ENV
        value: production
      - key: MCP_API_KEY
        generateValue: true
      # Fix (audit F5, 2026-11-25): explicit browser binary for the devtools
      # adapter (src/lib/env.ts -> devtools.chromePath). The buildCommand above
      # symlinks the pinned chrome-headless-shell build here (Render checkout
      # root /opt/render/project/src + this service's rootDir).
      - key: DEVTOOLS_CHROME_PATH
        value: /opt/render/project/src/infrastructure/mcp-control-plane/.devtools-browser/chrome
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: RENDER_API_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_SECRET_PATH
        value: /
      - key: INFISICAL_TOKEN
        sync: false
      - key: SUPREMEAI_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: MCP_ADMIN_KEY
        sync: false
      # Fix (wiring audit 2026-11-11): consumed by the tower's admin-slot TOTP gate
      # (src/policy/slot-verification.ts) but missing from the blueprint — the 2nd-step
      # admin factor could never be provisioned from here.
      - key: SUPREMEAI_ADMIN_TOTP_SECRET
        sync: false
      # Removed TOWER_AUTH_TOKEN (wiring audit): no tower code reads it; it is a
      # satellite-side name (core/client/supreme-node/daemon.py). The server-side
      # contract is MCP_API_KEY / MCP_ADMIN_KEY.
      - key: GH_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
